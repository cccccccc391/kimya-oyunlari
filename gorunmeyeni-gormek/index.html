/* Görünmeyeni Görmek — akıllı tahta için büyük, okunaklı arayüz */
:root {
  --kagit: #f5f1e8;

}

}

/* Görev listesi */
.gorev-listesi { list-style: none; padding: 0 !important; margin: .5rem 0; }

}

/* Sınıflandırma */
.siniflandir-kartlar { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0; }

}

}

}

}

  padding: .55rem .8rem; background: var(--sim2); border-top: 1px solid var(--sim-cizgi);
}
.sim-kontrol .dugme { background: #1e2a42; color: #f1f5fb; border-color: #3d4e72; min-height: 2.4rem; }

.kaydirici, .secici-kap { display: inline-flex; align-items: center; gap: .5rem; color: #e6edf7; }
.kaydirici-etiket { font-size: .85rem; color: #b7c3d8; font-weight: 600; }
.kaydirici-deger { min-width: 5.5em; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }

.secici { display: inline-flex; border-radius: 10px; overflow: hidden; border: 2px solid #3d4e72; flex-wrap: wrap; }
.secici button {
  border: 0; background: #1e2a42; color: #dbe5f5; padding: .4em .8em; min-height: 2.3rem; cursor: pointer;
  font-weight: 600; border-right: 1px solid #3d4e72; touch-action: manipulation;
}
.secici button:last-child { border-right: 0; }
.secici button.secili { background: #3b82f6; color: #fff; }
.sim-tablo { border-collapse: collapse; font-size: .85rem; color: #e6edf7; }
.sim-tablo th, .sim-tablo td { border: 1px solid #33456a; padding: .2rem .5rem; text-align: center; font-variant-numeric: tabular-nums; }
.sim-tablo th { background: #1b2740; color: #b9d4ff; }
.sahne-bildirim {
  position: absolute; top: 3.2rem; left: 50%; transform: translateX(-50%);
  background: rgba(255, 255, 255, .96); color: #10213a; padding: .45rem 1.1rem; border-radius: 999px;
  font-weight: 700; box-shadow: 0 6px 22px rgba(0, 0, 0, .35); z-index: 5; pointer-events: none;
  animation: bildirim 3.2s forwards; max-width: 90%; text-align: center;
}

/* ---------- Harita ---------- */
.harita { flex: 1 1 auto; overflow-y: auto; padding: 1.2rem 2rem 3rem; }

.yontem-seridi span.adim { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 999px; padding: .15rem .7rem; font-weight: 700; color: var(--murekkep); }

.durak-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: .75rem; margin-top: .8rem; }
.durak-karti {

}

/* ---------- Modal ---------- */

.muze-kart { background: var(--yuzey); border-radius: var(--r); overflow: hidden; box-shadow: var(--golge); }

}

/* ---------- Dar ekranlar ---------- */

  #uygulama { height: auto; min-height: 100vh; overflow: visible; }
  .durak-govde { grid-template-columns: 1fr; grid-template-rows: auto auto; }

<script>/* js/temel.js */
/* Görünmeyeni Görmek — temel yardımcılar (DOM, tuval, döngü, arayüz parçaları, sayı biçimi) */
'use strict';
var GG = window.GG = window.GG || {};

(function () {
  // ---------- Kayıt defterleri ----------
  GG.duraklar = [];
  GG.durakEkle = function (d) { GG.duraklar.push(d); };
  GG.durakBul = function (id) {
    for (var i = 0; i < GG.duraklar.length; i++) if (GG.duraklar[i].id === id) return GG.duraklar[i];
    return null;
  };
  GG.simler = {};
  GG.simKaydet = function (id, kur) { GG.simler[id] = kur; };
  GG.modeller = {};
  GG.modelKaydet = function (id, tanim) { GG.modeller[id] = tanim; };
  GG.adimTurleri = {};

  // ---------- DOM ----------
  function ekle(d, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { ekle(d, x); }); return; }
    if (typeof c === 'string' || typeof c === 'number') { d.appendChild(document.createTextNode(String(c))); return; }
    d.appendChild(c);
  }
  GG.el = function (etiket, oz, cocuklar) {
    var d = document.createElement(etiket);
    if (oz) {
      Object.keys(oz).forEach(function (k) {
        var v = oz[k];
        if (v == null || v === false) return;
        if (k === 'sinif') d.className = v;
        else if (k === 'html') d.innerHTML = v;
        else if (k === 'metin') d.textContent = v;
        else if (k === 'stil') d.setAttribute('style', v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') d.addEventListener(k.slice(2), v);
        else d.setAttribute(k, v === true ? '' : v);
      });
    }
    ekle(d, cocuklar);
    return d;
  };
  GG.bosalt = function (d) { while (d.firstChild) d.removeChild(d.firstChild); };

  // ---------- Kalıcı kayıt (tarayıcı belleği; yoksa sessizce geçer) ----------
  GG.depo = {
    oku: function (k, v) {
      try { var s = window.localStorage.getItem(k); return s ? JSON.parse(s) : v; } catch (e) { return v; }
    },
    yaz: function (k, v) {
      try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* bellek kapalı olabilir */ }
    }
  };

  // ---------- Sayılar ----------
  GG.sayi = function (x, basamak) {
    if (basamak == null) basamak = 0;
    var s = Math.abs(x).toFixed(basamak);
    var parca = s.split('.');
    var tam = parca[0];
    if (tam.length > 4) tam = tam.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (x < 0 && Number(s) !== 0 ? '−' : '') + tam + (parca[1] ? ',' + parca[1] : '');
  };
  var UST = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  GG.ust = function (n) { return String(n).split('').map(function (c) { return UST[c] || c; }).join(''); };
  GG.bilimsel = function (x, basamak) {
    if (basamak == null) basamak = 2;
    if (x === 0) return '0';
    var us = Math.floor(Math.log10(Math.abs(x)));
    var m = x / Math.pow(10, us);
    if (Number(Math.abs(m).toFixed(basamak)) >= 10) { m /= 10; us += 1; }
    return GG.sayi(m, basamak) + ' × 10' + GG.ust(us);
  };

  // ---------- Rastgelelik ----------
  GG.karistir = function (dizi) {
    var a = dizi.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  GG.gauss = function () {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  // ---------- Tuval (canvas) ----------
  GG.tuval = function (kap) {
    var cv = document.createElement('canvas');
    cv.className = 'tuval';
    kap.appendChild(cv);
    var ctx = cv.getContext('2d');
    var t = { cv: cv, ctx: ctx, w: 1, h: 1, dpr: 1, _cb: [] };
    function boyutla() {
      var r = kap.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      if (w === t.w && h === t.h && dpr === t.dpr) return;
      t.w = w; t.h = h; t.dpr = dpr;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      t._cb.forEach(function (f) { f(w, h); });
    }
    var ro = ('ResizeObserver' in window) ? new ResizeObserver(boyutla) : null;
    if (ro) ro.observe(kap); else window.addEventListener('resize', boyutla);
    boyutla();
    t.boyutla = boyutla;
    t.boyutDegisti = function (f) { t._cb.push(f); };
    t.konum = function (e) {
      var r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    t.temizle = function (renk) {
      ctx.setTransform(t.dpr, 0, 0, t.dpr, 0, 0);
      if (renk) { ctx.fillStyle = renk; ctx.fillRect(0, 0, t.w, t.h); } else ctx.clearRect(0, 0, t.w, t.h);
    };
    t.yoket = function () {
      if (ro) ro.disconnect(); else window.removeEventListener('resize', boyutla);
      if (cv.parentNode) cv.parentNode.removeChild(cv);
    };
    return t;
  };

  // Tuval yazı tipi: boyut px cinsinden
  GG.font = function (px, kalin) {
    return (kalin ? '700 ' : '') + Math.round(px) + 'px "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif';
  };
  // Sahnedeki tuvaller için okunaklı temel yazı boyu
  GG.yaziBoyu = function (t) { return Math.max(13, Math.min(26, Math.min(t.h / 30, t.w / 48))); };

  // ---------- Animasyon döngüsü ----------
  GG.dongu = function (fn) {
    var id = 0, son = 0, calisiyor = true;
    function f(zaman) {
      if (!calisiyor) return;
      var dt = son ? Math.min(0.05, (zaman - son) / 1000) : 0.016;
      son = zaman;
      fn(dt, zaman);
      if (calisiyor) id = requestAnimationFrame(f);
    }
    id = requestAnimationFrame(f);
    return function () { calisiyor = false; cancelAnimationFrame(id); };
  };

  // ---------- Çizim yardımcıları ----------
  GG.ciz = {
    yd: function (ctx, x, y, w, h, r) { // yuvarlak köşeli dikdörtgen yolu
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    },
    ok: function (ctx, x1, y1, x2, y2, boy) {
      boy = boy || 10;
      var a = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - boy * Math.cos(a - 0.45), y2 - boy * Math.sin(a - 0.45));
      ctx.lineTo(x2 - boy * Math.cos(a + 0.45), y2 - boy * Math.sin(a + 0.45));
      ctx.closePath(); ctx.fill();
    },
    yazi: function (ctx, s, x, y, o) {
      o = o || {};
      ctx.font = GG.font(o.boyut || 16, o.kalin);
      ctx.fillStyle = o.renk || '#e6edf7';
      ctx.textAlign = o.hiza || 'left';
      ctx.textBaseline = o.taban || 'middle';
      ctx.fillText(s, x, y);
    },
    daire: function (ctx, x, y, r, dolgu, cizgi, kalinlik) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (dolgu) { ctx.fillStyle = dolgu; ctx.fill(); }
      if (cizgi) { ctx.strokeStyle = cizgi; ctx.lineWidth = kalinlik || 1; ctx.stroke(); }
    },
    // Parlak küre (elektron, proton vb.)
    kure: function (ctx, x, y, r, renk, isik) {
      var g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      g.addColorStop(0, isik || '#ffffff');
      g.addColorStop(0.35, renk);
      g.addColorStop(1, GG.ciz.koyulas(renk, 0.45));
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    },
    koyulas: function (hex, k) {
      var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
      if (!m) return hex;
      var r = Math.round(parseInt(m[1], 16) * (1 - k)), g = Math.round(parseInt(m[2], 16) * (1 - k)), b = Math.round(parseInt(m[3], 16) * (1 - k));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
  };

  // Dalga boyundan (nm) yaklaşık görünür renk (Bruton yaklaşımı)
  GG.dalgaRenk = function (nm, parlaklik) {
    var r = 0, g = 0, b = 0;
    if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else if (nm <= 780) { r = 1; }
    var f = 1;
    if (nm < 380 || nm > 780) f = 0;
    else if (nm < 420) f = 0.3 + 0.7 * (nm - 380) / 40;
    else if (nm > 700) f = 0.3 + 0.7 * (780 - nm) / 80;
    f *= (parlaklik == null ? 1 : parlaklik);
    function k(c) { return Math.round(255 * Math.pow(c * f, 0.8)); }
    return 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')';
  };

  // ---------- Arayüz parçaları (deney kontrol çubukları için) ----------
  var el = GG.el;
  GG.ui = {
    dugme: function (metin, tik, sinif) {
      return el('button', { sinif: 'dugme' + (sinif ? ' ' + sinif : ''), type: 'button', html: metin, onclick: tik });
    },
    // {etiket, min, max, adim, deger, bicim(v)->metin, degisti(v)}
    kaydirici: function (o) {
      var deger = o.deger;
      var oku = el('span', { sinif: 'kaydirici-deger' });
      var giris = el('input', { type: 'range', min: o.min, max: o.max, step: o.adim || 1, value: o.deger, 'aria-label': o.etiket });
      function yaz() { oku.textContent = o.bicim ? o.bicim(deger) : String(deger); }
      giris.addEventListener('input', function () { deger = Number(giris.value); yaz(); if (o.degisti) o.degisti(deger); });
      yaz();
      var kok = el('label', { sinif: 'kaydirici' + (o.genis ? ' genis' : '') }, [el('span', { sinif: 'kaydirici-etiket', html: o.etiket }), giris, oku]);
      return {
        kok: kok,
        deger: function () { return deger; },
        ayarla: function (v, sessiz) { deger = v; giris.value = v; yaz(); if (!sessiz && o.degisti) o.degisti(deger); }
      };
    },
    // {etiket, secenekler:[{id, ad}], deger, degisti(id)}
    secici: function (o) {
      var deger = o.deger;
      var dugmeler = {};
      var grup = el('div', { sinif: 'secici', role: 'group', 'aria-label': o.etiket || '' });
      o.secenekler.forEach(function (s) {
        var d = el('button', { type: 'button', html: s.ad, onclick: function () { sec(s.id); } });
        dugmeler[s.id] = d;
        grup.appendChild(d);
      });
      function boya() { Object.keys(dugmeler).forEach(function (k) { dugmeler[k].className = (k === String(deger)) ? 'secili' : ''; }); }
      function sec(id, sessiz) { deger = id; boya(); if (!sessiz && o.degisti) o.degisti(id); }
      boya();
      var kok = o.etiket ? el('div', { sinif: 'secici-kap' }, [el('span', { sinif: 'kaydirici-etiket', html: o.etiket }), grup]) : grup;
      return { kok: kok, deger: function () { return deger; }, ayarla: sec };
    },
    // Aç/kapa düğmesi
    anahtar: function (o) {
      var acik = !!o.deger;
      var d = el('button', { type: 'button', sinif: 'dugme anahtar', onclick: function () { ayarla(!acik); } });
      function boya() { d.innerHTML = (acik ? '● ' : '○ ') + o.etiket; d.classList.toggle('acik', acik); }
      function ayarla(v, sessiz) { acik = v; boya(); if (!sessiz && o.degisti) o.degisti(acik); }
      boya();
      return { kok: d, deger: function () { return acik; }, ayarla: ayarla };
    }
  };
})();

</script>

  var ETIKET = {

        GG.ui.dugme('👩‍🏫 Öğretmen', function () { GG.git('ogretmen'); }),
        GG.ui.dugme('ℹ Hakkında', function () { GG.git('hakkinda'); }),
        tamEkranDugmesi()
      ])
    ]));
    s.appendChild(el('div', { sinif: 'yontem-seridi' }, [
      'Her durakta:',
      el('span', { sinif: 'adim', metin: '1 Soru' }), '→',
      el('span', { sinif: 'adim', metin: '2 Tahmin' }), '→',
      el('span', { sinif: 'adim', metin: '3 Deney' }), '→',
      el('span', { sinif: 'adim', metin: '4 Çıkarım' }), '→',
      el('span', { sinif: 'adim', metin: '5 Model' }), '→',
      el('span', { sinif: 'adim', metin: '6 Ama…' }),
      el('span', { metin: '  (Ama… adımı, modelin açıklayamadığı gözlemi ve bir sonraki durağı gösterir.)' })
    ]));
    GG.bolumler.forEach(function (b) {
      var bd = duraklar.filter(function (d) { return d.bolum === b.no; });
      if (!bd.length) return;
      var bolum = el('section', { sinif: 'bolum', stil: '--renk:' + b.renk });
      bolum.appendChild(el('div', { sinif: 'bolum-baslik' }, [
        el('span', { sinif: 'bolum-no', metin: b.no + '. BÖLÜM' }),
        el('span', { sinif: 'bolum-ad', metin: b.ad }),
        el('span', { sinif: 'bolum-alt', metin: b.alt })
      ]));
      var izgara = el('div', { sinif: 'durak-izgara' });
      bd.forEach(function (d) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti' + (GG.durum.tamam[d.id] ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('durak/' + d.id + '/0'); }
        }, [
          el('div', { sinif: 'yil', metin: d.yil }),
          el('div', { sinif: 'kisi', metin: d.kisi }),
          el('div', { sinif: 'soru', metin: d.soru }),
          el('div', { sinif: 'kazanim', metin: (d.kazanim || []).join(' · ').replace(/KİM\.9\.1\./g, '9.1.') })
        ]));
      });
      if (b.no === GG.bolumler.length && GG.finalSayfasi) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti final-karti' + (GG.durum.tamam.final ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('final'); }
        }, [
          el('div', { sinif: 'yil', metin: 'FİNAL' }),
          el('div', { sinif: 'kisi', metin: 'Zaman şeridi' }),
          el('div', { sinif: 'soru', metin: 'Modelleri sıraya diz; her modeli hangi kanıt değiştirdi?' })
        ]));
      }
      bolum.appendChild(izgara);
      s.appendChild(bolum);
    });
    return s;
  }

  // ================= Durak ekranı =================
  function durakKapat() {
    if (!aktif) return;
    sahneTemizle();
    document.removeEventListener('keydown', aktif.tus);
    if (aktif.cekmece && aktif.cekmece.parentNode) aktif.cekmece.parentNode.removeChild(aktif.cekmece);
    aktif = null;
  }

  function durakEkrani(d, i) {
    if (!aktif || aktif.durak !== d) {
      durakKapat();
      GG.bosalt(kok);
      var renk = GG.bolumRengi(d.bolum);
      renkAyarla(renk);
      aktif = {
        durak: d, adimNo: -1, gozlemler: {}, dinleyiciler: [], cozuldu: {}, paylasim: {},
        sim: null, sahneAnahtar: null
      };
      var serit = el('div', { sinif: 'adim-seridi' });
      var notDugme = GG.ui.dugme('📝 Öğretmen notu', function () { aktif.cekmece.classList.toggle('acik'); }, 'kucuk');
      kok.appendChild(el('div', { sinif: 'ust-cubuk' }, [
        GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
        el('div', { sinif: 'ust-baslik' }, [
          el('span', { sinif: 'ust-yil', metin: d.yil }),
          el('span', { sinif: 'ust-kisi', metin: d.kisi }),
          el('span', { sinif: 'ust-soru', metin: d.soru })
        ]),
        serit, notDugme, tamEkranDugmesi()
      ]));
      var sahne = el('div', { sinif: 'sahne' });
      var panelIc = el('div', { sinif: 'panel-ic' });
      var geri = GG.ui.dugme('◀ Geri', function () { if (aktif.adimNo > 0) adimGoster(aktif.adimNo - 1); });
      var gec = GG.ui.dugme('öğretmen: geç', function () { aktif.hazirla(true); }, 'sade kucuk');
      var ileri = GG.ui.dugme('İleri ▶', ileriBas, 'ana');
      var panel = el('div', { sinif: 'panel' }, [panelIc, el('div', { sinif: 'panel-alt' }, [geri, el('span', { stil: 'flex:1' }), gec, ileri])]);
      kok.appendChild(el('div', { sinif: 'durak-govde' }, [sahne, panel]));
      aktif.serit = serit; aktif.sahneKap = sahne; aktif.panelIc = panelIc;
      aktif.geri = geri; aktif.ileri = ileri; aktif.gec = gec;
      aktif.cekmece = cekmeceKur(d);
      document.body.appendChild(aktif.cekmece);
      aktif.tus = function (e) {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.key === 'ArrowRight' && !aktif.ileri.disabled) { e.preventDefault(); ileriBas(); }
        else if (e.key === 'ArrowLeft' && aktif.adimNo > 0) { e.preventDefault(); adimGoster(aktif.adimNo - 1); }
      };
      document.addEventListener('keydown', aktif.tus);
    }
    adimGoster(Math.max(0, Math.min(d.adimlar.length - 1, i)));
  }

  function ileriBas() {
    var d = aktif.durak;
    if (aktif.adimNo < d.adimlar.length - 1) adimGoster(aktif.adimNo + 1);
    else durakBitti(d);
  }

  function sahneCoz(d, i) {
    for (var j = i; j >= 0; j--) if (d.adimlar[j].sahne !== undefined) return d.adimlar[j].sahne;
    return 'kapak';
  }

  function adimGoster(i) {
    var d = aktif.durak, adim = d.adimlar[i];
    aktif.adimNo = i;
    aktif.dinleyiciler = [];
    try { history.replaceState(null, '', '#/durak/' + d.id + '/' + i); } catch (e) { /* file:// bazı tarayıcılarda */ }

    var tanim = sahneCoz(d, i), anahtar = JSON.stringify(tanim);
    if (anahtar !== aktif.sahneAnahtar) { sahneKur(tanim); aktif.sahneAnahtar = anahtar; }

    // Adım şeridi
    GG.bosalt(aktif.serit);
    d.adimlar.forEach(function (a, k) {
      aktif.serit.appendChild(el('button', {
        type: 'button', sinif: 'adim-nokta' + (k === i ? ' aktif' : (k < i ? ' gecti' : '')),
        metin: (a.etiket || ETIKET[a.tur] || '').replace('…', ''), title: a.baslik ? a.baslik.replace(/<[^>]+>/g, '') : '',
        onclick: function () { adimGoster(k); }
      }));
    });

    var etkin = aktif.serit.children[i];
    if (etkin) aktif.serit.scrollLeft = Math.max(0, etkin.offsetLeft - aktif.serit.offsetLeft - aktif.serit.clientWidth / 2);

    // Panel
    var ic = aktif.panelIc;
    GG.bosalt(ic);
    ic.scrollTop = 0;
    var hazir = false;
    function boya() {
      aktif.ileri.disabled = !hazir;
      aktif.gec.style.visibility = hazir ? 'hidden' : 'visible';
      aktif.geri.disabled = i === 0;
      aktif.ileri.innerHTML = i === d.adimlar.length - 1 ? 'Durağı tamamla ✓' : 'İleri ▶';
    }
    aktif.hazirla = function (v) {
      hazir = v !== false;
      if (hazir) aktif.cozuldu[i] = true;
      boya();
    };
    var baglam = {
      durak: d, adimNo: i, adim: adim,
      cozuldu: !!aktif.cozuldu[i],
      hazir: function (v) { aktif.hazirla(v); },
      gozlemVar: function (id) { return !!aktif.gozlemler[id]; },
      gozlemDinle: function (f) { aktif.dinleyiciler.push(f); },
      ilkDeneme: function (dogruMu) {
        var k = d.id + ':' + i;
        if (!(k in GG.durum.ilk)) { GG.durum.ilk[k] = dogruMu; GG.kaydet(); }
      },
      tahminBul: function () {
        for (var j = i - 1; j >= 0; j--) if (d.adimlar[j].tur === 'tahmin') return { adim: d.adimlar[j], oylar: GG.durum.tahmin[d.id + ':' + j] || {} };
        return null;
      },
      sim: function () { return aktif.sim && aktif.sim.inst; },
      paylasim: aktif.paylasim
    };
    ic.appendChild(el('span', { sinif: 'etiket-cip', metin: adim.etiket || ETIKET[adim.tur] || '' }));
    if (adim.baslik) ic.appendChild(el('h2', { html: adim.baslik }));
    if (adim.metin) ic.appendChild(el('div', { sinif: 'adim-metin', html: adim.metin }));
    ortakParcalar(ic, adim, 'ust');
    var tur = GG.adimTurleri[adim.tur];
    if (tur) { var dugum = tur(adim, baglam); if (dugum) ic.appendChild(dugum); }
    ortakParcalar(ic, adim, 'alt');
    if (!tur || adim.tur === 'anlati' || adim.tur === 'model' || adim.tur === 'ama' || adim.tur === 'veri') hazir = true;
    if (hazir) aktif.cozuldu[i] = true;
    boya();

    var s = aktif.sim && aktif.sim.inst;
    if (s && typeof s.adim === 'function') s.adim(adim.simAyar || {}, adim);
  }

  function ortakParcalar(ic, adim, yer) {
    if (yer === 'ust') {
      if (adim.alinti) ic.appendChild(el('div', { sinif: 'alinti', html: adim.alinti.metin + (adim.alinti.kaynak ? '<span>' + adim.alinti.kaynak + '</span>' : '') }));
      if (adim.kartlar && adim.tur !== 'siniflandir') {
        var iz = el('div', { sinif: 'kart-izgara' });
        adim.kartlar.forEach(function (k) {
          iz.appendChild(el('div', { sinif: 'kanit-kart' }, [
            k.ikon ? el('span', { sinif: 'ikon', metin: k.ikon + ' ' }) : null,
            el('b', { html: k.baslik }), el('span', { html: k.metin })
          ]));
        });
        ic.appendChild(iz);
      }
      if (adim.tablo) ic.appendChild(GG.tabloYap(adim.tablo));
    } else {
      if (adim.bilgi) ic.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Biliyor musun?</b> ' + adim.bilgi }));
    }
  }

  GG.tabloYap = function (t) {
    var tablo = el('table', { sinif: t.sinif || 'veri-tablo' });
    if (t.baslik) tablo.appendChild(el('caption', { html: t.baslik, stil: 'caption-side:top;text-align:left;font-weight:700;padding:.2rem 0' }));
    var thead = el('thead'), tr = el('tr');
    t.sutunlar.forEach(function (s) { tr.appendChild(el('th', { html: s })); });
    thead.appendChild(tr); tablo.appendChild(thead);
    var tbody = el('tbody');
    t.satirlar.forEach(function (sat) {
      var r = el('tr');
      sat.forEach(function (h) { r.appendChild(el('td', { html: String(h) })); });
      tbody.appendChild(r);
    });
    tablo.appendChild(tbody);
    return tablo;
  };

  // ---------- Sahne ----------
  function sahneTemizle() {
    if (aktif && aktif.sim) {
      var s = aktif.sim;
      try { if (s.inst && s.inst.yoket) s.inst.yoket(); } catch (e) { console.error(e); }
      s.temizlik.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
      aktif.sim = null;
    }
    if (aktif && aktif.modelDur) { aktif.modelDur(); aktif.modelDur = null; }
  }

  function sahneKur(tanim) {
    sahneTemizle();
    var kap = aktif.sahneKap;
    GG.bosalt(kap);
    if (tanim === 'kapak' || !tanim) { kap.appendChild(kapakDugum(aktif.durak)); return; }
    if (tanim.model) { aktif.modelDur = GG.modelCiz(kap, tanim.model, true); return; }
    var kur = GG.simler[tanim.sim];
    if (!kur) { kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney bulunamadı: ' + tanim.sim })); return; }
    var temizlik = [];
    var api = {
      ayar: tanim.ayar || {},
      paylasim: aktif.paylasim,
      gozlem: function (id) { gozlemEkle(id); },
      tuval: function (k) { var t = GG.tuval(k); temizlik.push(t.yoket); return t; },
      dongu: function (f) { var dur = GG.dongu(f); temizlik.push(dur); return dur; },
      bildir: function (m, tur) { sahneBildirim(m, tur); },
      ui: GG.ui,
      yerlesim: function () {
        var ust = el('div', { sinif: 'sim-ust' });
        var tk = el('div', { sinif: 'tuval-kap' });
        var kontrol = el('div', { sinif: 'sim-kontrol' });
        var sk = el('div', { sinif: 'sim-kok' }, [ust, tk, kontrol]);
        kap.appendChild(sk);
        return { ust: ust, tuvalKap: tk, kontrol: kontrol, kok: sk };
      }
    };
    aktif.sim = { tanim: tanim, temizlik: temizlik, api: api, inst: null };
    try { aktif.sim.inst = kur(kap, api) || {}; }
    catch (e) { console.error(e); kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney yüklenemedi: ' + e.message })); }
  }

  function gozlemEkle(id) {
    if (!aktif || aktif.gozlemler[id]) return;
    aktif.gozlemler[id] = true;
    aktif.dinleyiciler.slice().forEach(function (f) { try { f(id); } catch (e) { console.error(e); } });
  }
  GG._gozlemEkle = gozlemEkle; // test için

  function sahneBildirim(m, tur) {
    if (!aktif) return;
    var b = el('div', { sinif: 'sahne-bildirim' + (tur ? ' ' + tur : ''), html: m });
    aktif.sahneKap.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 3300);
  }

  function kapakDugum(d) {
    var renk = GG.bolumRengi(d.bolum);
    var b = GG.bolumler[d.bolum - 1];
    return el('div', {
      sinif: 'kapak',
      stil: 'background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.16), transparent 45%), linear-gradient(135deg, ' + renk + ', #0b1220 120%)'
    }, [
      el('div', { sinif: 'kapak-bolum', metin: b.no + '. BÖLÜM · ' + b.ad.toLocaleUpperCase('tr-TR') }),
      el('div', { sinif: 'kapak-yil', metin: d.yil }),
      el('div', { sinif: 'kapak-kisi', metin: d.kisiTam || d.kisi }),
      d.yer ? el('div', { sinif: 'kapak-yer', metin: d.yer }) : null,
      el('div', { sinif: 'kapak-soru', metin: d.soru })
    ]);
  }

  // Model çizimi: kap içine tuval açar; animasyonlu ise durdurma işlevi döner
  GG.modelCiz = function (kap, id, animasyon, basliksiz) {
    var m = GG.modeller[id];
    var tk = el('div', { sinif: 'tuval-kap', stil: 'position:absolute;left:0;top:0;right:0;bottom:0' });
    kap.appendChild(tk);
    var t = GG.tuval(tk);
    if (!basliksiz && m && m.ad) kap.appendChild(el('div', { sinif: 'model-baslik', metin: m.ad }));
    function ciz(zaman) {
      t.temizle('#0b1220');
      if (m) m.ciz(t.ctx, t.w, t.h, zaman / 1000);
    }
    if (!animasyon) {
      ciz(2500);
      t.boyutDegisti(function () { ciz(2500); });
      return function () { t.yoket(); };
    }
    var dur = GG.dongu(function (dt, zaman) { ciz(zaman); });
    return function () { dur(); t.yoket(); };
  };

  function durakBitti(d) {
    GG.durum.tamam[d.id] = true;
    GG.kaydet();
    var sira = GG.sirali();
    var k = sira.indexOf(d);
    var sonraki = sira[k + 1];
    var mt = el('div', { sinif: 'model-tuval' });
    var m = d.model && GG.modeller[d.model];
    var ortu = el('div', { sinif: 'ortu' });
    var durMod = null;
    function kapat() { if (durMod) durMod(); if (ortu.parentNode) ortu.parentNode.removeChild(ortu); }
    var modal = el('div', { sinif: 'modal' }, [
      el('span', { sinif: 'etiket-cip', metin: 'DURAK TAMAMLANDI' }),
      el('h2', { html: d.kisi + ' (' + d.yil + ')' }),
      m ? mt : null,
      el('p', { html: m ? '<b>' + m.ad + '</b> Model Müzesi’ne eklendi. ' + (d.ozet || '') : (d.ozet || '') }),
      el('div', { sinif: 'modal-dugmeler' }, [
        GG.ui.dugme('Haritaya dön', function () { kapat(); GG.git(''); }),
        sonraki ? GG.ui.dugme('Sonraki durak: ' + sonraki.kisi + ' (' + sonraki.yil + ') ▶', function () { kapat(); GG.git('durak/' + sonraki.id + '/0'); }, 'ana')
          : (GG.finalSayfasi ? GG.ui.dugme('Finale geç ▶', function () { kapat(); GG.git('final'); }, 'ana') : null)
      ])
    ]);
    ortu.appendChild(modal);
    document.body.appendChild(ortu);
    if (m) durMod = GG.modelCiz(mt, d.model, true, true);
  }

  // ---------- Öğretmen notu çekmecesi ----------
  function cekmeceKur(d) {
    var o = d.ogretmen || {};
    var c = el('aside', { sinif: 'cekmece', 'aria-label': 'Öğretmen notu' });
    var ic = el('div', { sinif: 'cekmece-ic' });
    c.appendChild(el('div', { sinif: 'cekmece-ust' }, [
      el('b', { metin: 'Öğretmen notu · ' + d.kisi }),
      GG.ui.dugme('Kapat ✕', function () { c.classList.remove('acik'); }, 'kucuk')
    ]));
    c.appendChild(ic);
    if (o.sure) ic.appendChild(el('p', { html: '<b>Önerilen süre:</b> ' + o.sure }));
    if (d.kazanim && d.kazanim.length) {
      ic.appendChild(el('h3', { metin: 'Öğrenme çıktısı (Maarif Modeli, 9. sınıf)' }));
      d.kazanim.forEach(function (kod) {
        var k = GG.kazanimlar[kod];
        if (!k) return;
        var ul = el('ul');
        ic.appendChild(el('p', { html: '<span class="kazanim-kod">' + kod + '</span> ' + k.metin }));
        var bilesenler = (o.bilesenler && o.bilesenler[kod]) || [];
        bilesenler.forEach(function (h) { if (k.bilesen[h]) ul.appendChild(el('li', { html: '<b>' + h + ')</b> ' + k.bilesen[h] })); });
        if (ul.childNodes.length) ic.appendChild(ul);
      });
    }
    function liste(baslik, dizi) {
      if (!dizi || !dizi.length) return;
      ic.appendChild(el('h3', { metin: baslik }));
      var ul = el('ul');
      dizi.forEach(function (x) { ul.appendChild(el('li', { html: x })); });
      ic.appendChild(ul);
    }
    if (o.amac) { ic.appendChild(el('h3', { metin: 'Bu durağın amacı' })); ic.appendChild(el('p', { html: o.amac })); }
    liste('Sınıfta sorulabilecek sorular', o.tartisma);
    liste('Dikkat: sık görülen kavram yanılgıları', o.yanilgilar);
    liste('Bilimsel doğruluk notları', o.notlar);
    liste('Kaynaklar', o.kaynaklar);
    return c;
  }

  // ================= Model Müzesi =================
  var muzeHepsi = false;
  function muzeSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    var kapsayici = el('div');
    var dugme = GG.ui.dugme(muzeHepsi ? 'Yalnızca keşfedilenleri göster' : 'Öğretmen: tümünü göster', function () { muzeHepsi = !muzeHepsi; rota(); }, 'kucuk');
    s.appendChild(ustCubukSayfa('Model Müzesi'));
    var ic = el('div', { stil: 'padding: 0 0 2rem' });
    ic.appendChild(el('h1', { metin: '🏛 Model Müzesi' }));
    ic.appendChild(el('p', { html: 'Her durağı tamamladığında o durağın modeli buraya eklenir. Modelleri yan yana koy ve karşılaştır: <b>Ne değişti? Neden değişti?</b>' }));
    ic.appendChild(dugme);
    var iz = el('div', { sinif: 'muze-izgara' });
    var durdurucular = [];
    GG.sirali().forEach(function (d) {
      if (!d.model) return;
      var acik = muzeHepsi || GG.durum.tamam[d.id];
      var mt = el('div', { sinif: 'model-tuval' });
      var m = GG.modeller[d.model];
      var kart = el('div', { sinif: 'muze-kart' + (acik ? '' : ' kilitli'), stil: '--renk:' + GG.bolumRengi(d.bolum) }, [
        mt,
        el('div', { sinif: 'govde' }, [
          el('div', { sinif: 'yil', metin: d.yil + ' · ' + d.kisi }),
          el('div', { sinif: 'ad', metin: acik && m ? m.ad : '???' }),
          el('div', { sinif: 'ozet', html: acik ? (d.muzeOzet || d.ozet || '') : 'Bu durağı tamamlayınca model burada görünecek.' })
        ])
      ]);
      iz.appendChild(kart);
      if (acik) durdurucular.push(function () { return GG.modelCiz(mt, d.model, false, true); });
    });
    ic.appendChild(iz);
    kapsayici.appendChild(ic);
    s.appendChild(kapsayici);
    // Tuvaller yerleştikten sonra çiz
    setTimeout(function () { durdurucular.forEach(function (f) { f(); }); }, 0);
    return s;
  }

  // ================= Öğretmen sayfası =================
  function ogretmenSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Öğretmen'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: '👩‍🏫 Öğretmen sayfası' }));
    ic.appendChild(el('h2', { metin: 'Derste nasıl kullanılır?' }));
    ic.appendChild(el('ul', null, [
      el('li', { html: 'Oyun akıllı tahtada <b>bütün sınıfla birlikte</b> oynanmak için tasarlandı. Bir öğrenci tahtada deneyi yapar, sınıf tartışır.' }),
      el('li', { html: 'Her durak <b>Tahmin → Gözlem → Açıklama</b> sırasıyla ilerler. <b>Tahmin</b> adımında her seçenek için el kaldıran öğrencileri sayıp <b>+</b> ile girin. Deneyden sonra sınıfın tahmini, deneyin sonucuyla yan yana gösterilir.' }),
      el('li', { html: 'Sonuç çıkarma sorularında yanlış seçenek cevabı vermez, öğrenciyi <b>kanıta geri yönlendirir</b>. Doğru seçenek bulunmadan ileri geçilemez. Gerekirse “öğretmen: geç” düğmesiyle atlayabilirsiniz.' }),
      el('li', { html: 'Her durakta sağ üstteki <b>📝 Öğretmen notu</b> düğmesinde şunlar var: öğrenme çıktısı ve süreç bileşenleri, tartışma soruları, sık görülen kavram yanılgıları ve kaynaklar.' }),
      el('li', { html: 'Duraklar birbirinden bağımsız açılır. Bir ders saatinde genellikle 2–3 durak işlenebilir. Klavye bağlıysa ← ve → tuşları adımlar arasında gezdirir.' }),
      el('li', { html: 'İnternet gerekmez. Tek dosyalık sürümü USB bellekten açabilirsiniz. İlerleme bu tahtanın tarayıcısında saklanır.' })
    ]));
    ic.appendChild(el('h2', { metin: 'Öğrenme çıktılarıyla eşleşme' }));
    var satirlar = GG.sirali().map(function (d) {
      var o = d.ogretmen || {};
      var bil = [];
      (d.kazanim || []).forEach(function (kod) {
        var b = (o.bilesenler && o.bilesenler[kod]) || [];
        bil.push('<b>' + kod + '</b>' + (b.length ? ' (' + b.join(', ') + ')' : ''));
      });
      return [d.yil, d.kisi, d.soru, bil.join('<br>'), o.sure || ''];
    });
    ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: ['Yıl', 'Durak', 'Durağın sorusu', 'Öğrenme çıktısı (süreç bileşeni)', 'Süre'], satirlar: satirlar }));
    ic.appendChild(el('p', { sinif: 'ipucu-metin', html: 'Öğrenme çıktılarının tam metni: Kimya Dersi Öğretim Programı (2024), 9. sınıf, 1. Tema “Etkileşim”, “Atomdan Periyodik Tabloya” bölümü.' }));

    ic.appendChild(el('h2', { metin: 'Sınıfın tahminleri' }));
    var tahminSatir = [];
    GG.sirali().forEach(function (d) {
      d.adimlar.forEach(function (a, k) {
        if (a.tur !== 'tahmin') return;
        var oylar = GG.durum.tahmin[d.id + ':' + k];
        if (!oylar) return;
        var toplam = 0; Object.keys(oylar).forEach(function (x) { toplam += oylar[x]; });
        if (!toplam) return;
        var dagilim = a.secenekler.map(function (sec) {
          var n = oylar[sec.id] || 0;
          return (sec.id === a.dogru ? '✔ ' : '') + sec.metin.replace(/<[^>]+>/g, '') + ': <b>' + n + '</b>';
        }).join('<br>');
        tahminSatir.push([d.kisi, (a.soru || '').replace(/<[^>]+>/g, ''), dagilim]);
      });
    });
    if (tahminSatir.length) ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: ['Durak', 'Soru', 'Oylar (✔ deneyin sonucu)'], satirlar: tahminSatir }));
    else ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Henüz oylama kaydedilmedi.' }));

    ic.appendChild(el('h2', { metin: 'Yeni sınıf' }));
    ic.appendChild(el('p', { metin: 'Başka bir sınıfla başlamadan önce ilerlemeyi ve oylamaları sıfırlayabilirsiniz.' }));
    ic.appendChild(GG.ui.dugme('İlerlemeyi ve oyları sıfırla', function () {
      if (window.confirm('Tüm ilerleme ve sınıf oyları silinsin mi?')) {
        GG.durum.tamam = {}; GG.durum.tahmin = {}; GG.durum.ilk = {}; GG.kaydet(); GG.git('');
      }
    }));

    // Yedek: tarayıcı belleği silinirse ilerleme ve oylar dosyadan geri yüklenebilir
    ic.appendChild(el('h2', { metin: 'İlerlemeyi yedekle' }));
    ic.appendChild(el('p', { metin: 'İlerleme ve oylar bu tahtanın tarayıcısında saklanır. Tarayıcı belleği silinirse kaybolur. Ders sonunda bir yedek dosyası indirip daha sonra (başka bir tahtada da) geri yükleyebilirsiniz.' }));
    var yedekGiris = el('input', { type: 'file', accept: '.json,application/json', stil: 'display:none' });
    yedekGiris.addEventListener('change', function () {
      var dosya = yedekGiris.files && yedekGiris.files[0];
      if (!dosya) return;
      var okuyucu = new FileReader();
      okuyucu.onload = function () {
        try {
          var veri = JSON.parse(okuyucu.result);
          if (!veri || veri.anahtar !== ANAHTAR || typeof veri.durum !== 'object') { window.alert('Bu yedek dosyası bu oyuna ait değil.'); return; }
          if (!window.confirm('Yedekteki ilerleme yüklensin mi? Bu tahtadaki şimdiki ilerlemenin yerine geçer.')) return;
          GG.durum = veri.durum; GG.kaydet(); GG.git('');
        } catch (e) { window.alert('Yedek dosyası okunamadı.'); }
      };
      okuyucu.readAsText(dosya);
      yedekGiris.value = '';
    });
    ic.appendChild(yedekGiris);
    ic.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap' }, [
      GG.ui.dugme('💾 Yedeği indir', function () {
        var t = new Date(), gun = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
        var blob = new Blob([JSON.stringify({ anahtar: ANAHTAR, oyun: document.title, tarih: t.toISOString(), durum: GG.durum })], { type: 'application/json' });
        var a = el('a', { href: URL.createObjectURL(blob), download: ANAHTAR + '-yedek-' + gun + '.json' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }),
      GG.ui.dugme('📂 Yedekten yükle', function () { yedekGiris.click(); })
    ]));

    // Kilit: kilitli sürümde tahta şifreyi hatırlıyorsa burada unutturulur
    var kilitVar = false;
    try { kilitVar = !!window.localStorage.getItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
    if (kilitVar) {
      ic.appendChild(el('h2', { metin: 'Kilit' }));
      ic.appendChild(el('p', { metin: 'Bu tahta oyunların şifresini hatırlıyor. Kilitlerseniz bu tahtadaki bütün oyunlar bir sonraki açılışta yeniden şifre ister. İlerleme silinmez.' }));
      ic.appendChild(GG.ui.dugme('🔒 Bu tahtada kilitle', function () {
        try { window.localStorage.removeItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
        window.location.reload();
      }));
    }
    s.appendChild(ic);
    return s;
  }

  // ================= Hakkında =================
  function hakkindaSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Hakkında'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: 'Görünmeyeni Görmek' }));
    ic.appendChild(el('p', { html: 'Atom kavramının Thales’ten modern atom teorisine, oradan orbitallere ve periyodik tabloya uzanan gelişimini <b>deney ve veri üzerinden keşfettiren</b> bir sınıf içi oyun. 9. sınıf Kimya Dersi Öğretim Programı (Türkiye Yüzyılı Maarif Modeli, 2024) “Atomdan Periyodik Tabloya” bölümü için hazırlandı.' }));
    ic.appendChild(el('h2', { metin: 'Nasıl hazırlandı?' }));
    ic.appendChild(el('p', { html: 'Oyunun fikri, konusu ve pedagojik yönü bir BİLSEM kimya öğretmenine aittir. Oyunun kodu, deney simülasyonları ve metinleri öğretmenin isteği üzerine <b>Claude (Anthropic) yapay zekâ modeli</b> tarafından yazılmıştır. Bilimsel bilgiler, her durağın öğretmen notunda listelenen kaynaklarla karşılaştırılmıştır. Yine de derste kullanmadan önce öğretmen tarafından gözden geçirilmesi önerilir.' }));
    ic.appendChild(el('h2', { metin: 'Deneyler hakkında' }));
    ic.appendChild(el('p', { html: 'Ekrandaki deneyler gerçek deneylerin <b>sadeleştirilmiş benzetimleridir</b>. Tarihî ölçümler (Boyle’un tablosu, Chadwick’in hızları, hidrojen spektrumu, elektron yükü vb.) gerçek değerlere dayanır. “Temsilî” diye işaretlenen sayılar ise kavramı göstermek için seçilmiştir. Bu ayrım her durağın öğretmen notunda belirtilir.' }));
    ic.appendChild(el('h2', { metin: 'Kaynaklar' }));
    var ul = el('ul');
    var gorulen = {};
    GG.sirali().forEach(function (d) {
      ((d.ogretmen && d.ogretmen.kaynaklar) || []).forEach(function (k) { if (!gorulen[k]) { gorulen[k] = 1; ul.appendChild(el('li', { html: k })); } });
    });
    ic.appendChild(ul);
    ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Sürüm 1.0 · Ekim 2026' }));
    s.appendChild(ic);
    return s;
  }

  // ================= Başlat =================
  GG.baslat = function () {
    kok = document.getElementById('uygulama');
    window.addEventListener('hashchange', rota);
    rota();
  };
  GG._aktif = function () { return aktif; }; // test için
  GG._adimGoster = function (i) { adimGoster(i); };
})();

<script>/* js/adimlar.js */
/* Görünmeyeni Görmek — adım türleri (panelde görünen etkinlikler) */
'use strict';
(function () {
  var el = GG.el;
  var T = GG.adimTurleri;

  function toplamOy(oylar) { var t = 0; Object.keys(oylar).forEach(function (k) { t += oylar[k] || 0; }); return t; }
  function salla(d) { d.classList.remove('sallan'); void d.offsetWidth; d.classList.add('sallan'); }

  // ---------- Anlatı: metin motor tarafından yazılır ----------
  T.anlati = function () { return null; };
  T.veri = function () { return null; };

  // ---------- Tahmin (sınıf oylaması) ----------
  T.tahmin = function (a, b) {
    var k = b.durak.id + ':' + b.adimNo;
    var oylar = GG.durum.tahmin[k] || {};
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Sınıfa sorun: Her seçenek için el kaldıranları sayıp + ile ekleyin. İsterseniz oylamadan da devam edebilirsiniz.' }));
    var kartlar = [];
    a.secenekler.forEach(function (s) {
      var sayi = el('span', { sinif: 'oy-sayi' });
      var kart = el('div', { sinif: 'oy-kart' }, [
        el('button', { sinif: 'oy-dugme', type: 'button', 'aria-label': 'Bir oy azalt', metin: '−', onclick: function () { degis(s.id, -1); } }),
        sayi,
        el('button', { sinif: 'oy-dugme arti', type: 'button', 'aria-label': 'Bir oy ekle', metin: '+', onclick: function () { degis(s.id, 1); } }),
        el('div', { sinif: 'oy-metin', html: s.metin })
      ]);
      kartlar.push({ s: s, kart: kart, sayi: sayi });
      kok.appendChild(kart);
    });
    function degis(id, d) {
      oylar[id] = Math.max(0, (oylar[id] || 0) + d);
      GG.durum.tahmin[k] = oylar; GG.kaydet(); boya();
    }
    function boya() {
      var enCok = 0;
      kartlar.forEach(function (x) { enCok = Math.max(enCok, oylar[x.s.id] || 0); });
      kartlar.forEach(function (x) {
        var n = oylar[x.s.id] || 0;
        x.sayi.textContent = String(n);
        x.kart.classList.toggle('cogunluk', enCok > 0 && n === enCok);
      });
    }
    boya();
    kok.appendChild(el('p', { sinif: 'ipucu-metin', html: 'Tahminler kaydedildi. Doğru cevap deneyden sonra açıklanacak: <b>İleri ▶</b>' }));
    b.hazir(true);
    return kok;
  };

  function karsilastirma(t) {
    var a = t.adim, oylar = t.oylar, toplam = toplamOy(oylar);
    var dogru = null;
    a.secenekler.forEach(function (s) { if (s.id === a.dogru) dogru = s; });
    var kutu = el('div', { sinif: 'karsilastir' });
    kutu.appendChild(el('b', { metin: 'Sınıfın tahmini ve sonuç' }));
    if (!toplam) {
      kutu.appendChild(el('p', { html: 'Oylama yapılmadı. Sonuç: <b>' + (dogru ? dogru.metin : '') + '</b>' }));
      return kutu;
    }
    a.secenekler.forEach(function (s) {
      var n = oylar[s.id] || 0, yuzde = Math.round(100 * n / toplam);
      kutu.appendChild(el('div', { html: (s.id === a.dogru ? '✔ ' : '') + s.metin + ': <b>' + n + ' oy (%' + yuzde + ')</b>' }));
      kutu.appendChild(el('div', { sinif: 'cubuk' + (s.id === a.dogru ? ' dogru' : '') }, el('span', { stil: 'width:' + yuzde + '%' })));
    });
    var oran = (oylar[a.dogru] || 0) / toplam;
    kutu.appendChild(el('p', {
      html: oran >= 0.5 ? 'Sınıfın çoğunluğunun tahmini doğru çıktı.'
        : 'Sınıfın çoğunluğunun tahmini tutmadı. Bilim insanları da sık sık yanılır. Yeni bir model çoğu zaman tam da böyle bir şaşkınlıkla başlar.'
    }));
    return kutu;
  }

  // ---------- Deney: sahnedeki benzetimden gözlem toplanır ----------
  T.deney = function (a, b) {
    var kok = el('div');
    if (a.gorev) kok.appendChild(el('p', { html: a.gorev }));
    var ul = el('ul', { sinif: 'gorev-listesi' });
    var satirlar = (a.gozlemler || []).map(function (g) {
      var li = el('li', { html: g.metin });
      ul.appendChild(li);
      return { g: g, li: li };
    });
    kok.appendChild(ul);
    var gerekli = a.gerekli || satirlar.length;
    var sonuc = el('div');
    kok.appendChild(sonuc);
    var gosterildi = false;
    function kontrol() {
      var n = 0;
      satirlar.forEach(function (x) {
        var t = b.gozlemVar(x.g.id);
        x.li.classList.toggle('tamam', t);
        if (t) n++;
      });
      if (n >= gerekli && !gosterildi) {
        gosterildi = true;
        if (a.sonuc) sonuc.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.sonuc }));
        if (a.tahminKarsilastir) { var t = b.tahminBul(); if (t) sonuc.appendChild(karsilastirma(t)); }
        b.hazir(true);
      }
    }
    b.gozlemDinle(kontrol);
    kontrol();
    return kok;
  };

  // ---------- Tek doğru cevaplı çıkarım ----------
  T.cikarim = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    var geri = el('div');
    var ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: s.metin });
      d.addEventListener('click', function () { sec(s, d); });
      dugmeler.push({ s: s, d: d });
      kok.appendChild(d);
    });
    kok.appendChild(geri);
    function sec(s, d) {
      if (bitti) return;
      GG.bosalt(geri);
      if (s.dogru) {
        bitti = true;
        d.classList.remove('yanlis');
        d.classList.add('dogru');
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (x.d !== d) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: [s.geri, a.aciklama].filter(Boolean).join(' ') || 'Doğru.' }));
        b.hazir(true);
      } else {
        ilk = false;
        d.classList.add('yanlis');
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.geri || 'Bir daha düşün: Deneyde ne gözlemledin?' }));
      }
    }
    if (b.cozuldu) dugmeler.forEach(function (x) { if (x.s.dogru) sec(x.s, x.d); });
    return kok;
  };

  // ---------- Çok seçimli çıkarım ----------
  T.coklu = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Birden fazla seçenek doğru olabilir. Seçip “Kontrol et”e dokunun.' }));
    var secili = {}, ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s, i) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: '☐ ' + s.metin });
      d.addEventListener('click', function () {
        if (bitti) return;
        secili[i] = !secili[i];
        d.innerHTML = (secili[i] ? '☑ ' : '☐ ') + s.metin;
        dugmeler.forEach(function (x) { x.d.classList.remove('dogru', 'yanlis'); });
        d.classList.toggle('secili', !!secili[i]);
      });
      dugmeler.push({ s: s, d: d, i: i });
      kok.appendChild(d);
    });
    var geri = el('div');
    var kontrolD = GG.ui.dugme('Kontrol et', kontrol, 'ana');
    kok.appendChild(el('div', { stil: 'margin:.5rem 0' }, kontrolD));
    kok.appendChild(geri);
    function kontrol() {
      if (bitti) return;
      GG.bosalt(geri);
      var tam = true, notlar = [];
      dugmeler.forEach(function (x) {
        var sec = !!secili[x.i];
        x.d.classList.remove('secili');
        if (sec && x.s.dogru) x.d.classList.add('dogru');
        else if (sec && !x.s.dogru) { x.d.classList.add('yanlis'); tam = false; if (x.s.geri) notlar.push(x.s.geri); }
        else if (!sec && x.s.dogru) { tam = false; }
      });
      if (tam) {
        bitti = true;
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (!x.s.dogru) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Doğru.' }));
        kontrolD.disabled = true;
        b.hazir(true);
      } else {
        ilk = false;
        var eksik = dugmeler.some(function (x) { return !secili[x.i] && x.s.dogru; });
        geri.appendChild(el('div', {
          sinif: 'geri-bildirim dusun',
          html: (notlar.length ? notlar.join('<br>') : '') + (eksik ? (notlar.length ? '<br>' : '') + 'Kanıtın desteklediği bir seçeneği daha atladınız.' : '')
        }));
      }
    }
    if (b.cozuldu) {
      dugmeler.forEach(function (x) { secili[x.i] = !!x.s.dogru; x.d.innerHTML = (x.s.dogru ? '☑ ' : '☐ ') + x.s.metin; });
      kontrol();
    }
    return kok;
  };

  // ---------- Sınıflandırma: kartı seç, kutuya bırak ----------
  T.siniflandir = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Önce bir karta, sonra ait olduğu kutuya dokunun.' }));
    var kartAlan = el('div', { sinif: 'siniflandir-kartlar' });
    var kutuAlan = el('div', { sinif: 's-kutular' });
    var geri = el('div');
    var secili = null, kalan = a.kartlar.length, ilk = true;
    var kutular = {};
    a.kutular.forEach(function (k) {
      var d = el('button', { sinif: 's-kutu', type: 'button' }, [el('span', { sinif: 's-kutu-ad', html: k.ad })]);
      d.addEventListener('click', function () { birak(k.id); });
      kutular[k.id] = d;
      kutuAlan.appendChild(d);
    });
    var kartDugmeleri = [];
    GG.karistir(a.kartlar).forEach(function (kt) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: kt.metin });
      d.addEventListener('click', function () { sec(kt, d); });
      kartDugmeleri.push({ kt: kt, d: d });
      kartAlan.appendChild(d);
    });
    kok.appendChild(kartAlan);
    kok.appendChild(kutuAlan);
    kok.appendChild(geri);
    function sec(kt, d) {
      secili = { kt: kt, d: d };
      kartDugmeleri.forEach(function (x) { x.d.classList.toggle('secili', x.d === d); });
      Object.keys(kutular).forEach(function (k) { kutular[k].classList.add('hedef'); });
    }
    function yerlestir(kt, d, sessiz) {
      kutular[kt.kutu].appendChild(el('div', { sinif: 's-yerlesti', html: kt.metin }));
      if (d.parentNode) d.parentNode.removeChild(d);
      kalan--;
      if (!sessiz && kt.dogruGeri) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: kt.dogruGeri })); }
    }
    function birak(kutuId) {
      if (!secili) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Önce bir kart seçin.' })); return; }
      var s = secili;
      if (s.kt.kutu === kutuId) {
        GG.bosalt(geri);
        yerlestir(s.kt, s.d);
        secili = null;
        Object.keys(kutular).forEach(function (k) { kutular[k].classList.remove('hedef'); });
        if (kalan === 0) bitir();
      } else {
        ilk = false;
        salla(s.d);
        GG.bosalt(geri);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.kt.geri || 'Bu kart bu kutuya uymuyor. Kanıta tekrar bakın.' }));
      }
    }
    function bitir() {
      b.ilkDeneme(ilk);
      GG.bosalt(geri);
      geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Hepsi doğru yerde.' }));
      b.hazir(true);
    }
    if (b.cozuldu) { kartDugmeleri.forEach(function (x) { yerlestir(x.kt, x.d, true); }); bitir(); }
    return kok;
  };

  // ---------- Sıralama: doğru sırayla dokun ----------
  T.sirala = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: a.yonerge || 'Öğeleri doğru sırayla tek tek dokunarak dizin.' }));
    var hedef = el('div', { sinif: 'sira-hedef' });
    var havuz = el('div', { sinif: 'siniflandir-kartlar' });
    var geri = el('div');
    var sira = 0, ilk = true;
    var dugmeler = [];
    a.ogeler.forEach(function (o, i) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: o.metin });
      d.addEventListener('click', function () { dokun(o, i, d); });
      dugmeler.push({ o: o, i: i, d: d });
    });
    GG.karistir(dugmeler).forEach(function (x) { havuz.appendChild(x.d); });
    kok.appendChild(hedef);
    kok.appendChild(havuz);
    kok.appendChild(geri);
    function koy(o, d) {
      hedef.appendChild(el('div', { sinif: 'sira-oge', html: '<b>' + (sira + 1) + '.</b>' + o.metin + (o.ek ? ' <span class="ipucu-metin">' + o.ek + '</span>' : '') }));
      if (d.parentNode) d.parentNode.removeChild(d);
      sira++;
    }
    function dokun(o, i, d) {
      GG.bosalt(geri);
      if (i === sira) {
        koy(o, d);
        if (sira === a.ogeler.length) {
          b.ilkDeneme(ilk);
          geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' }));
          b.hazir(true);
        }
      } else {
        ilk = false;
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: o.geri || a.ipucu || 'Bu henüz sırası gelen öğe değil.' }));
      }
    }
    if (b.cozuldu) { dugmeler.forEach(function (x) { koy(x.o, x.d); }); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' })); b.hazir(true); }
    return kok;
  };

  // ---------- Model kartı ----------
  T.model = function (a) {
    var kok = el('div');
    if (a.maddeler) {
      kok.appendChild(el('p', { html: '<b>' + (a.maddeBaslik || 'Modelin varsayımları') + '</b>' }));
      var ul = el('ul');
      a.maddeler.forEach(function (m) { ul.appendChild(el('li', { html: m })); });
      kok.appendChild(ul);
    }
    return kok;
  };

  // ---------- Ama…: modelin açıklayamadığı gözlem ----------
  T.ama = function (a) {
    var kok = el('div');
    if (a.sonraki) {
      var d = GG.durakBul(a.sonraki);
      if (d) kok.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Sıradaki durak:</b> ' + d.kisi + ' (' + d.yil + ') · ' + d.soru }));
    }
    return kok;
  };
})();

</script>
<script>/* js/modeller.js */
/* Görünmeyeni Görmek — model çizimleri (Model Müzesi ve “Model” adımları) */
'use strict';
(function () {
  var C = GG.ciz;
  function fsz(w, h) { return Math.max(11, Math.min(24, Math.min(w / 30, h / 18))); }
  function yazi(ctx, s, x, y, boyut, renk, hiza, kalin) { C.yazi(ctx, s, x, y, { boyut: boyut, renk: renk || '#e2e8f0', hiza: hiza || 'center', kalin: kalin }); }
  // Belirli tohumla sabit rastgele sayılar (çizimler her karede aynı kalsın)
  function tohumlu(t) { var s = t; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  GG.modelKaydet('thales', {
    ad: 'Arkhe: su',
    ciz: function (ctx, w, h, s) {
      var cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.22, f = fsz(w, h);
      // damla
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 1.5);
      ctx.bezierCurveTo(cx + r * 1.1, cy - r * 0.2, cx + r, cy + r, cx, cy + r);
      ctx.bezierCurveTo(cx - r, cy + r, cx - r * 1.1, cy - r * 0.2, cx, cy - r * 1.5);
      var g = ctx.createLinearGradient(cx, cy - r * 1.5, cx, cy + r);
      g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#1d4ed8');
      ctx.fillStyle = g; ctx.fill();
      yazi(ctx, 'SU', cx, cy + r * 0.25, f * 1.4, '#fff', 'center', true);
      [['❄ buz', -2.3, -0.2], ['☁ buhar', 2.3, -0.9], ['🌱 canlılar', 2.3, 0.6]].forEach(function (e) {
        yazi(ctx, e[0], cx + e[1] * r, cy + e[2] * r, f, '#e0f2fe');
      });
      yazi(ctx, 'Her şey sudan oluşur ve suya döner.', cx, h - f * 1.2, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('demokritos', {
    ad: 'Atomos ve boşluk',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), rnd = tohumlu(7);
      for (var i = 0; i < 22; i++) {
        var bx = rnd() * w, by = rnd() * h * 0.8 + h * 0.05, tip = i % 4, r = 7 + rnd() * 9;
        var x = bx + Math.sin(s * (0.4 + rnd() * 0.4) + i) * 14, y = by + Math.cos(s * (0.3 + rnd() * 0.4) + i) * 10;
        ctx.save(); ctx.translate(x, y); ctx.rotate(s * 0.3 + i);
        ctx.fillStyle = ['#fbbf24', '#f472b6', '#60a5fa', '#a3e635'][tip];
        ctx.beginPath();
        if (tip === 0) ctx.arc(0, 0, r, 0, Math.PI * 2);
        else if (tip === 1) { ctx.moveTo(0, -r); ctx.lineTo(r, r); ctx.lineTo(-r, r); ctx.closePath(); }
        else if (tip === 2) { ctx.rect(-r, -r * 0.7, r * 2, r * 1.4); }
        else { ctx.arc(0, 0, r * 0.8, 0, Math.PI * 1.5); ctx.lineTo(r * 1.2, -r * 1.2); ctx.lineTo(r * 0.6, 0); ctx.closePath(); }
        ctx.fill(); ctx.restore();
      }
      yazi(ctx, 'Bölünemeyen parçacıklar (atomos) + aralarında boşluk', w / 2, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('aristoteles', {
    ad: 'Dört öğe ve dört nitelik',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.47, a = Math.min(w, h) * 0.3;
      var k = [[cx - a, cy - a * 0.75, '🔥 Ateş', '#f97316'], [cx + a, cy - a * 0.75, '💨 Hava', '#93c5fd'], [cx + a, cy + a * 0.75, '💧 Su', '#3b82f6'], [cx - a, cy + a * 0.75, '🪨 Toprak', '#a16207']];
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
      ctx.beginPath(); k.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }); ctx.closePath(); ctx.stroke();
      var n = [['SICAK', cx, cy - a * 0.75], ['NEMLİ', cx + a, cy], ['SOĞUK', cx, cy + a * 0.75], ['KURU', cx - a, cy]];
      n.forEach(function (q) { C.yd(ctx, q[1] - f * 2.4, q[2] - f * 0.7, f * 4.8, f * 1.4, 8); ctx.fillStyle = '#1e293b'; ctx.fill(); yazi(ctx, q[0], q[1], q[2], f * 0.8, '#fde68a', 'center', true); });
      k.forEach(function (p) { C.daire(ctx, p[0], p[1], f * 2.2, p[3]); yazi(ctx, p[2], p[0], p[1], f * 0.85, '#fff', 'center', true); });
      yazi(ctx, 'Boşluk yoktur; madde sürekli ve kesintisizdir.', cx, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('boyle', {
    ad: 'Taneciklerden oluşan hava',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), x0 = w * 0.2, x1 = w * 0.8, y0 = h * 0.18, y1 = h * 0.78;
      var piston = y0 + (y1 - y0) * (0.25 + 0.2 * (0.5 + 0.5 * Math.sin(s * 0.9)));
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(x0 + 3, piston - 12, x1 - x0 - 6, 12);
      ctx.fillRect((x0 + x1) / 2 - 5, y0 - h * 0.12, 10, piston - 12 - y0 + h * 0.12);
      var rnd = tohumlu(3);
      for (var i = 0; i < 30; i++) {
        var px = x0 + 10 + rnd() * (x1 - x0 - 20), py = piston + 10 + rnd() * (y1 - piston - 20);
        px += Math.sin(s * 3 + i) * 4; py += Math.cos(s * 2.6 + i * 2) * 4;
        C.kure(ctx, px, Math.min(y1 - 8, Math.max(piston + 8, py)), 6, '#38bdf8');
      }
      yazi(ctx, 'Sıkıştırınca tanecikler birbirine yaklaşır.', w / 2, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('lavoisier', {
    ad: 'Kütlenin korunumu',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.42, L = Math.min(w * 0.32, h * 0.6);
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, h * 0.78); ctx.moveTo(cx - L * 0.4, h * 0.78); ctx.lineTo(cx + L * 0.4, h * 0.78); ctx.stroke();
      var e = Math.sin(s * 1.2) * 0.015;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(e);
      ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L, 0); ctx.stroke();
      [-1, 1].forEach(function (k) {
        ctx.beginPath(); ctx.moveTo(k * L, 0); ctx.lineTo(k * L - 30, 50); ctx.moveTo(k * L, 0); ctx.lineTo(k * L + 30, 50); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(k * L, 52, 46, 10, 0, 0, Math.PI); ctx.fillStyle = '#94a3b8'; ctx.fill();
        yazi(ctx, k < 0 ? 'girenler' : 'ürünler', k * L, 90, f * 0.85, '#fde68a', 'center', true);
      });
      ctx.restore();
      yazi(ctx, 'Kapalı bir kapta toplam kütle değişmez.', cx, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('dalton', {
    ad: 'Dalton: içi dolu küre',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), r = Math.min(w, h) * 0.2;
      C.kure(ctx, w * 0.3, h * 0.45, r, '#64748b', '#f8fafc');
      yazi(ctx, 'bölünemez, içi dolu küre', w * 0.3, h * 0.45 + r + f * 1.2, f * 0.85, '#cbd5e1');
      var sx = w * 0.62, sy = h * 0.22, rr = f * 0.9;
      var sembol = [['H', 'nokta'], ['C', 'dolu'], ['O', 'bos'], ['N', 'cizgi']];
      yazi(ctx, 'Dalton’un sembolleri', sx + rr * 4, sy - f * 1.4, f * 0.85, '#fde68a', 'center', true);
      sembol.forEach(function (q, i) {
        var x = sx + i * rr * 2.8, y = sy;
        C.daire(ctx, x, y, rr, q[1] === 'dolu' ? '#e2e8f0' : '#0b1220', '#e2e8f0', 2);
        if (q[1] === 'nokta') C.daire(ctx, x, y, rr * 0.25, '#e2e8f0');
        if (q[1] === 'cizgi') { ctx.beginPath(); ctx.moveTo(x, y - rr); ctx.lineTo(x, y + rr); ctx.stroke(); }
        yazi(ctx, q[0], x, y + rr + f * 0.9, f * 0.8, '#cbd5e1');
      });
      function bilesik(liste, y, ad) {
        liste.forEach(function (q, i) {
          var x = sx + i * rr * 2.05;
          C.daire(ctx, x, y, rr, q === 'C' ? '#e2e8f0' : '#0b1220', '#e2e8f0', 2);
        });
        yazi(ctx, ad, sx + liste.length * rr * 2.05 + rr * 0.5, y, f * 0.8, '#cbd5e1', 'left');
      }
      bilesik(['C', 'O'], sy + rr * 5, 'karbon monoksit');
      bilesik(['O', 'C', 'O'], sy + rr * 7.6, 'karbon dioksit');
    }
  });

  GG.modelKaydet('thomson', {
    ad: 'Üzümlü kek modeli',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.46, r = Math.min(w, h) * 0.32;
      var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      g.addColorStop(0, 'rgba(252,165,165,0.95)'); g.addColorStop(1, 'rgba(220,38,38,0.6)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      var rnd = tohumlu(11);
      for (var i = 0; i < 10; i++) {
        var a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r * 0.78;
        var x = cx + Math.cos(a) * d + Math.sin(s * 3 + i) * 2, y = cy + Math.sin(a) * d + Math.cos(s * 2.5 + i) * 2;
        C.kure(ctx, x, y, f * 0.6, '#3b82f6');
        yazi(ctx, '−', x, y, f * 0.7, '#fff', 'center', true);
      }
      yazi(ctx, '+  pozitif “kek”  +', cx, cy - r - f * 0.8, f * 0.85, '#fecaca');
      yazi(ctx, 'Elektronlar pozitif bir kürenin içine gömülü.', cx, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  GG.modelKaydet('millikan', {
    ad: 'Yük paketlerle gelir: e',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), x0 = w * 0.18, taban = h * 0.8, adimH = h * 0.11;
      for (var n = 1; n <= 5; n++) {
        var y = taban - n * adimH;
        ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(w * 0.85, y); ctx.stroke();
        yazi(ctx, n + 'e', x0 - f * 1.2, y, f * 0.85, '#fde68a', 'center', true);
        for (var k = 0; k < n; k++) C.kure(ctx, x0 + f * 2 + k * f * 1.6, y, f * 0.55, '#60a5fa');
      }
      yazi(ctx, 'Bir damladaki yük hep e’nin tam katıdır: e = 1,6 × 10⁻¹⁹ C', w / 2, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  function cekirdekli(ctx, w, h, s, opt) {
    var f = fsz(w, h), cx = w / 2, cy = h * 0.46, R = Math.min(w, h) * 0.36;
    for (var i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(i * Math.PI / 3);
      ctx.strokeStyle = 'rgba(148,163,184,0.45)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.38, 0, 0, Math.PI * 2); ctx.stroke();
      var a = s * (1.2 + i * 0.3) + i * 2;
      C.kure(ctx, Math.cos(a) * R, Math.sin(a) * R * 0.38, f * 0.45, '#60a5fa');
      ctx.restore();
    }
    C.kure(ctx, cx, cy, f * 0.5, '#f97316');
    return { f: f, cx: cx, cy: cy, R: R };
  }
  GG.modelKaydet('rutherford', {
    ad: 'Çekirdekli atom',
    ciz: function (ctx, w, h, s) {
      var g = cekirdekli(ctx, w, h, s);
      yazi(ctx, 'küçük, yoğun, pozitif çekirdek', g.cx, g.cy + g.f * 1.8, g.f * 0.75, '#fdba74');
      yazi(ctx, 'Atomun büyük kısmı boşluktur (çekirdek aslında çok daha küçük).', g.cx, h - g.f * 1.1, g.f * 0.8, '#cbd5e1');
    }
  });

  GG.modelKaydet('bohr', {
    ad: 'Bohr modeli: enerji düzeyleri',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w * 0.42, cy = h * 0.48, R = Math.min(w, h) * 0.42;
      [1, 2, 3, 4].forEach(function (n) {
        var r = R * n * n / 16;
        if (r < f * 1.6) r = f * 1.6;
        ctx.strokeStyle = 'rgba(147,197,253,0.6)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        yazi(ctx, 'n=' + n, cx + r * 0.72 + f * 0.6, cy - r * 0.72, f * 0.75, '#bfdbfe');
      });
      C.kure(ctx, cx, cy, f * 0.5, '#f97316');
      var faz = (s % 4) / 4;
      var r3 = R * 9 / 16, r2 = R * 4 / 16;
      var r = faz < 0.5 ? r3 : r2;
      var a = s * 1.5;
      C.kure(ctx, cx + Math.cos(a) * r, cy + Math.sin(a) * r, f * 0.45, '#60a5fa');
      if (faz >= 0.5 && faz < 0.8) {
        ctx.strokeStyle = GG.dalgaRenk(656); ctx.lineWidth = 3; ctx.beginPath();
        var x0 = cx + Math.cos(a) * r, y0 = cy + Math.sin(a) * r;
        for (var k = 0; k < 60; k++) ctx.lineTo(x0 + k * 3, y0 - k * 1.2 + Math.sin(k * 0.8) * 6);
        ctx.stroke();
        yazi(ctx, 'ışık (foton)', x0 + 120, y0 - 60, f * 0.8, GG.dalgaRenk(656));
      }
      yazi(ctx, 'Elektron yalnızca belirli enerji düzeylerinde bulunur.', w / 2, h - f * 1.1, f * 0.8, '#cbd5e1');
    }
  });

  GG.modelKaydet('debroglie', {
    ad: 'Elektron bir dalgadır',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.46, R = Math.min(w, h) * 0.3, n = 4;
      ctx.strokeStyle = 'rgba(148,163,184,0.4)'; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 3; ctx.beginPath();
      for (var i = 0; i <= 360; i++) {
        var a = i / 360 * Math.PI * 2, rr = R + Math.sin(n * a) * Math.cos(s * 3) * R * 0.14;
        if (i) ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); else ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      ctx.stroke();
      C.kure(ctx, cx, cy, f * 0.5, '#f97316');
      yazi(ctx, 'Yörüngeye tam sayıda dalga sığmalı: n = 4', cx, h - f * 1.1, f * 0.85, '#cbd5e1');
    }
  });

  function bulutCiz(ctx, cx, cy, olcek, n, tohum, renk) {
    var rnd = tohumlu(tohum);
    ctx.fillStyle = renk || 'rgba(96,165,250,0.55)';
    for (var i = 0; i < n; i++) {
      var r = -(Math.log(rnd() + 1e-9) + Math.log(rnd() + 1e-9) + Math.log(rnd() + 1e-9)) * 0.5;
      var u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, sx = Math.sqrt(1 - u * u);
      ctx.fillRect(cx + r * sx * Math.cos(a) * olcek, cy + r * u * olcek, 2, 2);
    }
  }
  GG.modelKaydet('schrodinger', {
    ad: 'Elektron bulutu (orbital)',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.46, o = Math.min(w, h) * 0.13;
      bulutCiz(ctx, cx, cy, o, 2600, 5);
      C.kure(ctx, cx, cy, f * 0.35, '#f97316');
      yazi(ctx, 'Elektronun bulunma olasılığının yüksek olduğu bölge', cx, h - f * 1.1, f * 0.8, '#cbd5e1');
    }
  });

  GG.modelKaydet('heisenberg', {
    ad: 'Belirsizlik: kesin yörünge yok',
    ciz: function (ctx, w, h, s) {
      var f = fsz(w, h), cx = w / 2, cy = h * 0.46, o = Math.min(w, h) * 0.12;
      bulutCiz(ctx, cx, cy, o, 1800, 9, 'rgba(167,139,250,0.5)');
      ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(248,113,113,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, o * 1.6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

  GG.modelKaydet('chadwick', {

        } else {

      });

  function kutu(ctx, x, y, a, e, f) {
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.strokeRect(x, y, a, a);

  GG.modelKaydet('iyon', {

      yazi(ctx, '+ e⁻', w * 0.29, y2, f * 0.9, '#bfdbfe');

  function tabloOklari(ctx, w, h, f, yatay, dikey, renkY, renkD) {

    for (var j = 0; j <= 5; j++) { ctx.beginPath(); ctx.moveTo(x0, y0 + (y1 - y0) * j / 5); ctx.lineTo(x1, y0 + (y1 - y0) * j / 5); ctx.stroke(); }

  }
  GG.modelKaydet('yaricap', {
    ad: 'Atom yarıçapının değişimi',

      var f = fsz(w, h);

      var x0 = w * 0.18, x1 = w * 0.82, y0 = h * 0.2, y1 = h * 0.78, cw = (x1 - x0) / 8, ch = (y1 - y0) / 5;

      }

    }
  });

  GG.modelKaydet('iyonlasma', {
    ad: 'İyonlaşma enerjisinin değişimi',

      var f = fsz(w, h);
      tabloOklari(ctx, w, h, f, 'periyotta genel olarak artar', 'grupta azalır', '#f9a8d4', '#93c5fd');
      var x0 = w * 0.18, x1 = w * 0.82, y0 = h * 0.2, y1 = h * 0.78, cw = (x1 - x0) / 8, ch = (y1 - y0) / 5;
      for (var g = 0; g < 8; g++) for (var p = 0; p < 5; p++) {
        var o = Math.max(0.08, 0.15 + 0.1 * g - 0.12 * p);

      }

    }

  GG.modelKaydet('elektronegatiflik', {

      var x0 = w * 0.18, x1 = w * 0.82, y0 = h * 0.2, y1 = h * 0.78, cw = (x1 - x0) / 8, ch = (y1 - y0) / 5;

        ctx.fillRect(x0 + cw * g + 3, y0 + ch * p + 3, cw - 6, ch - 6);
      }
      yazi(ctx, 'F', x0 + cw * 6.5, y0 + ch * 0.5, f, '#fff', 'center', true);
      yazi(ctx, 'En elektronegatif element flordur (3,98). Soy gazlara değer verilmez.', w / 2, h - f * 0.9, f * 0.76, '#cbd5e1');
    }
  });

<script>/* js/simler/b1.js */
/* 1. bölüm deneyleri: Thales (su), Demokritos (bölme), Aristoteles (odun), Boyle (J tüpü), Lavoisier (terazi) */
'use strict';
(function () {
  var el = GG.el, C = GG.ciz;

  function arkaPlan(t, ust, alt) {
    var g = t.ctx.createLinearGradient(0, 0, 0, t.h);
    g.addColorStop(0, ust || '#111b30'); g.addColorStop(1, alt || '#0b1220');
    t.ctx.fillStyle = g; t.ctx.fillRect(0, 0, t.w, t.h);
  }
  function masaCiz(t, y) {
    var ctx = t.ctx;
    ctx.fillStyle = '#33271c'; ctx.fillRect(0, y, t.w, t.h - y);
    ctx.fillStyle = '#5b4631'; ctx.fillRect(0, y, t.w, 5);
  }
  function alev(ctx, x, y, guc, s, olcek) {
    olcek = olcek || 1;
    var H = (18 + guc * 70) * olcek * (1 + 0.08 * Math.sin(s * 23) + 0.05 * Math.sin(s * 37));
    var W = (10 + guc * 16) * olcek;
    [['rgba(255,140,40,0.85)', 1], ['rgba(255,210,90,0.9)', 0.66], ['rgba(140,190,255,0.9)', 0.32]].forEach(function (k) {
      var h = H * k[1], w = W * k[1];
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.bezierCurveTo(x + w, y - h * 0.45, x + w, y, x, y);
      ctx.bezierCurveTo(x - w, y, x - w, y - h * 0.45, x, y - h);
      ctx.fillStyle = k[0]; ctx.fill();
    });
  }

  // =====================================================================
  // THALES: Suyun hâlleri ve tohum deneyi
  // =====================================================================
  GG.simKaydet('su', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var hedefT = 20, T = 20, cam = false, gun = 0, kaynama = 0, yogusan = 0, bildirildi = false;
    var buhar = [], damla = [], dusen = [], kabarcik = [], buharEmit = 0, kabEmit = 0;
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    var sk = api.ui.kaydirici({ etiket: 'Sıcaklık', min: -20, max: 120, adim: 1, deger: 20, genis: true, bicim: function (v) { return v + ' °C'; }, degisti: function (v) { hedefT = v; } });
    var camA = api.ui.anahtar({ etiket: 'Soğuk camı buharın üstüne tut', degisti: function (v) { cam = v; } });
    y.kontrol.appendChild(sk.kok);
    y.kontrol.appendChild(camA.kok);
    y.kontrol.appendChild(el('span', { sinif: 'ayrac' }));
    y.kontrol.appendChild(api.ui.dugme('🌱 Bir gün geçsin', function () { if (gun < 7) gun++; if (gun >= 3) api.gozlem('tohum'); }));
    y.kontrol.appendChild(api.ui.dugme('Tohumları yeniden ek', function () { gun = 0; }));

    function geo() {
      var w = t.w, h = t.h, L = w * 0.64, masa = h * 0.88;
      var bw = Math.min(L * 0.34, h * 0.36), bh = bw * 1.05;
      var bx = L * 0.42 - bw / 2, byb = masa - h * 0.17, by = byb - bh;
      return { w: w, h: h, L: L, masa: masa, bw: bw, bh: bh, bx: bx, by: by, byb: byb, su: byb - bh * 0.5, camY: by - h * 0.14 };
    }
    function halAdi() { return T < 0 ? 'KATI (buz)' : (T < 99.5 ? 'SIVI (su)' : 'SIVI → GAZ (kaynıyor)'); }
    function yogus(x) {
      yogusan++;
      if (yogusan >= 12) {
        api.gozlem('yogusma');
        if (!bildirildi) { bildirildi = true; api.bildir('Buhar soğuk camda yeniden suya dönüştü!', 'iyi'); }
      }
      for (var j = 0; j < damla.length; j++) if (Math.abs(damla[j].x - x) < 14) { damla[j].r = Math.min(7, damla[j].r + 0.5); return; }
      damla.push({ x: x, r: 2.2 });
    }
    function guncelle(dt) {
      var g = geo(), i;
      buharEmit += (T >= 99.5 ? 36 : 0) * dt;
      while (buharEmit >= 1) {
        buharEmit--;
        if (buhar.length < 280) buhar.push({ x: g.bx + 10 + Math.random() * (g.bw - 20), y: g.su - 2, vx: (Math.random() - 0.5) * 18, vy: -(45 + Math.random() * 45), r: 3, omur: 0 });
      }
      for (i = buhar.length - 1; i >= 0; i--) {
        var p = buhar[i];
        p.omur += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 4;
        if (cam && p.y <= g.camY + 10 && p.x > g.bx - 40 && p.x < g.bx + g.bw + 40) { yogus(p.x); buhar.splice(i, 1); continue; }
        if (p.omur > 3.2 || p.y < -20) buhar.splice(i, 1);
      }
      kabEmit += (T > 70 && T >= 0 ? (T - 70) * 0.6 : 0) * dt;
      while (kabEmit >= 1) { kabEmit--; kabarcik.push({ x: g.bx + 12 + Math.random() * (g.bw - 24), y: g.byb - 8, r: 2 + Math.random() * 4 }); }
      for (i = kabarcik.length - 1; i >= 0; i--) {
        var k = kabarcik[i];
        k.y -= (60 + k.r * 12) * dt; k.x += Math.sin(k.y * 0.1) * 0.3;
        if (k.y < g.su + 2 || T < 0) kabarcik.splice(i, 1);
      }
      if (!cam) damla.length = 0;
      for (i = damla.length - 1; i >= 0; i--) if (damla[i].r >= 7) { dusen.push({ x: damla[i].x, y: g.camY + 14, vy: 0 }); damla.splice(i, 1); }
      for (i = dusen.length - 1; i >= 0; i--) { var d = dusen[i]; d.vy += 700 * dt; d.y += d.vy * dt; if (d.y >= g.su) dusen.splice(i, 1); }
    }
    function ciz(s) {
      var g = geo(), fs = GG.yaziBoyu(t);
      arkaPlan(t);
      masaCiz(t, g.masa);
      // sehpa
      ctx.strokeStyle = '#8a95a8'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(g.bx - 12, g.byb + 4); ctx.lineTo(g.bx + g.bw + 12, g.byb + 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.bx, g.byb + 4); ctx.lineTo(g.bx - 16, g.masa); ctx.moveTo(g.bx + g.bw, g.byb + 4); ctx.lineTo(g.bx + g.bw + 16, g.masa); ctx.stroke();
      var ox = g.bx + g.bw / 2;
      if (hedefT > 25) {
        ctx.fillStyle = '#4b5563'; ctx.fillRect(ox - 14, g.masa - 12, 28, 12);
        alev(ctx, ox, g.masa - 12, (hedefT - 20) / 100, s, g.h / 700);
      } else if (hedefT < 5) {
        C.yd(ctx, ox - g.bw * 0.35, g.byb + 10, g.bw * 0.7, g.masa - g.byb - 12, 8);
        ctx.fillStyle = 'rgba(96,165,250,0.35)'; ctx.fill(); ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 2; ctx.stroke();
        C.yazi(ctx, '❄ soğutucu', ox, (g.byb + g.masa) / 2 + 4, { boyut: fs * 0.8, hiza: 'center', renk: '#dbeafe' });
      }
      // su / buz
      var ix = g.bx + 5, iw = g.bw - 10;
      if (T < 0) {

        ctx.fillStyle = 'rgba(186,230,253,0.08)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(kx - br * 0.18, bcy - br * 0.98); ctx.lineTo(kx - br * 0.18, bcy - br * 1.6); ctx.moveTo(kx + br * 0.18, bcy - br * 0.98); ctx.lineTo(kx + br * 0.18, bcy - br * 1.6); ctx.stroke();
