    { baslik: 'Nasıl hazırlandı?', metin: 'Oyunun fikri, konusu ve pedagojik yönü bir BİLSEM kimya öğretmenine aittir. Oyunun kodu, deney benzetimleri ve metinleri öğretmenin isteği üzerine <b>Claude (Anthropic) yapay zekâ modeli</b> tarafından yazılmıştır. Bilgiler, her durağın öğretmen notunda listelenen kaynaklarla karşılaştırılmıştır. Yine de derste kullanmadan önce öğretmen tarafından gözden geçirilmesi önerilir.' },
    { baslik: 'Deneyler ve vakalar hakkında', metin: 'Ekrandaki deneyler gerçek deneylerin <b>sadeleştirilmiş benzetimleridir</b>; sayısal değerlerin hangilerinin ölçülmüş, hangilerinin temsilî olduğu öğretmen notlarında belirtilir. Kaza vakaları gerçek olaylardan esinlenen <b>kurgu</b> örneklerdir.' },
    { baslik: '⚠ Güvenlik uyarısı', metin: 'Bu oyundaki karıştırma ve kaza deneyleri yalnızca ekranda yapılmak içindir. Temizlik ürünlerini ve başka kimyasalları gerçekte <b>asla birbirine karıştırmayın</b>. Zehirlenme şüphesinde 112 Acil Çağrı Merkezi’ni arayın.' }
  ]
};

</script>
<script>/* js/motor.js */
/* Sınıf içi keşif oyunu motoru — ekranlar, yönlendirme ve adım motoru (oyuna özgü ayarlar js/oyun.js içindeki GG.OYUN'da) */
'use strict';
(function () {
  var el = GG.el;
  var O = GG.OYUN;
  var ANAHTAR = O.anahtar;

  GG.durum = GG.depo.oku(ANAHTAR, null) || {};
  ['tamam', 'tahmin', 'ilk'].forEach(function (k) { if (!GG.durum[k]) GG.durum[k] = {}; });
  GG.kaydet = function () { GG.depo.yaz(ANAHTAR, GG.durum); };

  GG.bolumler = O.bolumler;
  GG.kazanimlar = O.kazanimlar;

  var ETIKET = {
    anlati: 'SORU', tahmin: 'TAHMİN', deney: 'DENEY', cikarim: 'ÇIKARIM', coklu: 'ÇIKARIM',
    siniflandir: 'ÇIKARIM', sirala: 'ÇIKARIM', veri: 'VERİ', model: 'BULGU', ama: 'SIRADAKİ'
  };

  var kok = null;       // #uygulama
  var aktif = null;     // açık durağın durumu

  GG.sirali = function () { return GG.duraklar.slice().sort(function (a, b) { return a.sira - b.sira; }); };
  GG.bolumRengi = function (no) { return (GG.bolumler[no - 1] || GG.bolumler[0]).renk; };
  function renkAyarla(r) { kok.style.setProperty('--renk', r); document.documentElement.style.setProperty('--renk', r); }

  // ================= Yönlendirme =================
  function rota() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/');
    if (p[0] === 'durak' && GG.durakBul(p[1])) { durakEkrani(GG.durakBul(p[1]), Number(p[2]) || 0); return; }
    if (p[0] === 'muze') { sayfaKur(muzeSayfasi()); return; }
    if (p[0] === 'ogretmen') { sayfaKur(ogretmenSayfasi()); return; }
    if (p[0] === 'hakkinda') { sayfaKur(hakkindaSayfasi()); return; }
    if (p[0] === 'final' && GG.finalSayfasi) { sayfaKur(GG.finalSayfasi()); return; }
    sayfaKur(haritaSayfasi());
  }
  GG.git = function (yol) {
    var hedef = '#/' + yol;
    if (location.hash === hedef) rota(); else location.hash = hedef;
  };

  function sayfaKur(dugum) {
    durakKapat();
    GG.bosalt(kok);
    renkAyarla('#2456c4');
    kok.appendChild(dugum);
    window.scrollTo(0, 0);
  }

  function ustCubukSayfa(baslik) {
    return el('div', { sinif: 'ust-cubuk' }, [
      GG.ui.dugme('◀ Harita', function () { GG.git(''); }),
      el('div', { sinif: 'ust-baslik' }, [el('span', { sinif: 'ust-kisi', metin: baslik })]),
      tamEkranDugmesi()
    ]);
  }
  function tamEkranDugmesi() {
    return GG.ui.dugme('⛶ Tam ekran', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      } catch (e) { /* tarayıcı izin vermeyebilir */ }
    }, 'kucuk');
  }

  // ================= Harita =================
  function haritaSayfasi() {
    var duraklar = GG.sirali();
    var tamamSayisi = duraklar.filter(function (d) { return GG.durum.tamam[d.id]; }).length;
    var s = el('div', { sinif: 'harita' });
    s.appendChild(el('div', { sinif: 'harita-ust' }, [
      el('div', null, [
        el('h1', { metin: O.baslik }),
        el('div', { sinif: 'alt-baslik', html: O.altBaslik + ' <b>' + tamamSayisi + ' / ' + duraklar.length + '</b> durak tamamlandı.' })
      ]),
      el('div', { sinif: 'harita-dugmeler' }, [
        GG.ui.dugme(O.muze.dugme, function () { GG.git('muze'); }),
        GG.ui.dugme('👩‍🏫 Öğretmen', function () { GG.git('ogretmen'); }),
        GG.ui.dugme('ℹ Hakkında', function () { GG.git('hakkinda'); }),
        tamEkranDugmesi()
      ])
    ]));
    var serit = el('div', { sinif: 'yontem-seridi' }, ['Her durakta:']);
    O.yontem.adimlar.forEach(function (a, k) {
      if (k) serit.appendChild(document.createTextNode('→'));
      serit.appendChild(el('span', { sinif: 'adim', metin: (k + 1) + ' ' + a }));
    });
    if (O.yontem.not) serit.appendChild(el('span', { metin: '  ' + O.yontem.not }));
    s.appendChild(serit);
    GG.bolumler.forEach(function (b) {
      var bd = duraklar.filter(function (d) { return d.bolum === b.no; });
      if (!bd.length) return;
      var bolum = el('section', { sinif: 'bolum', stil: '--renk:' + b.renk });
      bolum.appendChild(el('div', { sinif: 'bolum-baslik' }, [
        el('span', { sinif: 'bolum-no', metin: b.no + '. BÖLÜM' }),
        el('span', { sinif: 'bolum-ad', metin: b.ad }),
        el('span', { sinif: 'bolum-alt', metin: b.alt })
      ]));
      var izgara = el('div', { sinif: 'durak-izgara' });
      bd.forEach(function (d) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti' + (GG.durum.tamam[d.id] ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('durak/' + d.id + '/0'); }
        }, [
          el('div', { sinif: 'yil', metin: d.yil }),
          el('div', { sinif: 'kisi', metin: d.kisi }),
          el('div', { sinif: 'soru', metin: d.soru }),
          el('div', { sinif: 'kazanim', metin: (d.kazanim || []).join(' · ').replace(/KİM\.9\.1\./g, '9.1.') })
        ]));
      });
      if (b.no === GG.bolumler.length && GG.finalSayfasi) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti final-karti' + (GG.durum.tamam.final ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('final'); }
        }, [
          el('div', { sinif: 'yil', metin: 'FİNAL' }),
          el('div', { sinif: 'kisi', metin: O.final.ad }),
          el('div', { sinif: 'soru', metin: O.final.soru })
        ]));
      }
      bolum.appendChild(izgara);
      s.appendChild(bolum);
    });
    return s;
  }

  // ================= Durak ekranı =================
  function durakKapat() {
    if (!aktif) return;
    sahneTemizle();
    document.removeEventListener('keydown', aktif.tus);
    if (aktif.cekmece && aktif.cekmece.parentNode) aktif.cekmece.parentNode.removeChild(aktif.cekmece);
    aktif = null;
  }

  function durakEkrani(d, i) {
    if (!aktif || aktif.durak !== d) {
      durakKapat();
      GG.bosalt(kok);
      var renk = GG.bolumRengi(d.bolum);
      renkAyarla(renk);
      aktif = {
        durak: d, adimNo: -1, gozlemler: {}, dinleyiciler: [], cozuldu: {}, paylasim: {},
        sim: null, sahneAnahtar: null
      };
      var serit = el('div', { sinif: 'adim-seridi' });
      var notDugme = GG.ui.dugme('📝 Öğretmen notu', function () { aktif.cekmece.classList.toggle('acik'); }, 'kucuk');
      kok.appendChild(el('div', { sinif: 'ust-cubuk' }, [
        GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
        el('div', { sinif: 'ust-baslik' }, [
          el('span', { sinif: 'ust-yil', metin: d.yil }),
          el('span', { sinif: 'ust-kisi', metin: d.kisi }),
          el('span', { sinif: 'ust-soru', metin: d.soru })
        ]),
        serit, notDugme, tamEkranDugmesi()
      ]));
      var sahne = el('div', { sinif: 'sahne' });
      var panelIc = el('div', { sinif: 'panel-ic' });
      var geri = GG.ui.dugme('◀ Geri', function () { if (aktif.adimNo > 0) adimGoster(aktif.adimNo - 1); });
      var gec = GG.ui.dugme('öğretmen: geç', function () { aktif.hazirla(true); }, 'sade kucuk');
      var ileri = GG.ui.dugme('İleri ▶', ileriBas, 'ana');
      var panel = el('div', { sinif: 'panel' }, [panelIc, el('div', { sinif: 'panel-alt' }, [geri, el('span', { stil: 'flex:1' }), gec, ileri])]);
      kok.appendChild(el('div', { sinif: 'durak-govde' }, [sahne, panel]));
      aktif.serit = serit; aktif.sahneKap = sahne; aktif.panelIc = panelIc;
      aktif.geri = geri; aktif.ileri = ileri; aktif.gec = gec;
      aktif.cekmece = cekmeceKur(d);
      document.body.appendChild(aktif.cekmece);
      aktif.tus = function (e) {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.key === 'ArrowRight' && !aktif.ileri.disabled) { e.preventDefault(); ileriBas(); }
        else if (e.key === 'ArrowLeft' && aktif.adimNo > 0) { e.preventDefault(); adimGoster(aktif.adimNo - 1); }
      };
      document.addEventListener('keydown', aktif.tus);
    }
    adimGoster(Math.max(0, Math.min(d.adimlar.length - 1, i)));
  }

  function ileriBas() {
    var d = aktif.durak;
    if (aktif.adimNo < d.adimlar.length - 1) adimGoster(aktif.adimNo + 1);
    else durakBitti(d);
  }

  function sahneCoz(d, i) {
    for (var j = i; j >= 0; j--) if (d.adimlar[j].sahne !== undefined) return d.adimlar[j].sahne;
    return 'kapak';
  }

  function adimGoster(i) {
    var d = aktif.durak, adim = d.adimlar[i];
    aktif.adimNo = i;
    aktif.dinleyiciler = [];
    try { history.replaceState(null, '', '#/durak/' + d.id + '/' + i); } catch (e) { /* file:// bazı tarayıcılarda */ }

    var tanim = sahneCoz(d, i), anahtar = JSON.stringify(tanim);
    if (anahtar !== aktif.sahneAnahtar) { sahneKur(tanim); aktif.sahneAnahtar = anahtar; }

    // Adım şeridi
    GG.bosalt(aktif.serit);
    d.adimlar.forEach(function (a, k) {
      aktif.serit.appendChild(el('button', {
        type: 'button', sinif: 'adim-nokta' + (k === i ? ' aktif' : (k < i ? ' gecti' : '')),
        metin: (a.etiket || ETIKET[a.tur] || '').replace('…', ''), title: a.baslik ? a.baslik.replace(/<[^>]+>/g, '') : '',
        onclick: function () { adimGoster(k); }
      }));
    });

    var etkin = aktif.serit.children[i];
    if (etkin) aktif.serit.scrollLeft = Math.max(0, etkin.offsetLeft - aktif.serit.offsetLeft - aktif.serit.clientWidth / 2);

    // Panel
    var ic = aktif.panelIc;
    GG.bosalt(ic);
    ic.scrollTop = 0;
    var hazir = false;
    function boya() {
      aktif.ileri.disabled = !hazir;
      aktif.gec.style.visibility = hazir ? 'hidden' : 'visible';
      aktif.geri.disabled = i === 0;
      aktif.ileri.innerHTML = i === d.adimlar.length - 1 ? 'Durağı tamamla ✓' : 'İleri ▶';
    }
    aktif.hazirla = function (v) {
      hazir = v !== false;
      if (hazir) aktif.cozuldu[i] = true;
      boya();
    };
    var baglam = {
      durak: d, adimNo: i, adim: adim,
      cozuldu: !!aktif.cozuldu[i],
      hazir: function (v) { aktif.hazirla(v); },
      gozlemVar: function (id) { return !!aktif.gozlemler[id]; },
      gozlemDinle: function (f) { aktif.dinleyiciler.push(f); },
      ilkDeneme: function (dogruMu) {
        var k = d.id + ':' + i;
        if (!(k in GG.durum.ilk)) { GG.durum.ilk[k] = dogruMu; GG.kaydet(); }
      },
      tahminBul: function () {
        for (var j = i - 1; j >= 0; j--) if (d.adimlar[j].tur === 'tahmin') return { adim: d.adimlar[j], oylar: GG.durum.tahmin[d.id + ':' + j] || {} };
        return null;
      },
      sim: function () { return aktif.sim && aktif.sim.inst; },
      paylasim: aktif.paylasim
    };
    ic.appendChild(el('span', { sinif: 'etiket-cip', metin: adim.etiket || ETIKET[adim.tur] || '' }));
    if (adim.baslik) ic.appendChild(el('h2', { html: adim.baslik }));
    if (adim.metin) ic.appendChild(el('div', { sinif: 'adim-metin', html: adim.metin }));
    ortakParcalar(ic, adim, 'ust');
    var tur = GG.adimTurleri[adim.tur];
    if (tur) { var dugum = tur(adim, baglam); if (dugum) ic.appendChild(dugum); }
    ortakParcalar(ic, adim, 'alt');
    if (!tur || adim.tur === 'anlati' || adim.tur === 'model' || adim.tur === 'ama' || adim.tur === 'veri') hazir = true;
    if (hazir) aktif.cozuldu[i] = true;
    boya();

    var s = aktif.sim && aktif.sim.inst;
    if (s && typeof s.adim === 'function') s.adim(adim.simAyar || {}, adim);
  }

  function ortakParcalar(ic, adim, yer) {
    if (yer === 'ust') {
      if (adim.alinti) ic.appendChild(el('div', { sinif: 'alinti', html: adim.alinti.metin + (adim.alinti.kaynak ? '<span>' + adim.alinti.kaynak + '</span>' : '') }));
      if (adim.kartlar && adim.tur !== 'siniflandir') {
        var iz = el('div', { sinif: 'kart-izgara' });
        adim.kartlar.forEach(function (k) {
          iz.appendChild(el('div', { sinif: 'kanit-kart' }, [
            k.ikon ? el('span', { sinif: 'ikon', metin: k.ikon + ' ' }) : null,
            el('b', { html: k.baslik }), el('span', { html: k.metin })
          ]));
        });
        ic.appendChild(iz);
      }
      if (adim.tablo) ic.appendChild(GG.tabloYap(adim.tablo));
    } else {
      if (adim.bilgi) ic.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Biliyor musun?</b> ' + adim.bilgi }));
    }
  }

  GG.tabloYap = function (t) {
    var tablo = el('table', { sinif: t.sinif || 'veri-tablo' });
    if (t.baslik) tablo.appendChild(el('caption', { html: t.baslik, stil: 'caption-side:top;text-align:left;font-weight:700;padding:.2rem 0' }));
    var thead = el('thead'), tr = el('tr');
    t.sutunlar.forEach(function (s) { tr.appendChild(el('th', { html: s })); });
    thead.appendChild(tr); tablo.appendChild(thead);
    var tbody = el('tbody');
    t.satirlar.forEach(function (sat) {
      var r = el('tr');
      sat.forEach(function (h) { r.appendChild(el('td', { html: String(h) })); });
      tbody.appendChild(r);
    });
    tablo.appendChild(tbody);
    return tablo;
  };

  // ---------- Sahne ----------
  function sahneTemizle() {
    if (aktif && aktif.sim) {
      var s = aktif.sim;
      try { if (s.inst && s.inst.yoket) s.inst.yoket(); } catch (e) { console.error(e); }
      s.temizlik.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
      aktif.sim = null;
    }
    if (aktif && aktif.modelDur) { aktif.modelDur(); aktif.modelDur = null; }
  }

  function sahneKur(tanim) {
    sahneTemizle();
    var kap = aktif.sahneKap;
    GG.bosalt(kap);
    if (tanim === 'kapak' || !tanim) { kap.appendChild(kapakDugum(aktif.durak)); return; }
    if (tanim.model) { aktif.modelDur = GG.modelCiz(kap, tanim.model, true); return; }
    var kur = GG.simler[tanim.sim];
    if (!kur) { kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney bulunamadı: ' + tanim.sim })); return; }
    var temizlik = [];
    var api = {
      ayar: tanim.ayar || {},
      paylasim: aktif.paylasim,
      gozlem: function (id) { gozlemEkle(id); },
      tuval: function (k) { var t = GG.tuval(k); temizlik.push(t.yoket); return t; },
      dongu: function (f) { var dur = GG.dongu(f); temizlik.push(dur); return dur; },
      bildir: function (m, tur) { sahneBildirim(m, tur); },
      ui: GG.ui,
      yerlesim: function () {
        var ust = el('div', { sinif: 'sim-ust' });
        var tk = el('div', { sinif: 'tuval-kap' });
        var kontrol = el('div', { sinif: 'sim-kontrol' });
        var sk = el('div', { sinif: 'sim-kok' }, [ust, tk, kontrol]);
        kap.appendChild(sk);
        return { ust: ust, tuvalKap: tk, kontrol: kontrol, kok: sk };
      }
    };
    aktif.sim = { tanim: tanim, temizlik: temizlik, api: api, inst: null };
    try { aktif.sim.inst = kur(kap, api) || {}; }
    catch (e) { console.error(e); kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney yüklenemedi: ' + e.message })); }
  }

  function gozlemEkle(id) {
    if (!aktif || aktif.gozlemler[id]) return;
    aktif.gozlemler[id] = true;
    aktif.dinleyiciler.slice().forEach(function (f) { try { f(id); } catch (e) { console.error(e); } });
  }
  GG._gozlemEkle = gozlemEkle; // test için

  function sahneBildirim(m, tur) {
    if (!aktif) return;
    var b = el('div', { sinif: 'sahne-bildirim' + (tur ? ' ' + tur : ''), html: m });
    aktif.sahneKap.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 3300);
  }

  function kapakDugum(d) {
    var renk = GG.bolumRengi(d.bolum);
    var b = GG.bolumler[d.bolum - 1];
    return el('div', {
      sinif: 'kapak',
      stil: 'background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.16), transparent 45%), linear-gradient(135deg, ' + renk + ', #0b1220 120%)'
    }, [
      el('div', { sinif: 'kapak-bolum', metin: b.no + '. BÖLÜM · ' + b.ad.toLocaleUpperCase('tr-TR') }),
      el('div', { sinif: 'kapak-yil', metin: d.yil }),
      el('div', { sinif: 'kapak-kisi', metin: d.kisiTam || d.kisi }),
      d.yer ? el('div', { sinif: 'kapak-yer', metin: d.yer }) : null,
      el('div', { sinif: 'kapak-soru', metin: d.soru })
    ]);
  }

  // Model çizimi: kap içine tuval açar; animasyonlu ise durdurma işlevi döner
  GG.modelCiz = function (kap, id, animasyon, basliksiz) {
    var m = GG.modeller[id];
    var tk = el('div', { sinif: 'tuval-kap', stil: 'position:absolute;left:0;top:0;right:0;bottom:0' });
    kap.appendChild(tk);
    var t = GG.tuval(tk);
    if (!basliksiz && m && m.ad) kap.appendChild(el('div', { sinif: 'model-baslik', metin: m.ad }));
    function ciz(zaman) {
      t.temizle('#0b1220');
      if (m) m.ciz(t.ctx, t.w, t.h, zaman / 1000);
    }
    if (!animasyon) {
      ciz(2500);
      t.boyutDegisti(function () { ciz(2500); });
      return function () { t.yoket(); };
    }
    var dur = GG.dongu(function (dt, zaman) { ciz(zaman); });
    return function () { dur(); t.yoket(); };
  };

  function durakBitti(d) {
    GG.durum.tamam[d.id] = true;
    GG.kaydet();
    var sira = GG.sirali();
    var k = sira.indexOf(d);
    var sonraki = sira[k + 1];
    var mt = el('div', { sinif: 'model-tuval' });
    var m = d.model && GG.modeller[d.model];
    var ortu = el('div', { sinif: 'ortu' });
    var durMod = null;
    function kapat() { if (durMod) durMod(); if (ortu.parentNode) ortu.parentNode.removeChild(ortu); }
    var modal = el('div', { sinif: 'modal' }, [
      el('span', { sinif: 'etiket-cip', metin: 'DURAK TAMAMLANDI' }),
      el('h2', { html: d.kisi + ' (' + d.yil + ')' }),
      m ? mt : null,
      el('p', { html: m ? '<b>' + m.ad + '</b> ' + O.muze.eklendi + ' ' + (d.ozet || '') : (d.ozet || '') }),
      el('div', { sinif: 'modal-dugmeler' }, [
        GG.ui.dugme('Haritaya dön', function () { kapat(); GG.git(''); }),
        sonraki ? GG.ui.dugme('Sonraki durak: ' + sonraki.kisi + ' (' + sonraki.yil + ') ▶', function () { kapat(); GG.git('durak/' + sonraki.id + '/0'); }, 'ana')
          : (GG.finalSayfasi ? GG.ui.dugme('Finale geç ▶', function () { kapat(); GG.git('final'); }, 'ana') : null)
      ])
    ]);
    ortu.appendChild(modal);
    document.body.appendChild(ortu);
    if (m) durMod = GG.modelCiz(mt, d.model, true, true);
  }

  // ---------- Öğretmen notu çekmecesi ----------
  function cekmeceKur(d) {
    var o = d.ogretmen || {};
    var c = el('aside', { sinif: 'cekmece', 'aria-label': 'Öğretmen notu' });
    var ic = el('div', { sinif: 'cekmece-ic' });
    c.appendChild(el('div', { sinif: 'cekmece-ust' }, [
      el('b', { metin: 'Öğretmen notu · ' + d.kisi }),
      GG.ui.dugme('Kapat ✕', function () { c.classList.remove('acik'); }, 'kucuk')
    ]));
    c.appendChild(ic);
    if (o.sure) ic.appendChild(el('p', { html: '<b>Önerilen süre:</b> ' + o.sure }));
    if (d.kazanim && d.kazanim.length) {
      ic.appendChild(el('h3', { metin: 'Öğrenme çıktısı (Maarif Modeli, 9. sınıf)' }));
      d.kazanim.forEach(function (kod) {
        var k = GG.kazanimlar[kod];
        if (!k) return;
        var ul = el('ul');
        ic.appendChild(el('p', { html: '<span class="kazanim-kod">' + kod + '</span> ' + k.metin }));
        var bilesenler = (o.bilesenler && o.bilesenler[kod]) || [];
        bilesenler.forEach(function (h) { if (k.bilesen[h]) ul.appendChild(el('li', { html: '<b>' + h + ')</b> ' + k.bilesen[h] })); });
        if (ul.childNodes.length) ic.appendChild(ul);
      });
    }
    function liste(baslik, dizi) {
      if (!dizi || !dizi.length) return;
      ic.appendChild(el('h3', { metin: baslik }));
      var ul = el('ul');
      dizi.forEach(function (x) { ul.appendChild(el('li', { html: x })); });
      ic.appendChild(ul);
    }
    if (o.amac) { ic.appendChild(el('h3', { metin: 'Bu durağın amacı' })); ic.appendChild(el('p', { html: o.amac })); }
    liste('Sınıfta sorulabilecek sorular', o.tartisma);
    liste('Dikkat: sık görülen kavram yanılgıları', o.yanilgilar);
    liste('Bilimsel doğruluk notları', o.notlar);
    liste('Kaynaklar', o.kaynaklar);
    return c;
  }

  // ================= Model Müzesi =================
  var muzeHepsi = false;
  function muzeSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    var kapsayici = el('div');
    var dugme = GG.ui.dugme(muzeHepsi ? 'Yalnızca keşfedilenleri göster' : 'Öğretmen: tümünü göster', function () { muzeHepsi = !muzeHepsi; rota(); }, 'kucuk');
    s.appendChild(ustCubukSayfa(O.muze.ad));
    var ic = el('div', { stil: 'padding: 0 0 2rem' });
    ic.appendChild(el('h1', { metin: O.muze.dugme }));
    ic.appendChild(el('p', { html: O.muze.aciklama }));
    ic.appendChild(dugme);
    var iz = el('div', { sinif: 'muze-izgara' });
    var durdurucular = [];
    GG.sirali().forEach(function (d) {
      if (!d.model) return;
      var acik = muzeHepsi || GG.durum.tamam[d.id];
      var mt = el('div', { sinif: 'model-tuval' });
      var m = GG.modeller[d.model];
      var kart = el('div', { sinif: 'muze-kart' + (acik ? '' : ' kilitli'), stil: '--renk:' + GG.bolumRengi(d.bolum) }, [
        mt,
        el('div', { sinif: 'govde' }, [
          el('div', { sinif: 'yil', metin: d.yil + ' · ' + d.kisi }),
          el('div', { sinif: 'ad', metin: acik && m ? m.ad : '???' }),
          el('div', { sinif: 'ozet', html: acik ? (d.muzeOzet || d.ozet || '') : O.muze.kilitli })
        ])
      ]);
      iz.appendChild(kart);
      if (acik) durdurucular.push(function () { return GG.modelCiz(mt, d.model, false, true); });
    });
    ic.appendChild(iz);
    kapsayici.appendChild(ic);
    s.appendChild(kapsayici);
    // Tuvaller yerleştikten sonra çiz
    setTimeout(function () { durdurucular.forEach(function (f) { f(); }); }, 0);
    return s;
  }

  // ================= Öğretmen sayfası =================
  function ogretmenSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Öğretmen'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: '👩‍🏫 Öğretmen sayfası' }));
    ic.appendChild(el('h2', { metin: 'Derste nasıl kullanılır?' }));
    ic.appendChild(el('ul', null, O.ogretmenKullanim.map(function (h) { return el('li', { html: h }); })));
    ic.appendChild(el('h2', { metin: 'Öğrenme çıktılarıyla eşleşme' }));
    var satirlar = GG.sirali().map(function (d) {
      var o = d.ogretmen || {};
      var bil = [];
      (d.kazanim || []).forEach(function (kod) {
        var b = (o.bilesenler && o.bilesenler[kod]) || [];
        bil.push('<b>' + kod + '</b>' + (b.length ? ' (' + b.join(', ') + ')' : ''));
      });
      return [d.yil, d.kisi, d.soru, bil.join('<br>'), o.sure || ''];
    });
    ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: [O.yilSutunu || 'Yıl', 'Durak', 'Durağın sorusu', 'Öğrenme çıktısı (süreç bileşeni)', 'Süre'], satirlar: satirlar }));
    ic.appendChild(el('p', { sinif: 'ipucu-metin', html: O.programKaynagi }));

    ic.appendChild(el('h2', { metin: 'Sınıfın tahminleri' }));
    var tahminSatir = [];
    GG.sirali().forEach(function (d) {
      d.adimlar.forEach(function (a, k) {
        if (a.tur !== 'tahmin') return;
        var oylar = GG.durum.tahmin[d.id + ':' + k];
        if (!oylar) return;
        var toplam = 0; Object.keys(oylar).forEach(function (x) { toplam += oylar[x]; });
        if (!toplam) return;
        var dagilim = a.secenekler.map(function (sec) {
          var n = oylar[sec.id] || 0;
          return (sec.id === a.dogru ? '✔ ' : '') + sec.metin.replace(/<[^>]+>/g, '') + ': <b>' + n + '</b>';
        }).join('<br>');
        tahminSatir.push([d.kisi, (a.soru || '').replace(/<[^>]+>/g, ''), dagilim]);
      });
    });
    if (tahminSatir.length) ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: ['Durak', 'Soru', 'Oylar (✔ deneyin sonucu)'], satirlar: tahminSatir }));
    else ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Henüz oylama kaydedilmedi.' }));

    ic.appendChild(el('h2', { metin: 'Yeni sınıf' }));
    ic.appendChild(el('p', { metin: 'Başka bir sınıfla başlamadan önce ilerlemeyi ve oylamaları sıfırlayabilirsiniz.' }));
    ic.appendChild(GG.ui.dugme('İlerlemeyi ve oyları sıfırla', function () {
      if (window.confirm('Tüm ilerleme ve sınıf oyları silinsin mi?')) {
        GG.durum.tamam = {}; GG.durum.tahmin = {}; GG.durum.ilk = {}; GG.kaydet(); GG.git('');
      }
    }));

    // Yedek: tarayıcı belleği silinirse ilerleme ve oylar dosyadan geri yüklenebilir
    ic.appendChild(el('h2', { metin: 'İlerlemeyi yedekle' }));
    ic.appendChild(el('p', { metin: 'İlerleme ve oylar bu tahtanın tarayıcısında saklanır. Tarayıcı belleği silinirse kaybolur. Ders sonunda bir yedek dosyası indirip daha sonra (başka bir tahtada da) geri yükleyebilirsiniz.' }));
    var yedekGiris = el('input', { type: 'file', accept: '.json,application/json', stil: 'display:none' });
    yedekGiris.addEventListener('change', function () {
      var dosya = yedekGiris.files && yedekGiris.files[0];
      if (!dosya) return;
      var okuyucu = new FileReader();
      okuyucu.onload = function () {
        try {
          var veri = JSON.parse(okuyucu.result);
          if (!veri || veri.anahtar !== ANAHTAR || typeof veri.durum !== 'object') { window.alert('Bu yedek dosyası bu oyuna ait değil.'); return; }
          if (!window.confirm('Yedekteki ilerleme yüklensin mi? Bu tahtadaki şimdiki ilerlemenin yerine geçer.')) return;
          GG.durum = veri.durum; GG.kaydet(); GG.git('');
        } catch (e) { window.alert('Yedek dosyası okunamadı.'); }
      };
      okuyucu.readAsText(dosya);
      yedekGiris.value = '';
    });
    ic.appendChild(yedekGiris);
    ic.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap' }, [
      GG.ui.dugme('💾 Yedeği indir', function () {
        var t = new Date(), gun = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
        var blob = new Blob([JSON.stringify({ anahtar: ANAHTAR, oyun: document.title, tarih: t.toISOString(), durum: GG.durum })], { type: 'application/json' });
        var a = el('a', { href: URL.createObjectURL(blob), download: ANAHTAR + '-yedek-' + gun + '.json' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }),
      GG.ui.dugme('📂 Yedekten yükle', function () { yedekGiris.click(); })
    ]));

    // Kilit: kilitli sürümde tahta şifreyi hatırlıyorsa burada unutturulur
    var kilitVar = false;
    try { kilitVar = !!window.localStorage.getItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
    if (kilitVar) {
      ic.appendChild(el('h2', { metin: 'Kilit' }));
      ic.appendChild(el('p', { metin: 'Bu tahta oyunların şifresini hatırlıyor. Kilitlerseniz bu tahtadaki bütün oyunlar bir sonraki açılışta yeniden şifre ister. İlerleme silinmez.' }));
      ic.appendChild(GG.ui.dugme('🔒 Bu tahtada kilitle', function () {
        try { window.localStorage.removeItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
        window.location.reload();
      }));
    }
    s.appendChild(ic);
    return s;
  }

  // ================= Hakkında =================
  function hakkindaSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Hakkında'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: O.baslik }));
    O.hakkinda.forEach(function (b) {
      if (b.baslik) ic.appendChild(el('h2', { metin: b.baslik }));
      ic.appendChild(el('p', { html: b.metin }));
    });
    ic.appendChild(el('h2', { metin: 'Kaynaklar' }));
    var ul = el('ul');
    var gorulen = {};
    GG.sirali().forEach(function (d) {
      ((d.ogretmen && d.ogretmen.kaynaklar) || []).forEach(function (k) { if (!gorulen[k]) { gorulen[k] = 1; ul.appendChild(el('li', { html: k })); } });
    });
    ic.appendChild(ul);
    ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: O.surum }));
    s.appendChild(ic);
    return s;
  }

  // ================= Başlat =================
  GG.baslat = function () {
    kok = document.getElementById('uygulama');
    window.addEventListener('hashchange', rota);
    rota();
  };
  GG._aktif = function () { return aktif; }; // test için
  GG._adimGoster = function (i) { adimGoster(i); };
})();

</script>
<script>/* js/adimlar.js */
/* Kimya Hayattır — adım türleri (panelde görünen etkinlikler) */
'use strict';
(function () {
  var el = GG.el;
  var T = GG.adimTurleri;

  function toplamOy(oylar) { var t = 0; Object.keys(oylar).forEach(function (k) { t += oylar[k] || 0; }); return t; }
  function salla(d) { d.classList.remove('sallan'); void d.offsetWidth; d.classList.add('sallan'); }

  // ---------- Anlatı: metin motor tarafından yazılır ----------
  T.anlati = function () { return null; };
  T.veri = function () { return null; };

  // ---------- Tahmin (sınıf oylaması) ----------
  T.tahmin = function (a, b) {
    var k = b.durak.id + ':' + b.adimNo;
    var oylar = GG.durum.tahmin[k] || {};
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Sınıfa sorun: Her seçenek için el kaldıranları sayıp + ile ekleyin. İsterseniz oylamadan da devam edebilirsiniz.' }));
    var kartlar = [];
    a.secenekler.forEach(function (s) {
      var sayi = el('span', { sinif: 'oy-sayi' });
      var kart = el('div', { sinif: 'oy-kart' }, [
        el('button', { sinif: 'oy-dugme', type: 'button', 'aria-label': 'Bir oy azalt', metin: '−', onclick: function () { degis(s.id, -1); } }),
        sayi,
        el('button', { sinif: 'oy-dugme arti', type: 'button', 'aria-label': 'Bir oy ekle', metin: '+', onclick: function () { degis(s.id, 1); } }),
        el('div', { sinif: 'oy-metin', html: s.metin })
      ]);
      kartlar.push({ s: s, kart: kart, sayi: sayi });
      kok.appendChild(kart);
    });
    function degis(id, d) {
      oylar[id] = Math.max(0, (oylar[id] || 0) + d);
      GG.durum.tahmin[k] = oylar; GG.kaydet(); boya();
    }
    function boya() {
      var enCok = 0;
      kartlar.forEach(function (x) { enCok = Math.max(enCok, oylar[x.s.id] || 0); });
      kartlar.forEach(function (x) {
        var n = oylar[x.s.id] || 0;
        x.sayi.textContent = String(n);
        x.kart.classList.toggle('cogunluk', enCok > 0 && n === enCok);
      });
    }
    boya();
    kok.appendChild(el('p', { sinif: 'ipucu-metin', html: 'Tahminler kaydedildi. Doğru cevap deneyden sonra açıklanacak: <b>İleri ▶</b>' }));
    b.hazir(true);
    return kok;
  };

  function karsilastirma(t) {
    var a = t.adim, oylar = t.oylar, toplam = toplamOy(oylar);
    var dogru = null;
    a.secenekler.forEach(function (s) { if (s.id === a.dogru) dogru = s; });
    var kutu = el('div', { sinif: 'karsilastir' });
    kutu.appendChild(el('b', { metin: 'Sınıfın tahmini ve sonuç' }));
    if (!toplam) {
      kutu.appendChild(el('p', { html: 'Oylama yapılmadı. Sonuç: <b>' + (dogru ? dogru.metin : '') + '</b>' }));
      return kutu;
    }
    a.secenekler.forEach(function (s) {
      var n = oylar[s.id] || 0, yuzde = Math.round(100 * n / toplam);
      kutu.appendChild(el('div', { html: (s.id === a.dogru ? '✔ ' : '') + s.metin + ': <b>' + n + ' oy (%' + yuzde + ')</b>' }));
      kutu.appendChild(el('div', { sinif: 'cubuk' + (s.id === a.dogru ? ' dogru' : '') }, el('span', { stil: 'width:' + yuzde + '%' })));
    });
    var oran = (oylar[a.dogru] || 0) / toplam;
    kutu.appendChild(el('p', {
      html: oran >= 0.5 ? 'Sınıfın çoğunluğunun tahmini doğru çıktı.'
        : 'Sınıfın çoğunluğunun tahmini tutmadı. Bilim insanları da sık sık yanılır. Yeni bir model çoğu zaman tam da böyle bir şaşkınlıkla başlar.'
    }));
    return kutu;
  }

  // ---------- Deney: sahnedeki benzetimden gözlem toplanır ----------
  T.deney = function (a, b) {
    var kok = el('div');
    if (a.gorev) kok.appendChild(el('p', { html: a.gorev }));
    var ul = el('ul', { sinif: 'gorev-listesi' });
    var satirlar = (a.gozlemler || []).map(function (g) {
      var li = el('li', { html: g.metin });
      ul.appendChild(li);
      return { g: g, li: li };
    });
    kok.appendChild(ul);
    var gerekli = a.gerekli || satirlar.length;
    var sonuc = el('div');
    kok.appendChild(sonuc);
    var gosterildi = false;
    function kontrol() {
      var n = 0;
      satirlar.forEach(function (x) {
        var t = b.gozlemVar(x.g.id);
        x.li.classList.toggle('tamam', t);
        if (t) n++;
      });
      if (n >= gerekli && !gosterildi) {
        gosterildi = true;
        if (a.sonuc) sonuc.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.sonuc }));
        if (a.tahminKarsilastir) { var t = b.tahminBul(); if (t) sonuc.appendChild(karsilastirma(t)); }
        b.hazir(true);
      }
    }
    b.gozlemDinle(kontrol);
    kontrol();
    return kok;
  };

  // ---------- Tek doğru cevaplı çıkarım ----------
  T.cikarim = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    var geri = el('div');
    var ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: s.metin });
      d.addEventListener('click', function () { sec(s, d); });
      dugmeler.push({ s: s, d: d });
      kok.appendChild(d);
    });
    kok.appendChild(geri);
    function sec(s, d) {
      if (bitti) return;
      GG.bosalt(geri);
      if (s.dogru) {
        bitti = true;
        d.classList.remove('yanlis');
        d.classList.add('dogru');
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (x.d !== d) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: [s.geri, a.aciklama].filter(Boolean).join(' ') || 'Doğru.' }));
        b.hazir(true);
      } else {
        ilk = false;
        d.classList.add('yanlis');
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.geri || 'Bir daha düşün: Deneyde ne gözlemledin?' }));
      }
    }
    if (b.cozuldu) dugmeler.forEach(function (x) { if (x.s.dogru) sec(x.s, x.d); });
    return kok;
  };

  // ---------- Çok seçimli çıkarım ----------
  T.coklu = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Birden fazla seçenek doğru olabilir. Seçip “Kontrol et”e dokunun.' }));
    var secili = {}, ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s, i) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: '☐ ' + s.metin });
      d.addEventListener('click', function () {
        if (bitti) return;
        secili[i] = !secili[i];
        d.innerHTML = (secili[i] ? '☑ ' : '☐ ') + s.metin;
        dugmeler.forEach(function (x) { x.d.classList.remove('dogru', 'yanlis'); });
        d.classList.toggle('secili', !!secili[i]);
      });
      dugmeler.push({ s: s, d: d, i: i });
      kok.appendChild(d);
    });
    var geri = el('div');
    var kontrolD = GG.ui.dugme('Kontrol et', kontrol, 'ana');
    kok.appendChild(el('div', { stil: 'margin:.5rem 0' }, kontrolD));
    kok.appendChild(geri);
    function kontrol() {
      if (bitti) return;
      GG.bosalt(geri);
      var tam = true, notlar = [];
      dugmeler.forEach(function (x) {
        var sec = !!secili[x.i];
        x.d.classList.remove('secili');
        if (sec && x.s.dogru) x.d.classList.add('dogru');
        else if (sec && !x.s.dogru) { x.d.classList.add('yanlis'); tam = false; if (x.s.geri) notlar.push(x.s.geri); }
        else if (!sec && x.s.dogru) { tam = false; }
      });
      if (tam) {
        bitti = true;
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (!x.s.dogru) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Doğru.' }));
        kontrolD.disabled = true;
        b.hazir(true);
      } else {
        ilk = false;
        var eksik = dugmeler.some(function (x) { return !secili[x.i] && x.s.dogru; });
        geri.appendChild(el('div', {
          sinif: 'geri-bildirim dusun',
          html: (notlar.length ? notlar.join('<br>') : '') + (eksik ? (notlar.length ? '<br>' : '') + 'Kanıtın desteklediği bir seçeneği daha atladınız.' : '')
        }));
      }
    }
    if (b.cozuldu) {
      dugmeler.forEach(function (x) { secili[x.i] = !!x.s.dogru; x.d.innerHTML = (x.s.dogru ? '☑ ' : '☐ ') + x.s.metin; });
      kontrol();
    }
    return kok;
  };

  // ---------- Sınıflandırma: kartı seç, kutuya bırak ----------
  T.siniflandir = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Önce bir karta, sonra ait olduğu kutuya dokunun.' }));
    var kartAlan = el('div', { sinif: 'siniflandir-kartlar' });
    var kutuAlan = el('div', { sinif: 's-kutular' });
    var geri = el('div');
    var secili = null, kalan = a.kartlar.length, ilk = true;
    var kutular = {};
    a.kutular.forEach(function (k) {
      var d = el('button', { sinif: 's-kutu', type: 'button' }, [el('span', { sinif: 's-kutu-ad', html: k.ad })]);
      d.addEventListener('click', function () { birak(k.id); });
      kutular[k.id] = d;
      kutuAlan.appendChild(d);
    });
    var kartDugmeleri = [];
    GG.karistir(a.kartlar).forEach(function (kt) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: kt.metin });
      d.addEventListener('click', function () { sec(kt, d); });
      kartDugmeleri.push({ kt: kt, d: d });
      kartAlan.appendChild(d);
    });
    kok.appendChild(kartAlan);
    kok.appendChild(kutuAlan);
    kok.appendChild(geri);
    function sec(kt, d) {
      secili = { kt: kt, d: d };
      kartDugmeleri.forEach(function (x) { x.d.classList.toggle('secili', x.d === d); });
      Object.keys(kutular).forEach(function (k) { kutular[k].classList.add('hedef'); });
    }
    function yerlestir(kt, d, sessiz) {
      kutular[kt.kutu].appendChild(el('div', { sinif: 's-yerlesti', html: kt.metin }));
      if (d.parentNode) d.parentNode.removeChild(d);
      kalan--;
      if (!sessiz && kt.dogruGeri) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: kt.dogruGeri })); }
    }
    function birak(kutuId) {
      if (!secili) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Önce bir kart seçin.' })); return; }
      var s = secili;
      if (s.kt.kutu === kutuId) {
        GG.bosalt(geri);
        yerlestir(s.kt, s.d);
        secili = null;
        Object.keys(kutular).forEach(function (k) { kutular[k].classList.remove('hedef'); });
        if (kalan === 0) bitir();
      } else {
        ilk = false;
        salla(s.d);
        GG.bosalt(geri);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.kt.geri || 'Bu kart bu kutuya uymuyor. Kanıta tekrar bakın.' }));
      }
    }
    function bitir() {
      b.ilkDeneme(ilk);
      GG.bosalt(geri);
      geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Hepsi doğru yerde.' }));
      b.hazir(true);
    }
    if (b.cozuldu) { kartDugmeleri.forEach(function (x) { yerlestir(x.kt, x.d, true); }); bitir(); }
    return kok;
  };

  // ---------- Sıralama: doğru sırayla dokun ----------
  T.sirala = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: a.yonerge || 'Öğeleri doğru sırayla tek tek dokunarak dizin.' }));
    var hedef = el('div', { sinif: 'sira-hedef' });
    var havuz = el('div', { sinif: 'siniflandir-kartlar' });
    var geri = el('div');
    var sira = 0, ilk = true;
    var dugmeler = [];
    a.ogeler.forEach(function (o, i) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: o.metin });
      d.addEventListener('click', function () { dokun(o, i, d); });
      dugmeler.push({ o: o, i: i, d: d });
    });
    GG.karistir(dugmeler).forEach(function (x) { havuz.appendChild(x.d); });
    kok.appendChild(hedef);
    kok.appendChild(havuz);
    kok.appendChild(geri);
    function koy(o, d) {
      hedef.appendChild(el('div', { sinif: 'sira-oge', html: '<b>' + (sira + 1) + '.</b>' + o.metin + (o.ek ? ' <span class="ipucu-metin">' + o.ek + '</span>' : '') }));
      if (d.parentNode) d.parentNode.removeChild(d);
      sira++;
    }
    function dokun(o, i, d) {
      GG.bosalt(geri);
      if (i === sira) {
        koy(o, d);
        if (sira === a.ogeler.length) {
          b.ilkDeneme(ilk);
          geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' }));
          b.hazir(true);
        }
      } else {
        ilk = false;
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: o.geri || a.ipucu || 'Bu henüz sırası gelen öğe değil.' }));
      }
    }
    if (b.cozuldu) { dugmeler.forEach(function (x) { koy(x.o, x.d); }); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' })); b.hazir(true); }
    return kok;
  };

  // ---------- Model kartı ----------
  T.model = function (a) {
    var kok = el('div');
    if (a.maddeler) {
      kok.appendChild(el('p', { html: '<b>' + (a.maddeBaslik || 'Modelin varsayımları') + '</b>' }));
      var ul = el('ul');
      a.maddeler.forEach(function (m) { ul.appendChild(el('li', { html: m })); });
      kok.appendChild(ul);
    }
    return kok;
  };

  // ---------- Ama…: modelin açıklayamadığı gözlem ----------
  T.ama = function (a) {
    var kok = el('div');
    if (a.sonraki) {
      var d = GG.durakBul(a.sonraki);
      if (d) kok.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Sıradaki durak:</b> ' + d.kisi + ' (' + d.yil + ') · ' + d.soru }));
    }
    return kok;
  };
})();

</script>
<script>/* js/cizimler.js */
/* Kimya Hayattır — GHS piktogramları ve Bulgu Duvarı çizimleri */
'use strict';
(function () {
  var C = GG.ciz;
  // Tuvale sığmayan yazının boyunu küçültür (kartlar küçük olabilir).
  function yazi(ctx, s, x, y, b, renk, hiza, kalin) {
    hiza = hiza || 'center';
    var W = ctx.canvas.width / (ctx.getTransform().a || 1);
    var bos = hiza === 'center' ? 2 * Math.min(x, W - x) : (hiza === 'left' ? W - x : x);
    ctx.font = GG.font(b, kalin);
    var gen = ctx.measureText(s).width;
    if (gen > bos * 0.96) b = Math.max(8, b * bos * 0.96 / gen);
    C.yazi(ctx, s, x, y, { boyut: b, renk: renk || '#e2e8f0', hiza: hiza, kalin: kalin });
  }
  function fsz(w, h) { return Math.max(11, Math.min(24, Math.min(w / 30, h / 18))); }

  // ---------------- GHS piktogramları ----------------
  GG.PIKTOGRAM = {
    GHS01: 'Patlayıcı', GHS02: 'Alevlenir', GHS03: 'Oksitleyici', GHS04: 'Basınçlı gaz', GHS05: 'Aşındırıcı',
    GHS06: 'Akut toksisite (zehirli)', GHS07: 'Zararlı / tahriş edici', GHS08: 'Ciddi sağlık tehlikesi', GHS09: 'Çevre için tehlikeli'
  };
  function alevYolu(ctx, x, y, h) { // y: taban
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.bezierCurveTo(x + h * 0.15, y - h * 0.7, x + h * 0.5, y - h * 0.55, x + h * 0.38, y - h * 0.15);
    ctx.quadraticCurveTo(x + h * 0.3, y, x, y);
    ctx.quadraticCurveTo(x - h * 0.35, y, x - h * 0.38, y - h * 0.22);
    ctx.bezierCurveTo(x - h * 0.42, y - h * 0.45, x - h * 0.2, y - h * 0.5, x - h * 0.12, y - h * 0.72);
    ctx.quadraticCurveTo(x - h * 0.02, y - h * 0.55, x + h * 0.02, y - h * 0.5);
    ctx.quadraticCurveTo(x + h * 0.05, y - h * 0.8, x, y - h);
    ctx.closePath();
  }
  GG.piktogram = function (ctx, kod, cx, cy, s) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy); ctx.closePath();
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.lineWidth = s * 0.11; ctx.strokeStyle = '#e11d48'; ctx.lineJoin = 'round'; ctx.stroke();
    var u = s * 0.55;
    ctx.fillStyle = '#111827'; ctx.strokeStyle = '#111827'; ctx.lineCap = 'round';
    if (kod === 'GHS01') {
      C.daire(ctx, cx - u * 0.15, cy + u * 0.2, u * 0.36, '#111827');
      ctx.lineWidth = u * 0.08;
      for (var i = 0; i < 9; i++) {
        var a = -Math.PI * 0.95 + i * Math.PI * 0.12;
        ctx.beginPath(); ctx.moveTo(cx + u * 0.2 + Math.cos(a) * u * 0.25, cy - u * 0.15 + Math.sin(a) * u * 0.25);
        ctx.lineTo(cx + u * 0.2 + Math.cos(a) * u * 0.6, cy - u * 0.15 + Math.sin(a) * u * 0.6); ctx.stroke();
      }
    } else if (kod === 'GHS02') {
      alevYolu(ctx, cx, cy + u * 0.45, u * 1.15); ctx.fill();
      ctx.lineWidth = u * 0.1; ctx.beginPath(); ctx.moveTo(cx - u * 0.6, cy + u * 0.62); ctx.lineTo(cx + u * 0.6, cy + u * 0.62); ctx.stroke();
    } else if (kod === 'GHS03') {
      ctx.lineWidth = u * 0.16; ctx.beginPath(); ctx.arc(cx, cy + u * 0.35, u * 0.3, 0, Math.PI * 2); ctx.stroke();
      alevYolu(ctx, cx, cy + u * 0.02, u * 0.8); ctx.fill();
      ctx.lineWidth = u * 0.08; ctx.beginPath(); ctx.moveTo(cx - u * 0.6, cy + u * 0.78); ctx.lineTo(cx + u * 0.6, cy + u * 0.78); ctx.stroke();
    } else if (kod === 'GHS04') {
      C.yd(ctx, cx - u * 0.72, cy - u * 0.2, u * 1.2, u * 0.42, u * 0.2); ctx.fill();
      ctx.fillRect(cx + u * 0.45, cy - u * 0.09, u * 0.25, u * 0.2);
      ctx.lineWidth = u * 0.08; ctx.beginPath(); ctx.moveTo(cx - u * 0.6, cy + u * 0.4); ctx.lineTo(cx + u * 0.6, cy + u * 0.4); ctx.stroke();
    } else if (kod === 'GHS05') {
      [[-0.32, -1], [0.32, 1]].forEach(function (q) {
        ctx.save(); ctx.translate(cx + q[0] * u, cy - u * 0.42); ctx.rotate(q[1] * 0.6);
        C.yd(ctx, -u * 0.1, -u * 0.32, u * 0.2, u * 0.5, u * 0.08); ctx.lineWidth = u * 0.06; ctx.stroke(); ctx.restore();
        C.daire(ctx, cx + q[0] * u * 0.95, cy - u * 0.02, u * 0.06, '#111827');
        C.daire(ctx, cx + q[0] * u * 0.9, cy + u * 0.15, u * 0.05, '#111827');
      });
      ctx.beginPath(); ctx.moveTo(cx - u * 0.72, cy + u * 0.68); ctx.lineTo(cx - u * 0.72, cy + u * 0.32); ctx.lineTo(cx - u * 0.55, cy + u * 0.4); ctx.lineTo(cx - u * 0.42, cy + u * 0.3); ctx.lineTo(cx - u * 0.12, cy + u * 0.32); ctx.lineTo(cx - u * 0.12, cy + u * 0.68); ctx.closePath(); ctx.fill();
      C.yd(ctx, cx + u * 0.08, cy + u * 0.34, u * 0.62, u * 0.32, u * 0.12); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = u * 0.04;
      for (var k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(cx + u * (0.1 + 0.14 * k), cy + u * 0.36); ctx.lineTo(cx + u * (0.1 + 0.14 * k), cy + u * 0.5); ctx.stroke(); }
    } else if (kod === 'GHS06') {
      ctx.lineWidth = u * 0.16;
      ctx.beginPath(); ctx.moveTo(cx - u * 0.55, cy + u * 0.15); ctx.lineTo(cx + u * 0.55, cy + u * 0.68); ctx.moveTo(cx + u * 0.55, cy + u * 0.15); ctx.lineTo(cx - u * 0.55, cy + u * 0.68); ctx.stroke();
      C.daire(ctx, cx, cy - u * 0.2, u * 0.4, '#111827');
      ctx.fillRect(cx - u * 0.22, cy, u * 0.44, u * 0.3);
      C.daire(ctx, cx - u * 0.15, cy - u * 0.22, u * 0.11, '#fff'); C.daire(ctx, cx + u * 0.15, cy - u * 0.22, u * 0.11, '#fff');
    } else if (kod === 'GHS07') {
      C.yd(ctx, cx - u * 0.12, cy - u * 0.75, u * 0.24, u * 1.0, u * 0.12); ctx.fill();
      C.daire(ctx, cx, cy + u * 0.55, u * 0.14, '#111827');
    } else if (kod === 'GHS08') {
      C.daire(ctx, cx, cy - u * 0.5, u * 0.22, '#111827');
      ctx.beginPath(); ctx.moveTo(cx - u * 0.5, cy + u * 0.75); ctx.quadraticCurveTo(cx - u * 0.5, cy - u * 0.25, cx, cy - u * 0.25); ctx.quadraticCurveTo(cx + u * 0.5, cy - u * 0.25, cx + u * 0.5, cy + u * 0.75); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath();
      for (var j = 0; j < 16; j++) { var r = j % 2 ? u * 0.1 : u * 0.24, aa = j / 16 * Math.PI * 2; ctx.lineTo(cx + Math.cos(aa) * r, cy + u * 0.25 + Math.sin(aa) * r); }
      ctx.closePath(); ctx.fill();
    } else if (kod === 'GHS09') {
      ctx.lineWidth = u * 0.08;
      ctx.beginPath(); ctx.moveTo(cx - u * 0.75, cy + u * 0.2); ctx.lineTo(cx + u * 0.75, cy + u * 0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - u * 0.35, cy + u * 0.2); ctx.lineTo(cx - u * 0.35, cy - u * 0.65);
      ctx.moveTo(cx - u * 0.35, cy - u * 0.3); ctx.lineTo(cx - u * 0.6, cy - u * 0.55);
      ctx.moveTo(cx - u * 0.35, cy - u * 0.45); ctx.lineTo(cx - u * 0.12, cy - u * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx + u * 0.15, cy + u * 0.45, u * 0.32, u * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + u * 0.45, cy + u * 0.45); ctx.lineTo(cx + u * 0.65, cy + u * 0.3); ctx.lineTo(cx + u * 0.65, cy + u * 0.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = u * 0.04;
      ctx.beginPath(); ctx.moveTo(cx - u * 0.07, cy + u * 0.38); ctx.lineTo(cx + u * 0.03, cy + u * 0.48); ctx.moveTo(cx + u * 0.03, cy + u * 0.38); ctx.lineTo(cx - u * 0.07, cy + u * 0.48); ctx.stroke();
    }
    ctx.restore();
  };

  // ---------------- Bulgu Duvarı çizimleri ----------------
  function ikonlar(ctx, liste, w, y, f) {
    liste.forEach(function (q, i) {
      var x = w * (i + 0.5) / liste.length;
      yazi(ctx, q[0], x, y, f * 2.2);
      // etiketi sütun genişliğine göre satırlara böl

      ctx.font = GG.font(boy);
      q[1].split(' ').forEach(function (k) { var d = sat ? sat + ' ' + k : k; if (ctx.measureText(d).width > gen && sat) { satirlar.push(sat); sat = k; } else sat = d; });
      if (sat) satirlar.push(sat);
      satirlar.forEach(function (m, j) { yazi(ctx, m, x, y + f * 2 + j * boy * 1.2, boy, '#cbd5e1'); });
    });
  }
  GG.modelKaydet('b-kimya', {

      [['kireç çözücü', 1], ['sirke', 2.5], ['su', 7], ['sabun', 10], ['çamaşır suyu', 12.5]].forEach(function (q, i) {

  GG.modelKaydet('b-mutfak', {

      yazi(ctx, 'Gıda kimyası israfı ve gıda zehirlenmelerini azaltır.', w / 2, h - f * 1.1, f * 0.8, '#cbd5e1');

  GG.modelKaydet('b-banyo', {
    ad: 'Koruyan kimya',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h);

      yazi(ctx, 'Hiçbir ürün %100 koruma sağlamaz; kanıta dayalı kullanım önemlidir.', w / 2, h - f * 1.1, f * 0.8, '#cbd5e1');

  });

      var f = fsz(w, h), cx = w / 2, cy = h * 0.47, R = Math.min(w, h) * 0.33;

      d.forEach(function (ad, i) {
        var a = -Math.PI / 2 + i / d.length * Math.PI * 2, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R * 0.85;
        ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R * 0.32, cy + Math.sin(a) * R * 0.32 * 0.85); ctx.lineTo(x, y); ctx.stroke();
        C.yd(ctx, x - f * 3.4, y - f * 0.75, f * 6.8, f * 1.5, 8); ctx.fillStyle = '#312e81'; ctx.fill();
        yazi(ctx, ad, x, y, f * 0.8, '#ede9fe', 'center', true);
      });

  });
  GG.modelKaydet('b-alimler', {
    ad: 'Kimyaya katkı verenler',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h), y = h * 0.5, x0 = w * 0.08, x1 = w * 0.92;
      ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      [['Câbir', '8. yy'], ['Râzî', '9.–10. yy'], ['İbn Sînâ', '10.–11. yy'], ['Bîrûnî', '10.–11. yy'], ['Sinanoğlu', '20. yy'], ['Sancar', '2015 Nobel']].forEach(function (q, i, a) {

        yazi(ctx, q[1], x, y + f * (i % 2 ? 2.4 : 1.4), f * 0.72, '#cbd5e1');
      });
    }
  });
  GG.modelKaydet('b-guvenilir', {
    ad: 'Bilgiyi sorgula',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h);
      ['✔ Kaynağı kim? Uzman mı, satıcı mı?', '✔ Deneye ya da veriye dayanıyor mu?', '✔ Başka güvenilir kaynaklar da aynısını söylüyor mu?', '✖ “Çok paylaşıldı” bir kanıt değildir.'].forEach(function (s, i) {

          if (!kayit[u.id + '|' + q.id]) return;
          var x = tx + tw * kol.slice(0, c + 1).reduce(function (a, cc) { return a + cc; }, 0);
          if (q.id === 'ph') { C.daire(ctx, x + fs * 0.5, yy, fs * 0.45, GG.phRengi(u.ph)); C.yazi(ctx, GG.sayi(u.ph, u.ph % 1 ? 1 : 0), x + fs * 1.2, yy, { boyut: fs * 0.72, kalin: true }); }
          else if (q.id === 'sert') C.yazi(ctx, { yok: '—', az: 'az köpük', tortu: 'az + tortu', bol: 'bol köpük' }[u.sert[0]], x, yy, { boyut: fs * 0.66 });
          else if (q.id === 'yag') C.yazi(ctx, u.yag[0] > 0.85 ? 'çıktı' : (u.yag[0] > 0.3 ? 'kısmen' : 'çıkmadı'), x, yy, { boyut: fs * 0.66 });
          else C.yazi(ctx, u.kirec[0] > 0.8 ? 'çok gaz' : (u.kirec[0] > 0 ? 'az gaz' : '—'), x, yy, { boyut: fs * 0.66 });
        });
      });
      C.yazi(ctx, '⚠ Bu deneyler yalnızca ekranda. Ürünleri gerçekte birbirine karıştırma!', tx, h * 0.96, { boyut: fs * 0.66, renk: '#fca5a5' });
      bilgi.innerHTML = 'Gözlem ortamı: <b>' + urun.ad + '</b> + <b>' + test.ad + '</b> · Kayıtlı sonuç: <b>' + Object.keys(kayit).length + '</b>';
    });
    return {};
  });

  // =====================================================================
  // MUTFAK: kabartma, elma, ekmek, tava
  // =====================================================================
  GG.simKaydet('mutfak', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var mod = 'gaz', gazF = -1, dakika = 0, gun = 0;
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    function kontrolKur() {
      GG.bosalt(y.kontrol);
      y.kontrol.appendChild(api.ui.secici({ etiket: 'Deney', deger: mod, secenekler: [{ id: 'gaz', ad: 'Kabartma' }, { id: 'elma', ad: 'Elma' }, { id: 'ekmek', ad: 'Ekmek' }, { id: 'tava', ad: 'Tava' }], degisti: function (v) { mod = v; kontrolKur(); if (v === 'tava') api.gozlem('tava'); } }).kok);
      if (mod === 'gaz') y.kontrol.appendChild(api.ui.dugme('Karıştır', function () { gazF = 0; }, 'ana'));
      if (mod === 'elma') y.kontrol.appendChild(api.ui.kaydirici({ etiket: 'Geçen süre', min: 0, max: 60, adim: 5, deger: dakika, bicim: function (v) { return v + ' dakika'; }, degisti: function (v) { dakika = v; if (v >= 30) api.gozlem('elma'); } }).kok);
      if (mod === 'ekmek') y.kontrol.appendChild(api.ui.kaydirici({ etiket: 'Geçen gün', min: 0, max: 12, adim: 1, deger: gun, bicim: function (v) { return v + ' gün'; }, degisti: function (v) { gun = v; if (v >= 7) api.gozlem('ekmek'); } }).kok);
    }
    kontrolKur();
    api.dongu(function (dt, zaman) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), s = zaman / 1000;
      arkaPlan(t, '#1b1f2e', '#0f1320');
      if (mod === 'gaz') {
        if (gazF >= 0) { gazF = Math.min(1, gazF + dt / 3); if (gazF >= 1) api.gozlem('gaz'); }
        var kaplar = [['Karbonat + su', 0.05], ['Kabartma tozu + su', 0.55], ['Karbonat + sirke', 1]];
        kaplar.forEach(function (k, i) {
          var cx = w * (0.2 + i * 0.3), by = h * 0.82, bw = w * 0.13, bh = h * 0.3, f = Math.max(0, gazF);
          ctx.strokeStyle = 'rgba(220,235,255,0.85)'; ctx.lineWidth = 3; ctx.strokeRect(cx - bw / 2, by - bh, bw, bh);
          ctx.fillStyle = 'rgba(203,213,225,0.35)'; ctx.fillRect(cx - bw / 2 + 2, by - bh * 0.5, bw - 4, bh * 0.5 - 2);
          var n = Math.round(k[1] * 25 * (gazF >= 0 && gazF < 1 ? 1 : 0.3));
          for (var b = 0; b < n; b++) { var fy = ((s * (0.8 + b % 4 * 0.2) + b * 0.17) % 1); C.daire(ctx, cx - bw / 2 + 6 + (b * 23 % (bw - 12)), by - 6 - fy * bh * 0.45, 3, 'rgba(255,255,255,0.8)'); }
          var r = (bw * 0.18) + k[1] * f * bw * 0.45;
          ctx.fillStyle = ['#f472b6', '#60a5fa', '#facc15'][i];
          ctx.beginPath(); ctx.ellipse(cx, by - bh - r * 1.1, r * 0.85, r * 1.1, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillRect(cx - bw * 0.12, by - bh - 6, bw * 0.24, 8);
          C.yazi(ctx, k[0], cx, by + fs * 1.1, { boyut: fs * 0.85, kalin: true, hiza: 'center' });
        });
        C.yazi(ctx, 'Balonlar kaptan çıkan gazla şişer.', w / 2, h * 0.08, { boyut: fs, kalin: true, hiza: 'center' });
        bilgi.innerHTML = 'Kabartma deneyi: Hangi karışım en çok gaz (CO₂) çıkarıyor?';
      } else if (mod === 'elma') {
        [['Limon suyu sürülmedi', 1], ['Limon suyu sürüldü', 0.25]].forEach(function (k, i) {
          var cx = w * (0.3 + i * 0.4), cy = h * 0.48, r = Math.min(w * 0.15, h * 0.28);
          var kahve = Math.min(1, dakika / 60 * k[1] * 1.2);
          ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
          var rr = [255, 247, 214], br = [150, 95, 40], c = rr.map(function (v, j) { return Math.round(v + (br[j] - v) * kahve); });
          ctx.fillStyle = 'rgb(' + c.join(',') + ')'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3f2a14'; [-1, 1].forEach(function (q) { ctx.beginPath(); ctx.ellipse(cx + q * r * 0.12, cy, r * 0.05, r * 0.1, 0, 0, Math.PI * 2); ctx.fill(); });
          C.yazi(ctx, k[0], cx, cy + r + fs * 1.2, { boyut: fs * 0.9, kalin: true, hiza: 'center' });
        });
        bilgi.innerHTML = 'Kesilmiş elma havada bekliyor: <b>' + dakika + ' dakika</b> geçti.';
      } else if (mod === 'ekmek') {
        [['Ev ekmeği (koruyucusuz)', 3], ['Paket ekmek (koruyuculu)', 7.5]].forEach(function (k, i) {
          var cx = w * (0.3 + i * 0.4), cy = h * 0.46, bw = Math.min(w * 0.28, h * 0.5), bh = bw * 0.85;
          ctx.fillStyle = '#b45309'; C.yd(ctx, cx - bw / 2, cy - bh / 2, bw, bh, bw * 0.22); ctx.fill();
          ctx.fillStyle = '#fde68a'; C.yd(ctx, cx - bw / 2 + 10, cy - bh / 2 + 10, bw - 20, bh - 20, bw * 0.18); ctx.fill();
          var kuf = Math.max(0, gun - k[1]);
          for (var m = 0; m < Math.min(40, kuf * 8); m++) { var a = m * 2.39, rr = Math.sqrt(m) * bw * 0.06; C.daire(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.8, 4 + (m % 4), m % 3 ? 'rgba(34,197,94,0.75)' : 'rgba(30,41,59,0.8)'); }
          C.yazi(ctx, k[0], cx, cy + bh / 2 + fs * 1.1, { boyut: fs * 0.85, kalin: true, hiza: 'center' });
          C.yazi(ctx, kuf > 0 ? 'küf görüldü' : 'küf yok', cx, cy + bh / 2 + fs * 2.4, { boyut: fs * 0.8, hiza: 'center', renk: kuf > 0 ? '#86efac' : '#94a3b8' });
        });
        bilgi.innerHTML = 'Oda sıcaklığında bekleyen ekmekler: <b>' + gun + '. gün</b> (temsilî süreler)';
      } else {
        [['Çelik tava', 0.55, '#9ca3af'], ['Yapışmaz (PTFE) tava', 1.25, '#1f2937']].forEach(function (k, i) {
          var cx = w * (0.28 + i * 0.44), cy = h * 0.55, pw = Math.min(w * 0.34, h * 0.6);
          ctx.fillStyle = k[2]; ctx.beginPath(); ctx.ellipse(cx, cy, pw / 2, pw * 0.22, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3; ctx.stroke();
          for (var d = 0; d < 3; d++) {
            var dx = cx + (d - 1) * pw * 0.25, dr = pw * 0.07, yuk = dr * k[1];
            ctx.fillStyle = 'rgba(147,197,253,0.85)'; ctx.beginPath(); ctx.ellipse(dx, cy - yuk * 0.4, dr * (k[1] > 1 ? 0.85 : 1.35), yuk * 0.6, 0, 0, Math.PI * 2); ctx.fill();
          }
          C.yazi(ctx, k[0], cx, cy + pw * 0.3 + fs, { boyut: fs * 0.9, kalin: true, hiza: 'center' });
          C.yazi(ctx, i ? 'Su damlaları boncuklanıyor: yüzey suyu ve yağı itiyor.' : 'Su damlaları yayılıyor.', cx, cy + pw * 0.3 + fs * 2.3, { boyut: fs * 0.75, hiza: 'center', renk: '#cbd5e1' });
        });
        bilgi.innerHTML = 'Tava yüzeyine su damlatıldı.';
      }
    });
    return {};
  });

  // =====================================================================
  // BANYO: florür (yumurta kabuğu modeli), güneş kremi (UV)
  // =====================================================================
  GG.simKaydet('banyo', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var mod = 'yumurta', saat = 0, uv = false;
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    function kontrolKur() {
      GG.bosalt(y.kontrol);
      y.kontrol.appendChild(api.ui.secici({ etiket: 'Deney', deger: mod, secenekler: [{ id: 'yumurta', ad: 'Yumurta kabuğu ve florür' }, { id: 'uv', ad: 'Güneş kremi ve UV' }], degisti: function (v) { mod = v; kontrolKur(); } }).kok);
      if (mod === 'yumurta') y.kontrol.appendChild(api.ui.kaydirici({ etiket: 'Sirkede geçen süre', min: 0, max: 24, adim: 2, deger: saat, bicim: function (v) { return v + ' saat'; }, degisti: function (v) { saat = v; if (v >= 12) api.gozlem('yumurta'); } }).kok);
      else y.kontrol.appendChild(api.ui.anahtar({ etiket: 'UV lambasını aç', deger: uv, degisti: function (v) { uv = v; if (v) api.gozlem('uv'); } }).kok);
    }
    kontrolKur();
    var SPF = [['Kremsiz', 1], ['SPF 15', 1 / 15], ['SPF 30', 1 / 30], ['SPF 50', 1 / 50]];
    api.dongu(function (dt, zaman) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), s = zaman / 1000;
      arkaPlan(t, '#13202e', '#0a111c');
      if (mod === 'yumurta') {
        var kayip = [0.55, 0.2]; // 24 saatte kütle kaybı oranı (temsilî)
        [['Florürlü macun sürülmedi', kayip[0]], ['Florürlü macun sürüldü', kayip[1]]].forEach(function (k, i) {
          var cx = w * (0.25 + i * 0.3), by = h * 0.78, bw = w * 0.18, bh = h * 0.45, oran = k[1] * saat / 24;
          ctx.strokeStyle = 'rgba(220,235,255,0.85)'; ctx.lineWidth = 3; ctx.strokeRect(cx - bw / 2, by - bh, bw, bh);
          ctx.fillStyle = 'rgba(253,224,71,0.15)'; ctx.fillRect(cx - bw / 2 + 2, by - bh * 0.8, bw - 4, bh * 0.8 - 2);
          var r = bw * 0.28;
          ctx.fillStyle = 'rgba(254,243,199,' + (1 - oran * 0.6).toFixed(2) + ')'; ctx.beginPath(); ctx.ellipse(cx, by - bh * 0.4, r * 0.75, r, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fde68a'; ctx.lineWidth = Math.max(1, 6 * (1 - oran)); ctx.stroke();
          var n = saat > 0 ? Math.round(k[1] * 26) : 0;
          for (var b = 0; b < n; b++) { var fy = ((s * 0.7 + b * 0.19) % 1); C.daire(ctx, cx - r * 0.6 + (b * 13 % (r * 1.2)), by - bh * 0.4 - r - fy * bh * 0.3, 3, 'rgba(255,255,255,0.75)'); }
          C.yazi(ctx, k[0], cx, by + fs * 1.1, { boyut: fs * 0.8, kalin: true, hiza: 'center' });
          C.yazi(ctx, 'Kütle kaybı: %' + Math.round(oran * 100), cx, by + fs * 2.4, { boyut: fs * 0.85, hiza: 'center', renk: '#fde68a' });
        });
        C.yazi(ctx, 'Yumurta kabuğu (kalsiyumlu) diş minesinin bir modelidir.', w * 0.86, h * 0.3, { boyut: fs * 0.75, hiza: 'right', renk: '#cbd5e1' });
        C.yazi(ctx, 'Sirke = ağızdaki asitler', w * 0.86, h * 0.3 + fs * 1.3, { boyut: fs * 0.75, hiza: 'right', renk: '#cbd5e1' });
        bilgi.innerHTML = 'Yumurta kabukları sirkede: <b>' + saat + ' saat</b> (temsilî değerler)';
      } else {
        var lx = w * 0.5, ly = h * 0.12;
        ctx.fillStyle = '#334155'; C.yd(ctx, lx - w * 0.35, ly - 14, w * 0.7, 28, 10); ctx.fill();
        C.yazi(ctx, uv ? 'UV lambası açık' : 'UV lambası kapalı', lx, ly, { boyut: fs * 0.8, kalin: true, hiza: 'center', renk: uv ? '#c4b5fd' : '#94a3b8' });
        SPF.forEach(function (k, i) {
          var cx = w * (0.17 + i * 0.22), cy = h * 0.55;
          if (uv) { var g = ctx.createLinearGradient(cx, ly, cx, cy); g.addColorStop(0, 'rgba(167,139,250,0.35)'); g.addColorStop(1, 'rgba(167,139,250,0)'); ctx.fillStyle = g; ctx.fillRect(cx - w * 0.08, ly + 14, w * 0.16, cy - ly); }
          ctx.fillStyle = i ? 'rgba(241,245,249,0.25)' : 'rgba(255,255,255,0.04)'; ctx.fillRect(cx - w * 0.08, cy - h * 0.13, w * 0.16, 10);
          var gecen = uv ? Math.pow(k[1], 0.45) : 0; // boncuk rengi doza doğrusal değil, doymaya gider (temsilî)
          for (var b = 0; b < 6; b++) {
            var bx = cx - w * 0.05 + (b % 3) * w * 0.05, by2 = cy + (b < 3 ? 0 : h * 0.07);
            var c = Math.round(255 - 140 * gecen), rr = Math.round(255 - 90 * gecen);
            C.daire(ctx, bx, by2, Math.min(w * 0.02, h * 0.035), 'rgb(' + rr + ',' + c + ',' + 255 + ')', '#cbd5e1', 1);
          }
          C.yazi(ctx, k[0], cx, cy + h * 0.17, { boyut: fs * 0.9, kalin: true, hiza: 'center' });
          C.yazi(ctx, i ? 'UVB’nin ≈ %' + Math.round((1 - k[1]) * 100) + '’ü engellenir' : 'koruma yok', cx, cy + h * 0.17 + fs * 1.3, { boyut: fs * 0.75, hiza: 'center', renk: '#fde68a' });
        });
        C.yazi(ctx, 'Boncuklar UV ışığı aldıkça mor renge döner.', w / 2, h * 0.95, { boyut: fs * 0.75, hiza: 'center', renk: '#cbd5e1' });
        bilgi.innerHTML = 'UV’ye duyarlı boncukların üzerinde farklı güneş kremleri (sürülmüş şeffaf film)';
      }
    });
    return {};
  });

  // =====================================================================
  // BÎRÛNÎ: Yoğunlukla saf altını tanımak
  // =====================================================================
  var ORNEK = [
    { id: 'altin', ad: 'Altın', m: 96.5, v: 5.0 }, { id: 'gumus', ad: 'Gümüş', m: 52.5, v: 5.0 },
    { id: 'bakir', ad: 'Bakır', m: 44.8, v: 5.0 }, { id: 'demir', ad: 'Demir', m: 39.4, v: 5.0 },
    { id: 'kursun', ad: 'Kurşun', m: 56.7, v: 5.0 }, { id: 'yuzuk', ad: 'Gizemli “altın” yüzük', m: 38.6, v: 2.5 }
  ];
  GG.simKaydet('yogunluk', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var sec = ORNEK[0], olc = {}, anim = 1, faz = '';
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Örnek', deger: sec.id, secenekler: ORNEK.map(function (o) { return { id: o.id, ad: o.ad.replace('Gizemli “altın” yüzük', 'Gizemli yüzük') }; }), degisti: function (v) { sec = ORNEK.filter(function (o) { return o.id === v; })[0]; } }).kok);
    y.kontrol.appendChild(api.ui.dugme('⚖ Tart', function () { (olc[sec.id] = olc[sec.id] || {}).m = sec.m; faz = 'tart'; anim = 0; kontrol(); }, 'ana'));
    y.kontrol.appendChild(api.ui.dugme('💧 Suya daldır', function () { (olc[sec.id] = olc[sec.id] || {}).v = sec.v; faz = 'daldir'; anim = 0; kontrol(); }));
    function kontrol() {
      var tam = ORNEK.filter(function (o) { return o.id !== 'yuzuk' && olc[o.id] && olc[o.id].m && olc[o.id].v; }).length;
      if (tam >= 3) api.gozlem('olcum3');
      if (olc.yuzuk && olc.yuzuk.m && olc.yuzuk.v) api.gozlem('yuzuk');
    }
    api.dongu(function (dt) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t);
      anim = Math.min(1, anim + dt * 1.5);
      arkaPlan(t, '#1f1a12', '#0f0c08');
      // terazi
      var tx = w * 0.14, tyy = h * 0.62;
      ctx.fillStyle = '#a16207'; ctx.fillRect(tx - w * 0.08, tyy, w * 0.16, h * 0.05);
      ctx.fillStyle = '#111'; ctx.fillRect(tx - w * 0.06, tyy + h * 0.008, w * 0.12, h * 0.034);
      C.yazi(ctx, faz === 'tart' && anim > 0.5 ? GG.sayi(sec.m, 1) + ' g' : '— g', tx, tyy + h * 0.025, { boyut: fs * 0.95, kalin: true, hiza: 'center', renk: '#4ade80' });
      var orRenk = sec.id === 'gumus' ? '#e5e7eb' : (sec.id === 'bakir' ? '#c2410c' : (sec.id === 'demir' ? '#6b7280' : (sec.id === 'kursun' ? '#475569' : '#facc15')));
      if (faz === 'tart') C.daire(ctx, tx, tyy - 14, 13, orRenk);
      C.yazi(ctx, 'terazi', tx, tyy + h * 0.09, { boyut: fs * 0.75, hiza: 'center', renk: '#d6c7a1' });
      // taşırma kabı
      var kx = w * 0.36, kby = h * 0.7, kw = w * 0.1, kh = h * 0.32;
      ctx.strokeStyle = 'rgba(220,235,255,0.85)'; ctx.lineWidth = 3; ctx.strokeRect(kx - kw / 2, kby - kh, kw, kh);
      ctx.beginPath(); ctx.moveTo(kx + kw / 2, kby - kh * 0.82); ctx.lineTo(kx + kw / 2 + 30, kby - kh * 0.78); ctx.stroke();
      ctx.fillStyle = 'rgba(96,165,250,0.5)'; ctx.fillRect(kx - kw / 2 + 2, kby - kh * 0.8, kw - 4, kh * 0.8 - 2);
      if (faz === 'daldir') C.daire(ctx, kx, Math.min(kby - 16, kby - kh * 0.95 + Math.min(1, anim * 1.4) * kh * 0.9), 13, orRenk);
      var my = kx + kw / 2 + 40, mby = kby, mh = h * 0.2;
      ctx.strokeRect(my - 14, mby - mh, 28, mh);
      var akan = faz === 'daldir' ? Math.min(1, anim * 1.4) * sec.v / 5 : 0;
      ctx.fillStyle = 'rgba(96,165,250,0.6)'; ctx.fillRect(my - 12, mby - mh * akan * 0.8, 24, mh * akan * 0.8);
      C.yazi(ctx, faz === 'daldir' && anim > 0.6 ? GG.sayi(sec.v, 1) + ' cm³ taştı' : 'taşan su', my, mby + fs, { boyut: fs * 0.75, hiza: 'center', renk: '#bfdbfe' });
      // tablo
      var ttx = w * 0.53, tw = w * 0.45, tty = h * 0.08, sat = fs * 1.8;
      C.yazi(ctx, 'Ölçüm defteri', ttx, tty, { boyut: fs, kalin: true });
      ['Örnek', 'Kütle (g)', 'Hacim (cm³)', 'Yoğunluk (g/cm³)'].forEach(function (b, i) { C.yazi(ctx, b, ttx + tw * [0, 0.32, 0.5, 0.71][i], tty + sat, { boyut: fs * 0.7, kalin: true, renk: '#fcd34d' }); });
      ORNEK.forEach(function (o, r) {
        var yy = tty + sat * (r + 2), q = olc[o.id] || {};
        C.yazi(ctx, o.ad.replace('Gizemli “altın” yüzük', 'Gizemli yüzük'), ttx, yy, { boyut: fs * 0.78 });
        if (q.m) C.yazi(ctx, GG.sayi(q.m, 1), ttx + tw * 0.32, yy, { boyut: fs * 0.78 });
        if (q.v) C.yazi(ctx, GG.sayi(q.v, 1), ttx + tw * 0.5, yy, { boyut: fs * 0.78 });
        if (q.m && q.v) C.yazi(ctx, GG.sayi(q.m / q.v, 1), ttx + tw * 0.71, yy, { boyut: fs * 0.85, kalin: true, renk: '#fde68a' });
      });
      C.yazi(ctx, 'Yoğunluk = kütle ÷ hacim', ttx, tty + sat * 9, { boyut: fs * 0.85, kalin: true, renk: '#fcd34d' });
      bilgi.innerHTML = 'Seçili örnek: <b>' + sec.ad + '</b> · Önce tart, sonra suya daldırıp taşan suyun hacmini ölç.';
    });
    return {};
  });
})();

<script>/* js/simler/s2.js */
/* Kimya Hayattır — 3. bölüm deneyleri (kaza dosyaları): karıştırma masası, karbon monoksit odası, laboratuvar karikatürü,
   piktogramlar, cıva, tarım ilacı, atıklar. Bütün “tehlikeli” deneyler yalnızca ekranda yapılır. */
'use strict';
(function () {
  var el = GG.el, C = GG.ciz;
  function arkaPlan(t, ust, alt) {

        maddeler: [

<script>/* js/final.js */
/* Final: Güvenlik kampanyası. Ortak nedenleri bul, kendini değerlendir, kamu spotunu hazırla. */
'use strict';
(function () {

  var DAVRANIS = [
    'Bir temizlik ürününü kullanmadan önce etiketini okurum.',
    'Temizlik ürünlerini birbiriyle karıştırmam.',
    'Temizlik yaparken ortamı havalandırırım.',
    'Kimyasal ürünleri kendi kaplarında ve küçük çocukların ulaşamayacağı yerde tutarım.',

    'Süresi geçmiş ilaçları eczaneye götürürüm.',

  var OZ = [{ id: 'h', ad: '✔ Her zaman' }, { id: 'b', ad: '◐ Bazen' }, { id: 'd', ad: '○ Henüz değil' }];

    { id: 'bulut', ad: 'Temizlik ürünleri', ikon: '🧴⚠️', renk: '#0f766e', slogan: 'Karıştırma, nefesini koru!',

    { id: 'co', ad: 'Soba ve karbon monoksit', ikon: '🔥🏠', renk: '#b91c1c', slogan: 'Kokusu yok, rengi yok, tehlikesi büyük!',

    { id: 'lab', ad: 'Laboratuvar güvenliği', ikon: '🥽🧪', renk: '#1d4ed8', slogan: 'Gözlüğün, gözün kadar değerli!',
      kanit: 'Göze sıçrayan küçük bir kimyasal damlası bile kalıcı zarar verebilir.',
      cagri: 'Laboratuvarda gözlük ve önlük tak, piktogramları oku, kurallara uy.' },
    { id: 'civa', ad: 'Kırılan termometre', ikon: '🌡️🫙', renk: '#475569', slogan: 'Cıvayı süpürme, topla!',
      kanit: 'Süpürge cıvayı küçük damlalara ayırır; yüzey büyür, daha çok cıva buharlaşır.',
      cagri: 'Odayı havalandır, eldivenle karton ve bantla topla, kapalı kavanozda tehlikeli atık olarak teslim et.' },
    { id: 'tarla', ad: 'Tarım ilacı', ikon: '🌾🐝', renk: '#15803d', slogan: 'Doğru ilaçlama, sağlıklı sofra!',
      kanit: 'Rüzgâr ilacı arılara ve dereye taşır. Ürün üzerindeki kalıntı ancak hasat aralığı beklenince güvenli sınırın altına iner.',
      cagri: 'Rüzgârsız havada, koruyucu ekipmanla ve etiketteki dozda ilaçla; hasat aralığını bekle.' },
    { id: 'atik', ad: 'Atıklar', ikon: '🔋♻️', renk: '#a16207', slogan: 'Her atığın bir adresi var!',
      kanit: 'Pil, cıvalı ampul ve boya doğaya karışınca toprağı ve suyu kirletebilir.',
      cagri: 'Pili atık pil kutusuna, ilacı eczaneye, kızartma yağını toplama noktasına götür.' }
  ];
  var KITLE = [{ id: 'aile', ad: 'Ailem' }, { id: 'okul', ad: 'Okulum' }, { id: 'apartman', ad: 'Apartmanım' }, { id: 'koy', ad: 'Köyümüz / çiftçiler' }];
  var KITLE_AD = { aile: 'Sevgili ailem', okul: 'Sevgili arkadaşlar', apartman: 'Değerli komşularımız', koy: 'Değerli üreticilerimiz' };
  var ACIL = 'Acil durumda 112 · Zehirlenme şüphesinde Ulusal Zehir Danışma Merkezi 114';

  function kacis(m) { return String(m).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  GG.finalSayfasi = function () {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(el('div', { sinif: 'ust-cubuk' }, [
      GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
      el('div', { sinif: 'ust-baslik' }, [el('span', { sinif: 'ust-yil', metin: 'FİNAL' }), el('span', { sinif: 'ust-kisi', metin: 'Güvenlik kampanyası' })])
    ]));
    var ic = el('div', { stil: 'max-width:70rem' });
    s.appendChild(ic);
    ic.appendChild(el('h1', { metin: '📣 Güvenlik kampanyası' }));
    ic.appendChild(el('p', { html: 'Altı kaza dosyasını çözdün. Şimdi dosyalara birlikte bakıp <b>ortak nedenleri</b> bulalım, kendi davranışlarımızı değerlendirelim ve bir <b>kamu spotu</b> hazırlayalım.' }));

    function bolum(no, baslik) {
      var k = el('section', { stil: 'background:var(--yuzey);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:var(--golge)' });
      k.appendChild(el('span', { sinif: 'etiket-cip', metin: no + '. ADIM' }));
      k.appendChild(el('h2', { stil: 'margin:.4rem 0', metin: baslik }));
      ic.appendChild(k);
      return k;
    }
    function baglam(no, sonra) {
      return {
        durak: { id: 'final' }, adimNo: no, cozuldu: false,
        hazir: function (v) { if (v !== false && sonra) { var f = sonra; sonra = null; f(); } },
        ilkDeneme: function () {}, gozlemVar: function () { return false; }, gozlemDinle: function () {}, tahminBul: function () { return null; }
      };
    }
    function kaydir(k) { setTimeout(function () { k.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); }

    // 1. adım: ortak nedenler (genelleme)
    var b1 = bolum(1, 'Kazaların ortak nedenleri');
    b1.appendChild(GG.adimTurleri.siniflandir({
      soru: 'Dosyalardaki her hatayı, ait olduğu ortak nedenle eşleştir.',
      kutular: [
        { id: 'e', ad: '📋 Etiketi okumamak, maddeyi tanımamak' },
        { id: 'h', ad: '🪟 Havalandırmayı ihmal etmek' },
        { id: 'k', ad: '🥽 Koruyucu ekipman kullanmamak' },
        { id: 'a', ad: '🗑 Atığı yanlış yere atmak' }
      ],
      kartlar: [
        { metin: 'Dosya 1: Kireç çözücünün üzerine çamaşır suyu döküldü.', kutu: 'e', geri: 'Çamaşır suyunun etiketinde “başka ürünlerle karıştırmayın” uyarısı vardı.' },
        { metin: 'Dosya 1: Banyonun penceresi kapalıydı.', kutu: 'h' },
        { metin: 'Dosya 2: Sobanın havası kısıldı, kapı ve pencereler kapatıldı.', kutu: 'h', geri: 'Hava az olunca yanma eksik olur; gaz da odadan çıkamaz.' },
        { metin: 'Dosya 3: Öğrenci gözlüğünü çıkardı.', kutu: 'k' },
        { metin: 'Dosya 4: Cıva elektrikli süpürgeyle çekilmek istendi.', kutu: 'e', geri: 'Cıvanın oda sıcaklığında buharlaştığını bilmemek, yanlış çözüme götürdü.' },
        { metin: 'Dosya 5: Çiftçi maske ve eldiven takmadı.', kutu: 'k' },
        { metin: 'Dosya 5: Etiketteki hasat aralığı beklenmedi.', kutu: 'e' },
        { metin: 'Dosya 6: Kızartma yağı lavaboya döküldü.', kutu: 'a' },
        { metin: 'Dosya 6: Biten piller çöpe atıldı.', kutu: 'a' }
      ],
      aciklama: 'Farklı ortamlarda yaşanan kazaların arkasında aynı birkaç neden tekrar ediyor. Bu nedenleri bilen biri, hiç görmediği bir kazayı da önleyebilir.'
    }, baglam(0, ikinci)));

    // 2. adım: öz değerlendirme
    function ikinci() {
      var b2 = bolum(2, 'Kendini değerlendir');
      kaydir(b2);
      b2.appendChild(el('p', { html: 'Bu davranışları ne sıklıkla yapıyorsun? <b>Doğru ya da yanlış cevap yok.</b> Amaç, geliştirmek istediğin davranışı bulmak.' }));
      b2.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Akıllı tahtada bir örnek üzerinde birlikte konuşun; her öğrenci kendi değerlendirmesini defterine de yazabilir.' }));
      var oz = GG.durum.oz || {};
      var ozet = el('div');
      var devam = null;
      DAVRANIS.forEach(function (d, i) {
        var satir = el('div', { stil: 'display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.45rem 0;border-bottom:1px solid var(--cizgi)' });
        satir.appendChild(el('div', { stil: 'flex:1 1 22rem', html: (i + 1) + '. ' + d }));
        satir.appendChild(GG.ui.secici({ secenekler: OZ, deger: oz[i] || '', degisti: function (v) { oz[i] = v; GG.durum.oz = oz; GG.kaydet(); boya(); } }).kok);
        b2.appendChild(satir);
      });
      b2.appendChild(ozet);
      function boya() {
        GG.bosalt(ozet);
        var n = Object.keys(oz).length;
        if (n < DAVRANIS.length) { ozet.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Değerlendirilen davranış: ' + n + ' / ' + DAVRANIS.length })); return; }
        var gelis = DAVRANIS.filter(function (d, i) { return oz[i] !== 'h'; });
        var k = el('div', { sinif: 'geri-bildirim iyi' });
        k.appendChild(el('div', { html: gelis.length
          ? '<b>Geliştirmek istediğin davranışlar:</b>'
          : '<b>Harika!</b> Bütün davranışları her zaman yaptığını söylüyorsun. Şimdi bunları çevrene anlatma zamanı.' }));
        if (gelis.length) {
          var ul = el('ul', { stil: 'margin:.3rem 0' });
          gelis.forEach(function (d) { ul.appendChild(el('li', { html: d })); });
          k.appendChild(ul);
          k.appendChild(el('div', { metin: 'Bu hafta bunlardan birini seçip her gün uygulamayı dene.' }));
        }
        ozet.appendChild(k);
        if (!devam) {
          devam = GG.ui.dugme('Kamu spotuna geç ▶', function () { devam.disabled = true; ucuncu(); }, 'ana');
          b2.appendChild(el('div', { stil: 'margin-top:.6rem' }, devam));
        }
      }
      boya();
    }

    // 3. adım: kamu spotu
    function ucuncu() {
      var b3 = bolum(3, 'Kamu spotunu hazırla');
      b3.classList.add('acik-zemin');

      var konu = SPOT[0], kitle = 'aile';
      var girSlogan = el('input', { type: 'text', stil: 'width:100%;font-size:1.05rem;padding:.4rem;border-radius:8px;border:1px solid var(--cizgi);font-family:inherit;box-sizing:border-box', 'aria-label': 'Slogan' });
      var girKanit = el('textarea', { rows: 2, stil: 'width:100%;font-size:1rem;padding:.4rem;border-radius:8px;border:1px solid var(--cizgi);font-family:inherit;box-sizing:border-box', 'aria-label': 'Bilimsel gerekçe' });
      var girCagri = el('textarea', { rows: 2, stil: 'width:100%;font-size:1rem;padding:.4rem;border-radius:8px;border:1px solid var(--cizgi);font-family:inherit;box-sizing:border-box', 'aria-label': 'Çağrı' });
      function doldur() { girSlogan.value = konu.slogan; girKanit.value = konu.kanit; girCagri.value = konu.cagri; ciz(); }
      b3.appendChild(GG.ui.secici({ etiket: 'Konu', secenekler: SPOT.map(function (x) { return { id: x.id, ad: x.ikon + ' ' + x.ad }; }), deger: konu.id,

      function alan(ad, giris) { return el('label', { stil: 'display:block;margin:.5rem 0' }, [el('b', { metin: ad }), giris]); }

      b3.appendChild(alan('Bilimsel gerekçe (dosyadan öğrendiğin)', girKanit));
      b3.appendChild(alan('Çağrı (ne yapmalı?)', girCagri));
      [girSlogan, girKanit, girCagri].forEach(function (g) { g.addEventListener('input', ciz); });
      var afis = el('div');
      b3.appendChild(el('p', { stil: 'margin:.8rem 0 .3rem', html: '<b>Kamu spotunun önizlemesi</b>' }));
      b3.appendChild(afis);
      var bitirildi = false;
      b3.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem' }, [
        GG.ui.dugme('🖨 Yazdır', yazdir),
        GG.ui.dugme('Kampanyayı tamamla ✔', function () { if (!bitirildi) { bitirildi = true; bitti(); } }, 'ana')
      ]));
      function afisHtml() {
        return '<div style="background:' + konu.renk + ';color:#fff;border-radius:18px;padding:1.4rem 1.6rem;font-family:inherit;max-width:44rem">' +
          '<div style="font-size:.95rem;opacity:.9">' + KITLE_AD[kitle] + ',</div>' +
          '<div style="font-size:3rem;line-height:1.1;margin:.4rem 0">' + konu.ikon + '</div>' +
          '<div style="font-size:2rem;font-weight:800;line-height:1.15;margin:.2rem 0 .7rem">' + kacis(girSlogan.value) + '</div>' +
          '<div style="background:rgba(255,255,255,.15);border-radius:12px;padding:.6rem .8rem;margin:.4rem 0"><b>Neden?</b> ' + kacis(girKanit.value) + '</div>' +
          '<div style="background:#fff;color:#172031;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-weight:700">👉 ' + kacis(girCagri.value) + '</div>' +
          '<div style="font-size:.85rem;opacity:.9;margin-top:.6rem">☎ ' + ACIL + '</div>' +
          '</div>';
      }
      function ciz() { afis.innerHTML = afisHtml(); }
      function yazdir() {
        var w = window.open('', '_blank');
        if (!w) { GG.bosalt(afis); afis.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Yeni pencere açılamadı. Tarayıcının açılır pencere iznini kontrol edin.' })); setTimeout(ciz, 2500); return; }
        w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Kamu spotu</title><style>body{font-family:system-ui,sans-serif;margin:2rem;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>' + afisHtml() + '<script>setTimeout(function(){print()},300)<\/script></body></html>');
        w.document.close();
      }
      doldur();
    }

    function bitti() {
      GG.durum.tamam.final = true; GG.kaydet();
      var k = el('section', { stil: 'background:linear-gradient(135deg,#172031,#0f766e);color:#fff;border-radius:14px;padding:1.2rem 1.4rem;margin:1rem 0' });
      k.appendChild(el('h2', { stil: 'margin:.2rem 0 .5rem', metin: '🎉 Kampanya hazır!' }));
      k.appendChild(el('p', { html: 'Evdeki ürünlerin kimyasını deneyle keşfettin, kimyanın dallarını ve ona katkı verenleri tanıdın, altı kaza dosyasını bir kimyacı gibi çözdün. Kimya hayatın içinde: <b>Doğru bilgiyle kullanınca hayatı kolaylaştırır, bilgisizce kullanınca tehlikeye dönüşür.</b>' }));
      k.appendChild(el('p', { html: 'Performans görevi önerisi: Hazırladığın spotu ailene ya da okul panosuna taşı veya seçtiğin bir dosya hakkında kısa bir haber yazısı yaz.' }));
      k.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem' }, [
        GG.ui.dugme(GG.OYUN.muze.dugme, function () { GG.git('muze'); }),
        GG.ui.dugme('Haritaya dön', function () { GG.git(''); })
      ]));
      ic.appendChild(k);
      kaydir(k);
    }
    return s;
  };
})();
