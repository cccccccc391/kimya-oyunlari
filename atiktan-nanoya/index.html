<style>
  :root { --zemin: #f5f0e8; --yuzey: #ffffff; --yazi: #1c2433; --soluk: #5b6474; --renk: #1d4ed8; --hata: #b91c1c; --cizgi: #d9d2c5; }
  @media (prefers-color-scheme: dark) { :root { --zemin: #0f1420; --yuzey: #182031; --yazi: #e8edf6; --soluk: #a3adbf; --renk: #60a5fa; --hata: #fca5a5; --cizgi: #2c3850; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--zemin); color: var(--yazi); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  .kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 18px; padding: 2rem 2rem 1.5rem; width: 100%; max-width: 30rem; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .kilit { font-size: 3rem; line-height: 1; }
  h1 { font-size: 1.9rem; margin: .6rem 0 .2rem; }
  .alt { color: var(--soluk); margin: 0 0 1.4rem; font-size: 1.05rem; }
  label { display: block; font-weight: 700; margin-bottom: .4rem; font-size: 1.05rem; }
  input[type=password] { width: 100%; font-size: 1.5rem; padding: .6rem .8rem; border-radius: 12px; border: 2px solid var(--cizgi); background: var(--zemin); color: var(--yazi); font-family: inherit; }
  input[type=password]:focus { outline: 3px solid var(--renk); outline-offset: 1px; }
  .hatirla { display: flex; align-items: center; gap: .5rem; font-weight: 400; margin: .9rem 0 1.1rem; font-size: 1rem; }
  .hatirla input { width: 1.4rem; height: 1.4rem; }
  button { width: 100%; font-size: 1.3rem; font-weight: 700; padding: .75rem; border-radius: 12px; border: 0; background: var(--renk); color: #fff; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: .6; cursor: wait; }
  .mesaj { min-height: 1.6rem; margin-top: .8rem; font-weight: 700; color: var(--hata); }
  .not { color: var(--soluk); font-size: .92rem; margin-top: .6rem; }
  a { color: var(--renk); }
</style>

  var ANAHTAR = 'gg-kilit-v1';
  var form = document.getElementById('form'), girdi = document.getElementById('sifre'), mesaj = document.getElementById('mesaj'), dugme = document.getElementById('ac');
  function cevir(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  function goster(sayfa) {

  } else girdi.focus();
  form.addEventListener('submit', function (olay) {
    olay.preventDefault();
    var sifre = girdi.value.trim().toLowerCase();
    if (!sifre) return;

    var hatirla = document.getElementById('hatirla').checked, anahtar;
