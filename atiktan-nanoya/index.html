  var SENTEZ = {
    ag: { ad: 'Gümüş', tuz: 'gümüş nitrat (AgNO₃)', indirgen: 'sodyum sitrat', kosul: 'kaynatarak', bas: [235, 242, 250], son: [214, 190, 92], tepe: 420, dk: 30, notu: 'Renksiz çözelti önce açık sarıya, sonra koyu sarı-gri bir renge döndü.' },
    cu: { ad: 'Bakır', tuz: 'bakır(II) sülfat (CuSO₄)', indirgen: 'askorbik asit (C vitamini)', kosul: '80 °C’ta, nişastayla', bas: [96, 165, 250], son: [161, 98, 7], tepe: 580, dk: 120, notu: 'Mavi çözeltinin rengi soldu, sarımsı ve sonra okra-kahverengi bir renge döndü (renk koşullara göre değişebilir).' }
  };
  GG.simKaydet('sentez', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var mid = 'ag', f = -1, laz = false, tamam = {};
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Metal', deger: mid, secenekler: [{ id: 'ag', ad: '⚪ Gümüş' }, { id: 'cu', ad: '🟤 Bakır' }], degisti: function (v) { mid = v; f = -1; } }).kok);
    y.kontrol.appendChild(api.ui.dugme('🔥 Isıt ve karıştır', function () { f = 0; }, 'ana'));
    y.kontrol.appendChild(api.ui.anahtar({ etiket: '🔦 Lazerle sına', degisti: function (v) { laz = v; kontrol(); } }).kok);
    function kontrol() { if (laz && f >= 1) api.gozlem('tyndall'); }
    api.dongu(function (dt, z) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), S = SENTEZ[mid], s = z / 1000;
      if (f >= 0 && f < 1) { f = Math.min(1, f + dt / 5); if (f >= 1) { tamam[mid] = 1; api.gozlem(mid === 'ag' ? 'gumus' : 'bakir'); kontrol(); } }
      arkaPlan(t);
      var k = f < 0 ? 0 : f, renk = karis(S.bas, S.son, k);
      var bw = w * 0.16, bh = h * 0.42, b1 = w * 0.08, b2 = w * 0.32, by = h * 0.2;
      beher(ctx, b1, by, bw, bh, rgb(S.bas), mid === 'ag' ? 0.12 : 0.75);
      beher(ctx, b2, by, bw, bh, rgb(renk), mid === 'ag' ? 0.12 + 0.73 * Math.min(1, k * 2) : 0.85);
      C.yazi(ctx, 'Başlangıç çözeltisi', b1 + bw / 2, by + bh + fs, { boyut: fs * 0.7, hiza: 'center', renk: '#cbd5e1' });
      C.yazi(ctx, f < 0 ? 'Tepkime kabı' : (f < 1 ? 'Tepkime sürüyor…' : 'Ürün'), b2 + bw / 2, by + bh + fs, { boyut: fs * 0.7, hiza: 'center', renk: '#cbd5e1' });
      if (f >= 0 && f < 1) { for (var i = 0; i < 5; i++) C.yazi(ctx, '🔥', b2 + bw * (0.1 + i * 0.2), by + bh + fs * 2.2, { boyut: fs * 0.9, hiza: 'center' }); for (var b = 0; b < 8; b++) C.daire(ctx, b2 + 10 + (b * 23 % (bw - 20)), by + bh - ((s * 0.8 + b / 8) % 1) * bh * 0.6, 3, 'rgba(255,255,255,0.5)'); }
      if (laz) lazer(ctx, b1, by + bh * 0.62, b2 + bw + 30, false, 0);
      if (laz) { // ikinci kaptaki ışın görünürlüğü
        var gor = f >= 1 ? 1 : Math.max(0, k - 0.3);
        if (gor > 0) { ctx.strokeStyle = 'rgba(248,113,113,' + (0.3 + 0.6 * gor) + ')'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(b2 + 6, by + bh * 0.62); ctx.lineTo(b2 + bw - 6, by + bh * 0.62); ctx.stroke(); }
        C.yazi(ctx, 'ışın görünmüyor', b1 + bw / 2, by - fs * 0.6, { boyut: fs * 0.65, hiza: 'center', renk: '#94a3b8' });
        C.yazi(ctx, gor > 0.5 ? 'ışının yolu görünüyor!' : 'ışın görünmüyor', b2 + bw / 2, by - fs * 0.6, { boyut: fs * 0.65, hiza: 'center', renk: gor > 0.5 ? '#fca5a5' : '#94a3b8' });
      }
      // soğurma grafiği
      var gx = w * 0.56, gy = h * 0.08, gw = w * 0.41, gh = h * 0.4;
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, gx, gy, gw, gh, 12); ctx.fill();
      C.yazi(ctx, 'Işık soğurma (spektrum)', gx + 12, gy + fs, { boyut: fs * 0.75, kalin: true });
      var px0 = gx + 20, px1 = gx + gw - 14, py0 = gy + gh - 24, py1 = gy + fs * 2;
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px0, py0); ctx.lineTo(px1, py0); ctx.stroke();
      [400, 500, 600, 700].forEach(function (l) { var X = px0 + (l - 350) / 400 * (px1 - px0); C.yazi(ctx, l + ' nm', X, py0 + 12, { boyut: fs * 0.55, hiza: 'center', renk: '#94a3b8' }); });
      if (f > 0) {
        ctx.strokeStyle = rgb(S.son); ctx.lineWidth = 3; ctx.beginPath();
        for (var l = 350; l <= 750; l += 5) { var g = Math.exp(-Math.pow((l - S.tepe) / (mid === 'ag' ? 45 : 70), 2)) * k, X = px0 + (l - 350) / 400 * (px1 - px0), Y = py0 - g * (py0 - py1) * 0.9; if (l === 350) ctx.moveTo(X, Y); else ctx.lineTo(X, Y); }
        ctx.stroke();
        if (f >= 1) C.yazi(ctx, 'tepe ≈ ' + S.tepe + ' nm', px0 + (S.tepe - 350) / 400 * (px1 - px0), py1 + 4, { boyut: fs * 0.62, hiza: 'center', renk: '#fde68a' });
      }
      var tx = w * 0.56, ty = h * 0.52, tw = w * 0.41;
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, tx, ty, tw, h * 0.43, 12); ctx.fill();
      var yy = ty + fs * 1.2;
      yy = satirla(ctx, S.ad + ' nanoparçacık', tx + 12, yy, tw - 24, fs, '#e2e8f0', 'left', true) + fs * 1.4;
      yy = satirla(ctx, 'Tuz: ' + S.tuz + ' · İndirgen: ' + S.indirgen + ' · Koşul: ' + S.kosul, tx + 12, yy, tw - 24, fs * 0.72, '#cbd5e1') + fs * 1.4;
      if (f >= 1) satirla(ctx, 'Gözlem: ' + S.notu, tx + 12, yy, tw - 24, fs * 0.75, '#fde68a', 'left', true);
      bilgi.innerHTML = 'Öğretmen gösterisi (benzetim) · Gerçek süre: yaklaşık ' + S.dk + ' dakika · ' + (laz ? 'Lazer açık' : 'Lazer kapalı');
    });
    return {};
  });

  // =====================================================================
  // EVSEL ATIKLARDAN GÜMÜŞ NANOPARÇACIK (yeşil sentez)
  // =====================================================================
  // hiz: renk değişiminin hızı (göreli), A: 30 dakika sonundaki soğurma (göreli, temsilî)
  var ATIK = [
    { id: 'nar', ad: 'Nar kabuğu', ikon: '🔴', hiz: 1.0, A: 0.92, son: [120, 78, 30] },
    { id: 'sogan', ad: 'Soğan kabuğu', ikon: '🧅', hiz: 0.8, A: 0.78, son: [146, 96, 34] },
    { id: 'portakal', ad: 'Portakal kabuğu', ikon: '🍊', hiz: 0.6, A: 0.61, son: [180, 132, 52] },
    { id: 'kahve', ad: 'Kahve telvesi', ikon: '☕', hiz: 0.5, A: 0.55, son: [150, 110, 60] },
    { id: 'muz', ad: 'Muz kabuğu', ikon: '🍌', hiz: 0.4, A: 0.44, son: [196, 160, 80] },
    { id: 'kontrol', ad: 'Saf su (kontrol)', ikon: '💧', hiz: 0, A: 0.0, son: [235, 242, 250] }
  ];
  GG.simKaydet('yesil', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var a = ATIK[2], dk = 0, laz = false, kayit = {};
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    var dkK;
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Özüt', deger: a.id, secenekler: ATIK.map(function (q) { return { id: q.id, ad: q.ikon + ' ' + q.ad }; }), degisti: function (v) { a = ATIK.filter(function (q) { return q.id === v; })[0]; dk = 0; dkK.ayarla(0, true); } }).kok);
    dkK = api.ui.kaydirici({ etiket: 'Özüt eklendikten sonra', min: 0, max: 30, adim: 5, deger: 0, bicim: function (v) { return v + ' dk'; }, degisti: function (v) { dk = v; } });
    y.kontrol.appendChild(dkK.kok);
    y.kontrol.appendChild(api.ui.anahtar({ etiket: '🔦 Lazerle sına', degisti: function (v) { laz = v; } }).kok);
    y.kontrol.appendChild(api.ui.dugme('📋 Kaydet', function () {
      if (dk < 30) { api.bildir('Karşılaştırma yapabilmek için her örneği aynı sürede (30 dakika) ölç.'); return; }
      kayit[a.id] = { a: a, laz: laz };
      var atik = Object.keys(kayit).filter(function (k) { return k !== 'kontrol'; });
      if (atik.length >= 3) api.gozlem('atik3');
      if (kayit.kontrol) api.gozlem('kontrol');
      if (Object.keys(kayit).some(function (k) { return kayit[k].laz && k !== 'kontrol'; })) api.gozlem('tyndall');
    }, 'ana'));
    function A(q, d) { return q.A * (1 - Math.exp(-q.hiz * d / 8)) / (1 - Math.exp(-q.hiz * 30 / 8) || 1); }
    api.dongu(function () {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), oran = a.A ? A(a, dk) / 1 : 0;
      arkaPlan(t);
      var renk = karis([235, 242, 250], a.son, Math.min(1, oran));
      var bx = w * 0.07, by = h * 0.22, bw = w * 0.17, bh = h * 0.45;
      beher(ctx, bx, by, bw, bh, rgb(renk), 0.3 + 0.6 * Math.min(1, oran));
      C.yazi(ctx, a.ikon + ' ' + a.ad + ' özütü + gümüş nitrat çözeltisi', bx, by - fs * 1.4, { boyut: fs * 0.8, kalin: true });
      C.yazi(ctx, 'oda sıcaklığında, ' + dk + '. dakika', bx, by - fs * 0.3, { boyut: fs * 0.7, renk: '#cbd5e1' });
      if (laz) {
        lazer(ctx, bx, by + bh * 0.6, bx + bw + 20, oran > 0.15, Math.min(1, oran));
        C.yazi(ctx, oran > 0.15 ? 'ışının yolu görünüyor' : 'ışın görünmüyor', bx + bw / 2, by + bh + fs * 1.2, { boyut: fs * 0.72, hiza: 'center', kalin: true, renk: oran > 0.15 ? '#fca5a5' : '#94a3b8' });
      }
      // ölçüm kartı
      var mx = w * 0.3, my = h * 0.22;
      C.yazi(ctx, 'Soğurma (≈ 420 nm):', mx, my, { boyut: fs * 0.75, renk: '#94a3b8' });
      C.yazi(ctx, GG.sayi(A(a, dk), 2), mx, my + fs * 1.4, { boyut: fs * 1.4, kalin: true, renk: '#fde047' });
      satirla(ctx, 'Soğurma ne kadar büyükse o kadar çok nanoparçacık oluşmuştur (göreli, temsilî).', mx, my + fs * 3, w * 0.24, fs * 0.66, '#94a3b8');
      // sınıf veri tablosu
      var tx = w * 0.56, tw = w * 0.42;
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, tx, h * 0.04, tw, h * 0.92, 12); ctx.fill();
      C.yazi(ctx, 'Sınıfın ortak veri tablosu (30. dakika)', tx + 12, h * 0.04 + fs, { boyut: fs * 0.78, kalin: true, renk: '#fde68a' });
      var satirlar = ATIK.filter(function (q) { return kayit[q.id]; }).map(function (q) { return [q.ikon + ' ' + q.ad, q.A ? 'sarı-kahve' : 'değişmedi', GG.sayi(q.A, 2), kayit[q.id].laz ? (q.A ? 'var' : 'yok') : 'sınanmadı']; });
      cizelge(ctx, tx + 12, h * 0.04 + fs * 2.3, tw - 24, ['Özüt', 'Renk', 'Soğurma', 'Tyndall'], [0.4, 0.22, 0.18, 0.2], satirlar, fs, fs * 1.25);
      bilgi.innerHTML = 'Her grup aynı derişimde gümüş nitrat çözeltisi ve aynı miktarda özüt kullanıyor. Değerler göreli ve temsilîdir.';
    });
    return {};
  });
})();

<script>/* js/simler/s2.js */
/* Atıktan Nanoya — 2. bölüm deneyleri: besin zincirinde birikim, nanoparçacık süzme, bitkiyle toprak temizleme */
'use strict';
(function () {
  var el = GG.el, C = GG.ciz;
  function arkaPlan(t, ust, alt) {
    var g = t.ctx.createLinearGradient(0, 0, 0, t.h);
    g.addColorStop(0, ust || '#0c1a2b'); g.addColorStop(1, alt || '#08111d');
    t.ctx.fillStyle = g; t.ctx.fillRect(0, 0, t.w, t.h);
  }
  function satirla(ctx, metin, x, y, gen, boyut, renk, hiza, kalin) {
    ctx.font = GG.font(boyut, kalin);
    var kel = String(metin).split(' '), sat = '', yy = y;
    kel.forEach(function (k) { var d = sat ? sat + ' ' + k : k; if (ctx.measureText(d).width > gen && sat) { C.yazi(ctx, sat, x, yy, { boyut: boyut, renk: renk, hiza: hiza, kalin: kalin }); yy += boyut * 1.25; sat = k; } else sat = d; });
    if (sat) C.yazi(ctx, sat, x, yy, { boyut: boyut, renk: renk, hiza: hiza, kalin: kalin });
    return yy;
  }
  function cizelge(ctx, x, y, gen, basliklar, kol, satirlar, fs, sat) {
    basliklar.forEach(function (b, i) { C.yazi(ctx, b, x + gen * kol.slice(0, i).reduce(function (a, c) { return a + c; }, 0), y, { boyut: fs * 0.64, kalin: true, renk: '#93c5fd' }); });
    satirlar.forEach(function (r, j) { r.forEach(function (h, i) { C.yazi(ctx, String(h), x + gen * kol.slice(0, i).reduce(function (a, c) { return a + c; }, 0), y + sat * (j + 1), { boyut: fs * 0.62, renk: '#e2e8f0' }); }); });
  }

  // =====================================================================
  // BESİN ZİNCİRİNDE CIVA BİRİKİMİ (temsilî model)
  // =====================================================================
  var HALKA = [
    { ad: 'Su', ikon: '💧', k: 1 },
    { ad: 'Plankton', ikon: '🦠', k: 10 },
    { ad: 'Küçük balık', ikon: '🐟', k: 100 },
    { ad: 'Büyük balık', ikon: '🐠', k: 1000 },
    { ad: 'Balık yiyen insan', ikon: '🧑', k: 3000 }
  ];
  GG.simKaydet('zincir', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var atik = true, yil = 0, oynat = false, birikim = [0, 0, 0, 0, 0], kesildi = -1;
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    y.kontrol.appendChild(api.ui.anahtar({ etiket: '🏭 Fabrika atık suyu denize akıyor', deger: true, degisti: function (v) { atik = v; if (!v && yil >= 5) kesildi = yil; } }).kok);
    y.kontrol.appendChild(api.ui.dugme('▶ Yılları ilerlet', function () { oynat = !oynat; }, 'ana'));
    y.kontrol.appendChild(api.ui.dugme('Baştan', function () { yil = 0; birikim = [0, 0, 0, 0, 0]; kesildi = -1; oynat = false; }));
    api.dongu(function (dt, z) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), s = z / 1000;
      if (oynat && yil < 30) {
        var d = dt * 1.5; yil = Math.min(30, yil + d);
        // her halka bir öncekinden besleniyor; atılım yavaş (temsilî)
        var su = atik ? 1 : birikim[0] * Math.exp(-d * 1.2);
        birikim[0] = su;
        for (var i = 1; i < HALKA.length; i++) { var hedef = birikim[i - 1] * HALKA[i].k / HALKA[i - 1].k; birikim[i] += (hedef - birikim[i]) * Math.min(1, d * (0.6 - i * 0.08)); }
        if (yil >= 10 && atik) api.gozlem('birikim');
        if (kesildi >= 0 && yil - kesildi >= 5) api.gozlem('cozum');
        if (yil >= 30) oynat = false;
      }
      arkaPlan(t);
      // deniz ve fabrika
      ctx.fillStyle = 'rgba(14,116,144,0.35)'; ctx.fillRect(0, h * 0.62, w * 0.55, h * 0.38);
      C.yazi(ctx, '🏭', w * 0.04, h * 0.5, { boyut: fs * 2.2 });
      if (atik) { ctx.strokeStyle = 'rgba(148,163,184,0.8)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(w * 0.09, h * 0.56); ctx.quadraticCurveTo(w * 0.12, h * 0.62, w * 0.16, h * 0.68); ctx.stroke(); }
      C.yazi(ctx, atik ? 'cıvalı atık su' : 'atık su arıtılıyor', w * 0.13, h * 0.5, { boyut: fs * 0.7, renk: atik ? '#fca5a5' : '#86efac' });
      for (var b = 0; b < 6; b++) C.yazi(ctx, b % 2 ? '🐟' : '🐠', w * (0.2 + b * 0.055) + Math.sin(s + b) * 10, h * (0.72 + (b % 3) * 0.07), { boyut: fs * 1.2, hiza: 'center' });
      // birikim çubukları (logaritmik)
      var gx = w * 0.04, gy = h * 0.06, gw = w * 0.5, gh = h * 0.38;
      ctx.fillStyle = 'rgba(15,23,42,0.85)'; C.yd(ctx, gx, gy, gw, gh, 12); ctx.fill();
      C.yazi(ctx, 'Canlılardaki cıva miktarı (suya göre kaç kat, logaritmik)', gx + 12, gy + fs * 0.9, { boyut: fs * 0.72, kalin: true });
      var maks = Math.log10(3000) + 0.3;
      HALKA.forEach(function (hk, i) {
        var x = gx + 20 + i * (gw - 40) / HALKA.length, bw = (gw - 40) / HALKA.length - 14, kat = birikim[i] > 0 ? birikim[i] : 0;
        var oran = kat > 0.01 ? Math.max(0.02, (Math.log10(kat) + 2) / (maks + 2)) : 0;
        var yuk = (gh - fs * 4.2) * oran;
        ctx.fillStyle = i === 4 ? '#ef4444' : '#f59e0b'; ctx.fillRect(x, gy + gh - fs * 2.4 - yuk, bw, yuk);
        C.yazi(ctx, hk.ikon, x + bw / 2, gy + gh - fs * 1.5, { boyut: fs * 0.9, hiza: 'center' });
        C.yazi(ctx, hk.ad, x + bw / 2, gy + gh - fs * 0.5, { boyut: fs * 0.55, hiza: 'center', renk: '#cbd5e1' });
        if (kat > 0.01) C.yazi(ctx, '×' + GG.sayi(kat, kat < 10 ? 1 : 0), x + bw / 2, gy + gh - fs * 2.8 - yuk, { boyut: fs * 0.62, kalin: true, hiza: 'center', renk: '#fde68a' });
      });
      var px = w * 0.58, pw = w * 0.4, yy = h * 0.1;
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, px, h * 0.05, pw, h * 0.9, 12); ctx.fill();
      yy = satirla(ctx, 'Geçen süre: ' + Math.floor(yil) + ' yıl', px + 12, yy + fs * 0.4, pw - 24, fs * 1.1, '#fde047', 'left', true) + fs * 1.6;
      yy = satirla(ctx, 'Sudaki cıva çok az bile olsa her halkada canlıların vücudunda birikiyor; çünkü vücuttan atılması çok yavaş.', px + 12, yy, pw - 24, fs * 0.78, '#e2e8f0') + fs * 1.5;
      if (kesildi >= 0) yy = satirla(ctx, 'Atık ' + Math.floor(kesildi) + '. yılda durduruldu. Sudaki cıva hızla azaldı, ama büyük balıklardaki ve insandaki cıva çok daha yavaş azalıyor.', px + 12, yy, pw - 24, fs * 0.78, '#86efac') + fs * 1.5;
      satirla(ctx, 'Katsayılar temsilîdir: Gerçekte birikim, metalin türüne ve ekosisteme göre değişir.', px + 12, h * 0.86, pw - 24, fs * 0.66, '#94a3b8');
      bilgi.innerHTML = 'Besin zincirinde birikim (biyolojik büyütme) · Atık: <b>' + (atik ? 'akıyor' : 'durduruldu') + '</b>';
    });
    return {};
  });

  // =====================================================================
  // NANOPARÇACIKLARI SUDAN AYIRMA: filtreler ve topaklaştırma
  // =====================================================================
  var TANE = [
    { ad: 'Kum', boy: 1e-4, renk: '#d6b77a' },
    { ad: 'Kil', boy: 2e-6, renk: '#a16207' },
    { ad: 'Bakteri', boy: 1e-6, renk: '#22c55e' },
    { ad: 'Gümüş nanoparçacık', boy: 2e-8, renk: '#e5e7eb' }
  ];
  var FILTRE = [
    { id: 'kum', ad: 'Kum filtresi', goz: 5e-5, maliyet: 1 },
    { id: 'kagit', ad: 'Filtre kâğıdı', goz: 1e-5, maliyet: 1 },
    { id: 'mikro', ad: 'Mikrofiltre', goz: 2e-7, maliyet: 3 },
    { id: 'ultra', ad: 'Ultrafiltre', goz: 1e-8, maliyet: 8 }
  ];
  function boyYaz(m) { return m >= 1e-6 ? GG.sayi(m * 1e6, m < 1e-5 ? 1 : 0) + ' µm' : GG.sayi(m * 1e9, 0) + ' nm'; }
  GG.simKaydet('filtre', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var fl = FILTRE[0], topak = false, f = -1, denenen = {}, kayit = [];
    var bilgi = el('div'); y.ust.appendChild(bilgi);

          { metin: 'Şelatör kullanılacaksa yeraltı suyu dikkatle izlenmelidir.', dogru: true },
          { metin: 'En hızlı yöntem her zaman en sürdürülebilir yöntemdir.', geri: 'Kazı en hızlısıydı ama üst toprağı yok etti.' },
          { metin: 'Kirliliği önlemeye gerek yok; nasılsa sonradan temizlenebilir.', geri: 'Temizleme yıllar sürüyor ve pahalı. Önlemek çok daha kolay.' }
        ],
        aciklama: 'Atatürk Orman Çiftliği örneğinde olduğu gibi, toprak emek ve bilgiyle korunup iyileştirilebilir. Ama en iyisi onu kirletmemektir.'
      },
      {
        tur: 'model', etiket: 'BULGU', sahne: { model: 'b-toprak' }, baslik: 'Bulgu: Topraktaki ağır metaller',
        maddeler: [
          'Ağır metaller toprakta parçalanmaz; bitkiler yoluyla besin zincirine geçer.',
          'Bazı bitkiler metalleri topraktan alıp biriktirir (fitoremediasyon); hasat edilen bitki tehlikeli atıktır.',
          'Sürdürülebilir tarım, toprağı korumayı ve kirliliği kaynağında önlemeyi gerektirir.'
        ]
      },
      {
        tur: 'ama', baslik: 'Sıra sende',
        metin: '<p>Denizi, suyu ve toprağı korumak için büyük fabrikalar kadar bizim günlük seçimlerimiz de önemli. Kendi kimyasal ayak izine bakma zamanı.</p>'
      }
    ]
  });
})();

</script>
<script>/* js/final.js */
/* Final: Kimyasal ayak izim. Davranışları değerlendir, kendini değerlendir, eylem planı hazırla. */
'use strict';
(function () {
  var el = GG.el;
  var DAVRANIS = [
    'Biten pilleri atık pil kutusuna atarım.',
    'Süresi geçmiş ilaçları eczanedeki toplama kutusuna götürürüm.',
    'Kızartma yağını lavaboya dökmem, biriktirip toplama noktasına veririm.',
    'Eski telefon ve kabloları elektronik atık noktasına veririm.',
    'Gerekmedikçe “antibakteriyel / gümüş iyonlu” ürün almam.',
    'Meyve ve sebze kabuklarını değerlendirmenin yollarını ararım (kompost, ayrı toplama).'
  ];
  var OZ = [{ id: 'h', ad: '✔ Her zaman' }, { id: 'b', ad: '◐ Bazen' }, { id: 'd', ad: '○ Henüz değil' }];
  var EYLEM = [
    'Evde bir atık pil kutusu oluşturmak',
    'Okulda kabuk atıklarını ayrı toplama kampanyası başlatmak',
    'Ailemle atık yağ biriktirme şişesi hazırlamak',
    'Eski elektronik eşyaları toplama noktasına götürmek',
    'Antibakteriyel ürün almadan önce gerçekten gerekli mi diye düşünmek',
    'Yakındaki bir derenin ya da gölün kirlilik kaynaklarını araştırmak'
  ];
  function kacis(m) { return String(m).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  GG.finalSayfasi = function () {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(el('div', { sinif: 'ust-cubuk' }, [
      GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
      el('div', { sinif: 'ust-baslik' }, [el('span', { sinif: 'ust-yil', metin: 'FİNAL' }), el('span', { sinif: 'ust-kisi', metin: 'Kimyasal ayak izim' })])
    ]));
    var ic = el('div', { stil: 'max-width:70rem' });
    s.appendChild(ic);
    ic.appendChild(el('h1', { metin: '👣 Kimyasal ayak izim' }));
    ic.appendChild(el('p', { html: 'Fabrikalar kadar bizim günlük seçimlerimiz de suya ve toprağa karışan metalleri ve kimyasalları belirler. Buna <b>kimyasal ayak izi</b> diyoruz. Kendi ayak izini küçültecek bir plan hazırla.' }));

    function bolum(no, baslik) {
      var k = el('section', { stil: 'background:var(--yuzey);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:var(--golge)' });
      k.appendChild(el('span', { sinif: 'etiket-cip', metin: no + '. ADIM' }));
      k.appendChild(el('h2', { stil: 'margin:.4rem 0', metin: baslik }));
      ic.appendChild(k);
      return k;
    }
    function baglam(no, sonra) {
      return {
        durak: { id: 'final' }, adimNo: no, cozuldu: false,
        hazir: function (v) { if (v !== false && sonra) { var f = sonra; sonra = null; f(); } },
        ilkDeneme: function () {}, gozlemVar: function () { return false; }, gozlemDinle: function () {}, tahminBul: function () { return null; }
      };
    }
    function kaydir(k) { setTimeout(function () { k.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); }

    // 1. adım: davranışları grupla
    var b1 = bolum(1, 'Ayak izini büyüten ve küçülten davranışlar');
    b1.appendChild(GG.adimTurleri.siniflandir({
      soru: 'Bu davranışlar kimyasal ayak izini nasıl etkiler?',
      kutular: [{ id: 'k', ad: '🌱 Ayak izini küçültür' }, { id: 'b', ad: '⚠ Ayak izini büyütür' }],
      kartlar: [
        { metin: 'Biten pilleri atık pil kutusuna atmak', kutu: 'k' },
        { metin: 'Kızartma yağını toplama noktasına vermek', kutu: 'k' },
        { metin: 'Elektronik eşyayı tamir ettirip daha uzun kullanmak', kutu: 'k', geri: 'Daha az yeni cihaz, daha az metal madenciliği ve elektronik atık demektir.' },
        { metin: 'Floresan ampulü tehlikeli atık noktasına vermek', kutu: 'k' },
        { metin: 'Kullanılmayan ilaçları tuvalete dökmek', kutu: 'b', geri: 'İlaçlar atık suyla dereye ve denize karışır.' },
        { metin: 'Eski telefonu evsel çöpe atmak', kutu: 'b', geri: 'Telefondaki metaller toprağa ve suya karışabilir; değerli metaller de geri kazanılamaz.' },
        { metin: 'Bahçeye etiketteki dozdan fazla gübre ve ilaç atmak', kutu: 'b', geri: 'Fazlası toprakta birikir ya da suya karışır.' }
      ],
      aciklama: 'Küçük günlük seçimler, milyonlarca insanda bir araya gelince büyük bir fark yaratır.'
    }, baglam(0, ikinci)));

    // 2. adım: öz değerlendirme
    function ikinci() {
      var b2 = bolum(2, 'Kendini değerlendir');
      kaydir(b2);
      b2.appendChild(el('p', { html: 'Bu davranışları ne sıklıkla yapıyorsun? <b>Doğru ya da yanlış cevap yok.</b>' }));
      b2.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Akıllı tahtada bir örnek üzerinde birlikte konuşun; her öğrenci kendi değerlendirmesini defterine de yazabilir.' }));
      var oz = GG.durum.oz || {};
      var ozet = el('div'), devam = null;
      DAVRANIS.forEach(function (d, i) {
        var satir = el('div', { stil: 'display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.45rem 0;border-bottom:1px solid var(--cizgi)' });
        satir.appendChild(el('div', { stil: 'flex:1 1 22rem', html: (i + 1) + '. ' + d }));
        satir.appendChild(GG.ui.secici({ secenekler: OZ, deger: oz[i] || '', degisti: function (v) { oz[i] = v; GG.durum.oz = oz; GG.kaydet(); boya(); } }).kok);
        b2.appendChild(satir);
      });
      b2.appendChild(ozet);
      function boya() {
        GG.bosalt(ozet);
        var n = Object.keys(oz).length;
        if (n < DAVRANIS.length) { ozet.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Değerlendirilen davranış: ' + n + ' / ' + DAVRANIS.length })); return; }
        var gelis = DAVRANIS.filter(function (d, i) { return oz[i] !== 'h'; });
        var k = el('div', { sinif: 'geri-bildirim iyi' });
        k.appendChild(el('div', { html: gelis.length ? '<b>Geliştirmek istediğin davranışlar:</b>' : '<b>Harika!</b> Şimdi bu davranışları çevrene yayma zamanı.' }));
        if (gelis.length) { var ul = el('ul', { stil: 'margin:.3rem 0' }); gelis.forEach(function (d) { ul.appendChild(el('li', { html: d })); }); k.appendChild(ul); }
        ozet.appendChild(k);
        if (!devam) { devam = GG.ui.dugme('Eylem planına geç ▶', function () { devam.disabled = true; ucuncu(); }, 'ana'); b2.appendChild(el('div', { stil: 'margin-top:.6rem' }, devam)); }
      }
      boya();
    }

    // 3. adım: eylem planı
    function ucuncu() {
      var b3 = bolum(3, 'Eylem planım');
      kaydir(b3);
      b3.appendChild(el('p', { html: 'En çok üç eylem seç ve yakın çevrendeki bir ekosistem için bir öneri yaz. Planını yazdırıp sınıf panosuna asabilirsin.' }));
      var secili = {};
      var liste = el('div');
      EYLEM.forEach(function (e, i) {
        var d = el('button', { sinif: 'secenek', type: 'button', html: '☐ ' + e });
        d.addEventListener('click', function () {
          if (!secili[i] && Object.keys(secili).length >= 3) return;
          if (secili[i]) delete secili[i]; else secili[i] = 1;
          d.innerHTML = (secili[i] ? '☑ ' : '☐ ') + e; d.classList.toggle('secili', !!secili[i]); ciz();
        });
        liste.appendChild(d);
      });
      b3.appendChild(liste);
      var oneri = el('textarea', { rows: 2, stil: 'width:100%;font-size:1rem;padding:.4rem;border-radius:8px;border:1px solid var(--cizgi);font-family:inherit;box-sizing:border-box', 'aria-label': 'Ekosistem önerisi', placeholder: 'Örnek: Okulun yanındaki derenin kenarına atık pil kutusu konmasını belediyeye önereceğim.' });
      oneri.addEventListener('input', ciz);
      b3.appendChild(el('label', { stil: 'display:block;margin:.6rem 0' }, [el('b', { metin: 'Yakın çevremdeki bir ekosistem için önerim' }), oneri]));
      var kart = el('div');
      b3.appendChild(kart);
      var bitirildi = false;
      b3.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem' }, [
        GG.ui.dugme('🖨 Yazdır', yazdir),
        GG.ui.dugme('Planı tamamla ✔', function () { if (!bitirildi) { bitirildi = true; bitti(); } }, 'ana')
      ]));
      function kartHtml() {
        var eylemler = Object.keys(secili).map(function (i) { return '<li>' + kacis(EYLEM[i]) + '</li>'; }).join('');
        return '<div style="background:#047857;color:#fff;border-radius:18px;padding:1.3rem 1.5rem;font-family:inherit;max-width:44rem">' +
          '<div style="font-size:2.4rem">👣🌱</div><div style="font-size:1.8rem;font-weight:800;margin:.2rem 0 .6rem">Kimyasal ayak izimi küçültüyorum</div>' +
          '<div style="background:rgba(255,255,255,.15);border-radius:12px;padding:.6rem .9rem"><b>Eylemlerim</b><ul style="margin:.3rem 0 0">' + (eylemler || '<li>…</li>') + '</ul></div>' +
          '<div style="background:#fff;color:#172031;border-radius:12px;padding:.6rem .9rem;margin-top:.6rem"><b>Ekosistem önerim:</b> ' + (kacis(oneri.value) || '…') + '</div>' +
          '<div style="font-size:.85rem;opacity:.9;margin-top:.6rem">Sürdürülebilir kalkınma amaçları 12, 14 ve 15 · Yeşil kimya: önce önle</div></div>';
      }
      function ciz() { kart.innerHTML = kartHtml(); }
      function yazdir() {
        var w = window.open('', '_blank');
        if (!w) { api(); return; }
        w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Eylem planım</title><style>body{font-family:system-ui,sans-serif;margin:2rem;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>' + kartHtml() + '<script>setTimeout(function(){print()},300)<\/script></body></html>');
        w.document.close();
      }
      function api() { GG.bosalt(kart); kart.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Yeni pencere açılamadı. Tarayıcının açılır pencere iznini kontrol edin.' })); setTimeout(ciz, 2500); }
      ciz();
    }

    function bitti() {
      GG.durum.tamam.final = true; GG.kaydet();
      var k = el('section', { stil: 'background:linear-gradient(135deg,#0f2e25,#047857);color:#fff;border-radius:14px;padding:1.2rem 1.4rem;margin:1rem 0' });
      k.appendChild(el('h2', { stil: 'margin:.2rem 0 .5rem', metin: '🎉 Planın hazır!' }));
      k.appendChild(el('p', { html: 'Çöpe gidecek kabuklardan nanoparçacık elde ettin; metallerin ve nanoparçacıkların suda ve toprakta nasıl biriktiğini gördün; çözümleri değerlendirdin. Sürdürülebilir kimyanın ilk kuralı: <b>Önce önle.</b>' }));
      k.appendChild(el('p', { html: 'Performans görevi önerisi: Yakın çevrendeki bir ekosistemde metallerin, alaşımların ya da nanoparçacıkların yol açabileceği bir problemi belirle, etkilerini özetle, çözüm öner ve önerini değerlendir.' }));
      k.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem' }, [
        GG.ui.dugme(GG.OYUN.muze.dugme, function () { GG.git('muze'); }),
        GG.ui.dugme('Haritaya dön', function () { GG.git(''); })
      ]));
      ic.appendChild(k);
      kaydir(k);
    }
    return s;
  };
})();

</script>

<script>GG.baslat();</script>
