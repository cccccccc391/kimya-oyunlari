    { id: 'demir', ad: 'Çelik kaşık', ikon: '🥄', tur: 'metalik', renk: '#cbd5e1', cekic: ['dovulur', 'Ezildi, şekil aldı ama kırılmadı: dövülebilir.'], ilet: [true, 'Katı hâlde iletir.'], isit: ['kristal', 1538, 'Demir 1538 °C’de erir.'], su: [false, false, 'Suda çözünmez.'] },
    { id: 'elmas', ad: 'Elmas', ikon: '💎', tur: 'kovalent', renk: '#e0f2fe', cekic: ['sert', 'Çok sert; çizilmez. Sert bir darbeyle kırılabilir.'], ilet: [false, 'İletmez.'], isit: ['yok', 0, 'Normal basınçta erimez; havada yaklaşık 700–900 °C’de yanarak CO₂’ye dönüşür.'], su: [false, false, 'Suda çözünmez.'] },
    { id: 'grafit', ad: 'Kurşun kalem ucu (grafit)', ikon: '✏️', tur: 'kovalent', renk: '#52525b', cekic: ['kayar', 'Yumuşak; katmanlar kayıp dağılır. Kâğıtta iz bırakır.'], ilet: [true, 'İletir!'], isit: ['yok', 0, 'Normal basınçta erimez; çok yüksek sıcaklıkta süblimleşir.'], su: [false, false, 'Suda çözünmez.'] },
    { id: 'buz', ad: 'Buz', ikon: '🧊', tur: 'molekuler', renk: '#bae6fd', cekic: ['kirilir', 'Kırıldı; parçalar dağıldı.'], ilet: [false, 'İletmez.'], isit: ['kristal', 0, '0 °C’de belirli bir sıcaklıkta erir.'], su: [null, null, 'Erir ve suya karışır (kendisi de su).'] },
    { id: 'iyot', ad: 'İyot', ikon: '🟣', tur: 'molekuler', renk: '#6b21a8', cekic: ['ufalanir', 'Kolayca ufalandı: yumuşak ve kırılgan.'], ilet: [false, 'İletmez.'], isit: ['kristal', 114, 'Isıtınca mor buhar çıkarır; kapalı kapta 114 °C’de erir.'], su: [false, false, 'Suda çok az çözünür; çözeltisi iletmez.'] },
    { id: 'seker', ad: 'Şeker', ikon: '🍬', tur: 'molekuler', renk: '#fefce8', cekic: ['kirilir', 'Kırılıp toz oldu.'], ilet: [false, 'İletmez.'], isit: ['bozunur', 186, 'Erimeye başlarken bozunur ve karamelleşir (yaklaşık 186 °C).'], su: [true, false, 'Çözünür ama çözeltisi elektriği iletmez.'] },
    { id: 'cam', ad: 'Cam', ikon: '🪟', tur: 'amorf', renk: '#a5f3fc', cekic: ['kirilir', 'Keskin kenarlı parçalara kırıldı.'], ilet: [false, 'İletmez.'], isit: ['amorf', 0, 'Belirli bir erime noktası yok; ısıtıldıkça giderek yumuşar.'], su: [false, false, 'Suda çözünmez.'] }
  ];
  var TESTLER = [{ id: 'cekic', ad: '🔨 Çekiçle vur' }, { id: 'ilet', ad: '💡 İletkenlik' }, { id: 'isit', ad: '🔥 Isıt' }, { id: 'su', ad: '💧 Suda çöz' }];
  GG.simKaydet('katilar', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var ornek = KATI[0], test = TESTLER[0], kayit = {}, son = null, anim = 1;
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Örnek', deger: ornek.id, secenekler: KATI.map(function (k) { return { id: k.id, ad: k.ikon + ' ' + k.ad.replace(' (grafit)', '') }; }), degisti: function (v) { ornek = KATI.filter(function (k) { return k.id === v; })[0]; } }).kok);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Test', deger: test.id, secenekler: TESTLER, degisti: function (v) { test = TESTLER.filter(function (q) { return q.id === v; })[0]; } }).kok);
    y.kontrol.appendChild(api.ui.dugme('▶ Testi yap', function () {
      son = { o: ornek, t: test }; anim = 0; kayit[ornek.id + '|' + test.id] = 1;
      var orn = {}; Object.keys(kayit).forEach(function (k) { orn[k.split('|')[0]] = 1; });
      if (Object.keys(orn).length >= 6) api.gozlem('ornek6');
      if (kayit['cam|isit']) api.gozlem('cam');
      if (kayit['tuz|su'] && kayit['tuz|ilet']) api.gozlem('tuz');
      if (kayit['grafit|ilet'] && kayit['elmas|ilet']) api.gozlem('karbon');
    }, 'ana'));
    function sonucKisa(o, tid) {
      if (tid === 'cekic') return { kirilir: 'kırılgan', dovulur: 'dövülür', sert: 'çok sert', kayar: 'yumuşak, kayar', ufalanir: 'ufalanır' }[o.cekic[0]];
      if (tid === 'ilet') return o.ilet[0] ? 'iletir' : 'iletmez';
      if (tid === 'isit') return o.isit[0] === 'kristal' ? o.isit[1] + ' °C' : ({ yok: 'erimez', bozunur: 'bozunur', amorf: 'yumuşar' }[o.isit[0]]);
      return o.su[0] === null ? '—' : (o.su[0] ? 'çözünür' + (o.su[1] ? ', iletir' : ', iletmez') : 'çözünmez');
    }
    api.dongu(function (dt, zaman) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), s = zaman / 1000;
      anim = Math.min(1, anim + dt / 2.5);
      arkaPlan(t);
      var cx = w * 0.22, cy = h * 0.42, u = Math.min(w * 0.08, h * 0.14);
      if (son) {
        var o = son.o, tid = son.t.id, e = anim;
        C.yazi(ctx, o.ikon + ' ' + o.ad, cx, h * 0.07, { boyut: fs, kalin: true, hiza: 'center' });
        if (tid === 'cekic') {
          var vur = e < 0.3 ? e / 0.3 : 1;
          var tip = o.cekic[0];
          if (e < 0.3 || tip === 'sert') { ctx.fillStyle = o.renk; ctx.fillRect(cx - u, cy, u * 2, u * 0.6); }
          else if (tip === 'dovulur') { ctx.fillStyle = o.renk; ctx.fillRect(cx - u * 1.5, cy + u * 0.2, u * 3, u * 0.4); }
          else if (tip === 'kayar') { for (var k = 0; k < 6; k++) { ctx.fillStyle = o.renk; ctx.fillRect(cx - u + k * u * 0.25 * e, cy + k * u * 0.1, u * 1.4, u * 0.08); } }
          else { for (var k2 = 0; k2 < 14; k2++) { ctx.fillStyle = o.renk; ctx.save(); ctx.translate(cx + Math.sin(k2 * 2.1) * u * 1.4 * e, cy + u * 0.3 + Math.cos(k2 * 1.3) * u * 0.25); ctx.rotate(k2); ctx.fillRect(-u * 0.15, -u * 0.1, u * 0.3, u * 0.2); ctx.restore(); } }
          C.yazi(ctx, '🔨', cx + u * 0.3, cy - u * 1.2 + vur * u * 0.8, { boyut: u * 1.1, hiza: 'center' });
        } else if (tid === 'ilet') {
          ctx.fillStyle = o.renk; ctx.fillRect(cx - u * 0.6, cy, u * 1.2, u * 0.5);
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - u * 0.6, cy + u * 0.25); ctx.lineTo(cx - u * 1.6, cy + u * 0.25); ctx.lineTo(cx - u * 1.6, cy - u * 1.2); ctx.lineTo(cx + u * 1.6, cy - u * 1.2); ctx.lineTo(cx + u * 1.6, cy + u * 0.25); ctx.lineTo(cx + u * 0.6, cy + u * 0.25); ctx.stroke();
          C.yazi(ctx, '🔋', cx - u * 1.6, cy - u * 0.5, { boyut: u * 0.6, hiza: 'center' });
          var yan = o.ilet[0] && e > 0.3;
          if (yan) { var g = ctx.createRadialGradient(cx, cy - u * 1.2, 0, cx, cy - u * 1.2, u); g.addColorStop(0, 'rgba(253,224,71,0.8)'); g.addColorStop(1, 'rgba(253,224,71,0)'); ctx.fillStyle = g; ctx.fillRect(cx - u, cy - u * 2.2, u * 2, u * 2); }
          C.yazi(ctx, '💡', cx, cy - u * 1.2, { boyut: u * 0.7, hiza: 'center' });
          if (!yan && e > 0.3) C.yazi(ctx, 'lamba yanmadı', cx, cy - u * 2, { boyut: fs * 0.75, hiza: 'center', renk: '#94a3b8' });
        } else if (tid === 'isit') {
          // sıcaklık–zaman grafiği
          var gx = w * 0.04, gy = h * 0.14, gw = w * 0.42, gh = h * 0.56;
          ctx.fillStyle = 'rgba(15,23,42,0.85)'; C.yd(ctx, gx, gy, gw, gh, 10); ctx.fill();
          var px0 = gx + 30, px1 = gx + gw - 12, py0 = gy + gh - 22, py1 = gy + 14;
          ctx.strokeStyle = '#475569'; ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px0, py0); ctx.lineTo(px1, py0); ctx.stroke();
          C.yazi(ctx, 'sıcaklık', px0 + 4, py1 + 6, { boyut: fs * 0.6, renk: '#94a3b8' });
          C.yazi(ctx, 'zaman →', px1, py0 + 12, { boyut: fs * 0.6, hiza: 'right', renk: '#94a3b8' });
          ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3; ctx.beginPath();
          var tip2 = o.isit[0];
          for (var q = 0; q <= e; q += 0.01) {
            var yv;
            if (tip2 === 'kristal') yv = q < 0.35 ? q / 0.35 * 0.5 : (q < 0.7 ? 0.5 : 0.5 + (q - 0.7) / 0.3 * 0.45);
            else if (tip2 === 'amorf') yv = 0.9 * (1 - Math.exp(-q * 2.2)) * (1 + 0.1 * q);
            else yv = q * 0.9;
            var X = px0 + q * (px1 - px0), Y = py0 - yv * (py0 - py1);
            if (q === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.stroke();
          if (tip2 === 'kristal' && e > 0.4) { C.yazi(ctx, 'erime: ' + o.isit[1] + ' °C (sıcaklık sabit kaldı)', px0 + (px1 - px0) * 0.36, py0 - 0.5 * (py0 - py1) - 12, { boyut: fs * 0.68, kalin: true, renk: '#fde68a' }); }
          if (tip2 === 'amorf' && e > 0.6) C.yazi(ctx, 'düz bir basamak yok: giderek yumuşadı', px0 + (px1 - px0) * 0.25, py0 - 0.3 * (py0 - py1), { boyut: fs * 0.68, kalin: true, renk: '#fde68a' });
          if (o.id === 'iyot' && e > 0.2) for (var v = 0; v < 12; v++) C.daire(ctx, gx + gw * 0.8 + Math.sin(v * 3 + s * 2) * 20, gy + gh * 0.5 - ((s * 0.4 + v / 12) % 1) * gh * 0.4, 7, 'rgba(147,51,234,0.45)');
        } else {
          var bx = cx - u, by = cy - u * 0.5, bw = u * 2, bh = u * 1.5;
          ctx.fillStyle = 'rgba(96,165,250,0.35)'; ctx.fillRect(bx, by + bh * 0.25, bw, bh * 0.75);
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
          var coz = o.su[0];
          var kalan = coz ? 1 - e : 1;
          ctx.fillStyle = o.renk; ctx.globalAlpha = Math.max(0, kalan); ctx.fillRect(cx - u * 0.3, by + bh - u * 0.3, u * 0.6, u * 0.25); ctx.globalAlpha = 1;
          if (coz && e > 0.5) { var lamba = o.su[1]; C.yazi(ctx, lamba ? '💡 çözelti iletiyor' : 'çözelti iletmiyor', cx, by - fs * 0.8, { boyut: fs * 0.8, kalin: true, hiza: 'center', renk: lamba ? '#fde047' : '#94a3b8' }); }
        }
        if (e > 0.5) {
          var metin = tid === 'cekic' ? o.cekic[1] : (tid === 'ilet' ? o.ilet[1] : (tid === 'isit' ? o.isit[2] : o.su[2]));
          satirla(ctx, metin, cx, h * 0.8, w * 0.4, fs * 0.85, '#fde68a', 'center', true);
        }
      } else C.yazi(ctx, 'Bir örnek ve bir test seç, “Testi yap”a dokun.', cx, h * 0.4, { boyut: fs * 0.9, hiza: 'center', renk: '#94a3b8' });
      // veri tablosu
      var tx = w * 0.48, tw = w * 0.5, ty = h * 0.06, sat = Math.min(fs * 1.8, h * 0.85 / (KATI.length + 1.6));
      var kol = [0.34, 0.165, 0.165, 0.165, 0.165];
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, tx - 8, ty - 6, tw + 6, sat * (KATI.length + 1.6), 10); ctx.fill();
      ['Örnek', 'Çekiç', 'İletkenlik', 'Isıtma', 'Suda'].forEach(function (b, i) { C.yazi(ctx, b, tx + tw * kol.slice(0, i).reduce(function (a, c) { return a + c; }, 0), ty + sat * 0.5, { boyut: fs * 0.7, kalin: true, renk: '#93c5fd' }); });
      KATI.forEach(function (o, r) {
        var yy = ty + sat * (r + 1.5);
        C.yazi(ctx, o.ikon + ' ' + o.ad.replace(' (grafit)', ''), tx, yy, { boyut: fs * 0.66, renk: '#f1f5f9' });
        TESTLER.forEach(function (q, c) {
          if (!kayit[o.id + '|' + q.id]) return;
          C.yazi(ctx, sonucKisa(o, q.id), tx + tw * kol.slice(0, c + 1).reduce(function (a, cc) { return a + cc; }, 0), yy, { boyut: fs * 0.6, renk: '#e2e8f0' });
        });
      });
      bilgi.innerHTML = 'Örnek: <b>' + ornek.ad + '</b> · Test: <b>' + test.ad + '</b> · Kayıtlı sonuç: <b>' + Object.keys(kayit).length + '</b>';
    });
    return {};
  });
})();

<script>/* js/simler/s3.js */
/* Çeşitliliğin Sırrı — 3. bölüm deneyleri: buhar basıncı, kaynama, viskozite, kılcallık, yüzey gerilimi */
'use strict';
(function () {
  var el = GG.el, C = GG.ciz;
  function arkaPlan(t, ust, alt) {
    var g = t.ctx.createLinearGradient(0, 0, 0, t.h);
    g.addColorStop(0, ust || '#10192c'); g.addColorStop(1, alt || '#0a0f1b');
    t.ctx.fillStyle = g; t.ctx.fillRect(0, 0, t.w, t.h);
  }
  function satirla(ctx, metin, x, y, gen, boyut, renk, hiza, kalin) {
    ctx.font = GG.font(boyut, kalin);
    var kel = String(metin).split(' '), sat = '', yy = y;
    kel.forEach(function (k) { var d = sat ? sat + ' ' + k : k; if (ctx.measureText(d).width > gen && sat) { C.yazi(ctx, sat, x, yy, { boyut: boyut, renk: renk, hiza: hiza, kalin: kalin }); yy += boyut * 1.25; sat = k; } else sat = d; });
    if (sat) C.yazi(ctx, sat, x, yy, { boyut: boyut, renk: renk, hiza: hiza, kalin: kalin });
    return yy;
  }
  function tablo(ctx, x, y, gen, basliklar, kol, satirlar, fs, sat) {
    basliklar.forEach(function (b, i) { C.yazi(ctx, b, x + gen * kol.slice(0, i).reduce(function (a, c) { return a + c; }, 0), y, { boyut: fs * 0.66, kalin: true, renk: '#93c5fd' }); });
    satirlar.forEach(function (r, j) { r.forEach(function (h, i) { C.yazi(ctx, String(h), x + gen * kol.slice(0, i).reduce(function (a, c) { return a + c; }, 0), y + sat * (j + 1), { boyut: fs * 0.64, renk: '#e2e8f0' }); }); });
  }
  // Antoine denklemi (P: mmHg, T: °C)
  var ANT = {
    su: { ad: 'Su', A: 8.07131, B: 1730.63, C: 233.426, A2: 8.14019, B2: 1810.94, C2: 244.485, renk: '#60a5fa' },
    etanol: { ad: 'Etanol', A: 8.20417, B: 1642.89, C: 230.3, renk: '#a5f3fc' },
    aseton: { ad: 'Aseton', A: 7.02447, B: 1161.0, C: 224.0, renk: '#e9d5ff' },
    eter: { ad: 'Dietil eter', A: 6.92032, B: 1064.07, C: 228.8, renk: '#fef08a' }
  };
  function bp(id, T) { var a = ANT[id]; if (id === 'su' && T > 100) return Math.pow(10, a.A2 - a.B2 / (a.C2 + T)); return Math.pow(10, a.A - a.B / (a.C + T)); }
  function kaynamaT(id, P) { var a = ANT[id]; if (id === 'su' && P > 760) return a.B2 / (a.A2 - Math.log10(P)) - a.C2; return a.B / (a.A - Math.log10(P)) - a.C; }

  // =====================================================================
  // BUHAR BASINCI: kapalı kapta denge buhar basıncı
  // =====================================================================
  GG.simKaydet('buhar', function (kap, api) {
    var y = api.yerlesim();
    var t = api.tuval(y.tuvalKap), ctx = t.ctx;
    var sivi = 'su', T = 25, miktar = 50, genis = false, P = 0, zaman = 0, calis = false, kayit = [];
    var bilgi = el('div'); y.ust.appendChild(bilgi);
    function sifirla() { P = 0; zaman = 0; calis = false; }
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Sıvı', deger: sivi, secenekler: Object.keys(ANT).map(function (k) { return { id: k, ad: ANT[k].ad }; }), degisti: function (v) { sivi = v; sifirla(); } }).kok);
    y.kontrol.appendChild(api.ui.kaydirici({ etiket: 'Sıcaklık', min: 0, max: 40, adim: 5, deger: T, bicim: function (v) { return v + ' °C'; }, degisti: function (v) { T = v; sifirla(); } }).kok);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Sıvı miktarı', deger: String(miktar), secenekler: [{ id: '10', ad: '10 mL' }, { id: '50', ad: '50 mL' }, { id: '100', ad: '100 mL' }], degisti: function (v) { miktar = Number(v); sifirla(); } }).kok);
    y.kontrol.appendChild(api.ui.secici({ etiket: 'Sıvı yüzeyi', deger: 'dar', secenekler: [{ id: 'dar', ad: 'Dar kap' }, { id: 'genis', ad: 'Geniş kap' }], degisti: function (v) { genis = v === 'genis'; sifirla(); } }).kok);
    y.kontrol.appendChild(api.ui.dugme('▶ Havayı boşalt, sıvıyı ekle', function () { sifirla(); calis = true; }, 'ana'));
    y.kontrol.appendChild(api.ui.dugme('📋 Kaydet', function () {
      var peq = bp(sivi, T);
      if (!calis || P < peq * 0.985) { api.bildir('Basınç hâlâ değişiyor. Önce dengenin kurulmasını bekle.'); return; }
      kayit.push({ s: sivi, T: T, m: miktar, g: genis, P: peq });
      var ayniT = {}; kayit.forEach(function (k) { if (k.T === T) ayniT[k.s] = 1; });
      if (Object.keys(ayniT).length >= 3) api.gozlem('sivi3');
      var sic = {}; kayit.forEach(function (k) { if (k.s === sivi) sic[k.T] = 1; });
      if (Object.keys(sic).length >= 2) api.gozlem('sicaklik');
      var benzer = kayit.filter(function (k) { return k.s === sivi && k.T === T; });
      if (benzer.some(function (k) { return k.m !== miktar || k.g !== genis; })) api.gozlem('miktar');
    }));
    api.dongu(function (dt, z) {
      var w = t.w, h = t.h, fs = GG.yaziBoyu(t), peq = bp(sivi, T), s = z / 1000;
      if (calis) { zaman += dt; P = peq * (1 - Math.exp(-zaman * (genis ? 1.6 : 0.7))); }
      arkaPlan(t);
      // kap
      var kx = w * 0.08, ky = h * 0.12, kw = genis ? w * 0.3 : w * 0.17, kh = h * 0.62;
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.strokeRect(kx, ky, kw, kh);
      var sy = ky + kh - kh * 0.45 * (miktar / 100) * (genis ? 0.55 : 1) - 4;
      ctx.fillStyle = ANT[sivi].renk; ctx.globalAlpha = 0.55; ctx.fillRect(kx + 2, sy, kw - 4, ky + kh - sy - 2); ctx.globalAlpha = 1;
      // buhar tanecikleri
      var n = calis ? Math.min(160, Math.round(P / 6)) : 0;
      for (var i = 0; i < n; i++) {
        var px = kx + 6 + ((i * 97.3 + s * (20 + i % 7 * 9)) % (kw - 12)), py = ky + 6 + ((i * 53.1 + s * (15 + i % 5 * 11)) % (sy - ky - 12));
        C.daire(ctx, px, py, 2.6, '#e2e8f0');
      }
      C.yazi(ctx, ANT[sivi].ad + ' · ' + miktar + ' mL · ' + T + ' °C', kx, ky - fs * 0.7, { boyut: fs * 0.8, kalin: true });
      // gösterge
      var gx = kx + kw + w * 0.03;
      C.yazi(ctx, 'Basınç ölçer', gx, ky + fs, { boyut: fs * 0.75, renk: '#94a3b8' });
      C.yazi(ctx, GG.sayi(P, P < 100 ? 1 : 0) + ' mmHg', gx, ky + fs * 2.4, { boyut: fs * 1.3, kalin: true, renk: '#fde047' });
      C.yazi(ctx, '(' + GG.sayi(P * 0.133322, 2) + ' kPa)', gx, ky + fs * 3.7, { boyut: fs * 0.75, renk: '#cbd5e1' });
      var denge = calis && P >= peq * 0.985;
      C.yazi(ctx, calis ? (denge ? '✔ Denge kuruldu: buharlaşma = yoğunlaşma' : 'Buharlaşıyor… basınç artıyor') : 'Başlatmak için düğmeye dokun', gx, ky + fs * 5.2, { boyut: fs * 0.75, kalin: true, renk: denge ? '#86efac' : '#cbd5e1' });
      if (calis) C.yazi(ctx, 'Geçen süre: ' + GG.sayi(zaman * 2, 0) + ' dk (hızlandırılmış)', gx, ky + fs * 6.5, { boyut: fs * 0.68, renk: '#94a3b8' });
      // tablo
      var tx = w * 0.6, tw = w * 0.38;
      ctx.fillStyle = 'rgba(15,23,42,0.88)'; C.yd(ctx, tx, h * 0.04, tw, h * 0.92, 12); ctx.fill();
      C.yazi(ctx, 'Veri tablosu', tx + 12, h * 0.04 + fs, { boyut: fs * 0.85, kalin: true, renk: '#fde68a' });
      tablo(ctx, tx + 12, h * 0.04 + fs * 2.3, tw - 24, ['Sıvı', 'T (°C)', 'Miktar', 'Kap', 'P (mmHg)'], [0.3, 0.15, 0.17, 0.16, 0.22],
        kayit.slice(-14).map(function (k) { return [ANT[k.s].ad, k.T, k.m + ' mL', k.g ? 'geniş' : 'dar', GG.sayi(k.P, k.P < 100 ? 1 : 0)]; }), fs, fs * 1.15);
      bilgi.innerHTML = 'Kapalı kapta denge buhar basıncı ölçümü · Kayıt: <b>' + kayit.length + '</b>';
    });
    return {};
  });

  // =====================================================================
  // KAYNAMA: dış basınç ve sıvı türü
  // =====================================================================
  var YER = [
    { id: 'deniz', ad: 'Deniz kenarı', P: 760 },

<script>/* js/final.js */
/* Final: Gizemli maddeler. Özelliklerden tanecikler arası etkileşime giden yolu kullan. */
'use strict';
(function () {
  var el = GG.el;

  GG.finalSayfasi = function () {
    var s = el('div', { sinif: 'sayfa' });

      GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),

    var ic = el('div', { stil: 'max-width:70rem' });
    s.appendChild(ic);
    ic.appendChild(el('h1', { metin: '🔎 Gizemli maddeler' }));
    ic.appendChild(el('p', { html: 'Laboratuvarda etiketleri kaybolmuş örnekler var. Elinde yalnızca ölçümler var. Oyunda keşfettiklerini kullanarak her maddenin <b>taneciklerini neyin bir arada tuttuğunu</b> bul.' }));

    function bolum(no, baslik) {
      var k = el('section', { stil: 'background:var(--yuzey);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:var(--golge)' });
      k.appendChild(el('span', { sinif: 'etiket-cip', metin: no + '. ADIM' }));
      k.appendChild(el('h2', { stil: 'margin:.4rem 0', metin: baslik }));
      ic.appendChild(k);
      return k;
    }
    function baglam(no, sonra) {
      return {
        durak: { id: 'final' }, adimNo: no, cozuldu: false,
        hazir: function (v) { if (v !== false && sonra) { var f = sonra; sonra = null; f(); } },
        ilkDeneme: function () {}, gozlemVar: function () { return false; }, gozlemDinle: function () {}, tahminBul: function () { return null; }
      };
    }
    function kaydir(k) { setTimeout(function () { k.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); }

    var b1 = bolum(1, 'Gizemli katılar');

      soru: 'Her gizemli maddeyi ölçümlerine bakarak doğru katı türüne yerleştir.',

      GG.durum.tamam.final = true; GG.kaydet();
