<style>
/* Tepkimenin İzinde — akıllı tahta için büyük, okunaklı arayüz */
:root {
  --kagit: #f5f1e8;
  --yuzey: #ffffff;
  --yuzey2: #faf8f3;
  --murekkep: #172031;
  --soluk: #586172;
  --cizgi: #e0d8c6;
  --b1: #b4532a;
  --b2: #1f7a55;
  --b3: #2456c4;
  --b4: #6a3ea1;
  --renk: #2456c4;
  --dogru: #15803d;
  --dogru-a: #dcfce7;
  --yanlis: #c2410c;
  --yanlis-a: #ffedd5;
  --bilgi-a: #e6eefc;
  --sim: #0b1220;
  --sim2: #131c2e;
  --sim-cizgi: #2c3a57;
  --golge: 0 2px 12px rgba(23, 32, 49, .09);
  --r: 14px;
}

* { box-sizing: border-box; }
html { font-size: clamp(15px, calc(0.55vw + 0.62vh + 5px), 28px); }
html, body { margin: 0; height: 100%; }
body {
  background: var(--kagit);
  color: var(--murekkep);
  font-family: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
#uygulama { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
sup, sub { line-height: 0; }

/* ---------- Düğmeler ---------- */
.dugme {
  font-weight: 650;
  border-radius: 12px;
  padding: .5em 1.05em;
  min-height: 2.5rem;
  border: 2px solid var(--murekkep);
  background: var(--yuzey);
  color: var(--murekkep);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .08s, background .15s;
}
.dugme:active { transform: scale(.97); }
.dugme:disabled { opacity: .38; cursor: default; transform: none; }
.dugme.ana { background: var(--renk); border-color: var(--renk); color: #fff; }
.dugme.sade { border-color: transparent; background: transparent; text-decoration: underline; font-weight: 600; color: var(--soluk); }
.dugme.kucuk { min-height: 2rem; padding: .25em .7em; font-size: .85rem; }
.dugme:focus-visible, .secenek:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

/* ---------- Üst çubuk ---------- */
.ust-cubuk {
  display: flex; align-items: center; gap: .7rem;
  padding: .45rem .8rem;
  background: var(--yuzey);
  border-bottom: 1px solid var(--cizgi);
  flex: 0 0 auto;
  min-height: 3.2rem;
}
.ust-baslik { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: .6rem; overflow: hidden; }
.ust-cubuk .dugme { white-space: nowrap; flex-shrink: 0; }
.ust-yil { font-weight: 900; color: var(--renk); font-size: 1.15rem; white-space: nowrap; }
.ust-kisi { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.ust-soru { color: var(--soluk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adim-seridi { display: flex; gap: .25rem; flex-wrap: nowrap; flex-shrink: 1; min-width: 0; overflow: hidden; }
.adim-nokta {
  border: 0; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  padding: .22em .55em; border-radius: 999px;
  font-size: .68rem; font-weight: 800; letter-spacing: .03em;
  background: #ece6d9; color: #7a7364;
}
.adim-nokta.gecti { background: #d8d0bf; color: #3d372b; }
.adim-nokta.aktif { background: var(--renk); color: #fff; }

/* ---------- Durak gövdesi ---------- */
.durak-govde {
  flex: 1 1 auto; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.75fr) minmax(19rem, 1fr);
  gap: .75rem;
  padding: .75rem;
}
.sahne {
  position: relative;
  background: var(--sim);
  color: #e6edf7;
  border-radius: var(--r);
  overflow: hidden;
  display: flex; flex-direction: column;
  min-height: 0;
}
.panel {
  background: var(--yuzey);
  border-radius: var(--r);
  box-shadow: var(--golge);
  display: flex; flex-direction: column;
  min-height: 0;
}
.panel-ic { flex: 1 1 auto; overflow-y: auto; padding: 1rem 1.15rem .6rem; }
.panel-alt {
  display: flex; justify-content: space-between; align-items: center; gap: .6rem;
  padding: .65rem .9rem;
  border-top: 1px solid var(--cizgi);
}
.panel h2 { font-size: 1.3rem; line-height: 1.25; margin: .45rem 0 .5rem; }
.panel p { margin: .45rem 0; }
.panel ul { margin: .4rem 0; padding-left: 1.3rem; }
.panel li { margin: .25rem 0; }
.etiket-cip {
  display: inline-block;
  font-size: .72rem; letter-spacing: .07em; font-weight: 800;
  padding: .22em .75em; border-radius: 999px;
  background: var(--renk); color: #fff;
}
.ipucu-metin { color: var(--soluk); font-size: .88rem; }

/* Seçenekler */
.secenek {
  display: block; width: 100%; text-align: left;
  padding: .65rem .85rem; margin: .45rem 0;
  border: 2px solid var(--cizgi); border-radius: 12px;
  background: var(--yuzey2);
  cursor: pointer; touch-action: manipulation;
  line-height: 1.35;
}
.secenek:active { transform: scale(.99); }
.secenek.secili { border-color: var(--renk); background: #eef3ff; }
.secenek.dogru { border-color: var(--dogru); background: var(--dogru-a); }
.secenek.yanlis { border-color: var(--yanlis); background: var(--yanlis-a); }
.secenek.soluk { opacity: .55; }
.sallan { animation: sallan .35s; }
@keyframes sallan { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.geri-bildirim { border-left: 6px solid; padding: .55rem .8rem; border-radius: 8px; margin: .6rem 0; }
.geri-bildirim.iyi { border-color: var(--dogru); background: var(--dogru-a); }
.geri-bildirim.dusun { border-color: var(--yanlis); background: var(--yanlis-a); }
.bilgi-kutusu { background: var(--bilgi-a); border-radius: 10px; padding: .55rem .8rem; margin: .7rem 0; font-size: .92rem; }
.bilgi-kutusu b:first-child { color: var(--b3); }
.alinti { border-left: 4px solid var(--renk); padding: .3rem .8rem; margin: .7rem 0; font-style: italic; color: #333c4d; }
.alinti span { display: block; font-style: normal; font-size: .85rem; color: var(--soluk); margin-top: .2rem; }

/* Kanıt kartları */
.kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .5rem; margin: .6rem 0; }
.kanit-kart { background: var(--yuzey2); border: 1px solid var(--cizgi); border-radius: 10px; padding: .5rem .7rem; font-size: .92rem; }
.kanit-kart b { display: block; margin-bottom: .15rem; }
.kanit-kart .ikon { font-size: 1.3rem; }

/* Tablolar */
.veri-tablo { border-collapse: collapse; width: 100%; font-size: .9rem; margin: .5rem 0; }
.veri-tablo th, .veri-tablo td { border: 1px solid var(--cizgi); padding: .3rem .45rem; text-align: center; }
.veri-tablo th { background: #f1ece1; font-weight: 700; }

/* Tahmin oylaması */
.oy-kart {
  display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: .45rem;
  border: 2px solid var(--cizgi); border-radius: 12px; padding: .45rem .6rem; margin: .45rem 0;
  background: var(--yuzey2);
}
.oy-kart.cogunluk { border-color: var(--renk); background: #eef3ff; }
.oy-dugme {
  width: 2.3rem; height: 2.3rem; border-radius: 50%;
  border: 2px solid var(--murekkep); background: #fff; cursor: pointer;
  font-weight: 800; font-size: 1.15rem; line-height: 1; touch-action: manipulation;
}
.oy-dugme.arti { background: var(--renk); border-color: var(--renk); color: #fff; }
.oy-sayi { font-size: 1.35rem; font-weight: 800; min-width: 1.8ch; text-align: center; }
.oy-metin { padding-left: .3rem; line-height: 1.3; }
.karsilastir { border: 2px dashed var(--renk); border-radius: 12px; padding: .6rem .8rem; margin: .7rem 0; }
.karsilastir .cubuk { height: .55rem; border-radius: 99px; background: #e8e2d4; overflow: hidden; margin: .15rem 0 .35rem; }
.karsilastir .cubuk span { display: block; height: 100%; background: var(--renk); }
.karsilastir .cubuk.dogru span { background: var(--dogru); }

/* Görev listesi */
.gorev-listesi { list-style: none; padding: 0 !important; margin: .5rem 0; }
.gorev-listesi li { position: relative; padding: .35rem 0 .35rem 2.1rem; margin: .1rem 0; border-radius: 8px; }
.gorev-listesi li::before {
  content: ''; position: absolute; left: .35rem; top: .45rem;
  width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 2px solid #b8ad97;
}
.gorev-listesi li.tamam { color: #1d3b2a; }
.gorev-listesi li.tamam::before { content: '✓'; background: var(--dogru); border-color: var(--dogru); color: #fff; font-weight: 900; font-size: .8rem; display: grid; place-items: center; }

/* Sınıflandırma */
.siniflandir-kartlar { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0; }
.s-kart {
  border: 2px solid var(--cizgi); border-radius: 10px; background: var(--yuzey2);
  padding: .45rem .7rem; cursor: pointer; text-align: left; line-height: 1.3; touch-action: manipulation;
}
.s-kart.secili { border-color: var(--renk); background: #eef3ff; box-shadow: 0 0 0 3px rgba(36, 86, 196, .25); }
.s-kutular { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; margin: .6rem 0; }
.s-kutu {
  border: 2px dashed #b8ad97; border-radius: 12px; padding: .5rem; min-height: 4.5rem; cursor: pointer;
  background: #fdfcf9; text-align: left; touch-action: manipulation;
}
.s-kutu .s-kutu-ad { font-weight: 800; display: block; margin-bottom: .3rem; }
.s-kutu.hedef { border-color: var(--renk); background: #f2f6ff; }
.s-kutu .s-yerlesti { font-size: .82rem; background: var(--dogru-a); border-radius: 6px; padding: .2rem .4rem; margin: .2rem 0; }

/* Sıralama */
.sira-hedef { display: flex; flex-direction: column; gap: .35rem; margin: .5rem 0; }
.sira-oge { border: 2px solid var(--dogru); background: var(--dogru-a); border-radius: 10px; padding: .4rem .7rem; }
.sira-oge b { margin-right: .4rem; }

/* ---------- Kapak (sahne) ---------- */
.kapak {
  height: 100%; display: flex; flex-direction: column; justify-content: center;
  padding: 2rem 3rem; color: #fff; position: relative; overflow: hidden;
}
.kapak-yil { font-size: 4.6rem; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
.kapak-kisi { font-size: 1.9rem; font-weight: 700; margin-top: .4rem; }
.kapak-yer { opacity: .85; font-size: 1.05rem; }
.kapak-soru { font-size: 2.1rem; font-weight: 800; margin-top: 1.6rem; max-width: 24ch; line-height: 1.2; }
.kapak-bolum { position: absolute; top: 1.2rem; left: 3rem; font-weight: 800; letter-spacing: .08em; font-size: .8rem; opacity: .85; }

/* ---------- Deney sahnesi parçaları ---------- */
.sim-kok { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.sim-ust {
  display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; align-items: center;
  padding: .45rem .8rem; font-size: .92rem; background: rgba(255, 255, 255, .04);
  border-bottom: 1px solid var(--sim-cizgi); min-height: 2.4rem;
}
.sim-ust b { color: #9fd3ff; }
.tuval-kap { position: relative; flex: 1 1 auto; min-height: 0; }
.tuval-kap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.sim-kontrol {
  display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center;
  padding: .55rem .8rem; background: var(--sim2); border-top: 1px solid var(--sim-cizgi);
}
.sim-kontrol .dugme { background: #1e2a42; color: #f1f5fb; border-color: #3d4e72; min-height: 2.4rem; }
.sim-kontrol .dugme.ana { background: #3b82f6; border-color: #3b82f6; color: #fff; }
.sim-kontrol .dugme.anahtar.acik { background: #0f766e; border-color: #14b8a6; }
.sim-kontrol .ayrac { width: 1px; align-self: stretch; background: var(--sim-cizgi); }
.kaydirici, .secici-kap { display: inline-flex; align-items: center; gap: .5rem; color: #e6edf7; }
.kaydirici-etiket { font-size: .85rem; color: #b7c3d8; font-weight: 600; }
.kaydirici-deger { min-width: 5.5em; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.kaydirici input[type=range] { width: 11rem; height: 2.2rem; accent-color: #3b82f6; }
.kaydirici.genis input[type=range] { width: 18rem; }
.secici { display: inline-flex; border-radius: 10px; overflow: hidden; border: 2px solid #3d4e72; flex-wrap: wrap; }
.secici button {
  border: 0; background: #1e2a42; color: #dbe5f5; padding: .4em .8em; min-height: 2.3rem; cursor: pointer;
  font-weight: 600; border-right: 1px solid #3d4e72; touch-action: manipulation;
}
.secici button:last-child { border-right: 0; }
.secici button.secili { background: #3b82f6; color: #fff; }
.sim-tablo { border-collapse: collapse; font-size: .85rem; color: #e6edf7; }
.sim-tablo th, .sim-tablo td { border: 1px solid #33456a; padding: .2rem .5rem; text-align: center; font-variant-numeric: tabular-nums; }
.sim-tablo th { background: #1b2740; color: #b9d4ff; }
.sahne-bildirim {
  position: absolute; top: 3.2rem; left: 50%; transform: translateX(-50%);
  background: rgba(255, 255, 255, .96); color: #10213a; padding: .45rem 1.1rem; border-radius: 999px;
  font-weight: 700; box-shadow: 0 6px 22px rgba(0, 0, 0, .35); z-index: 5; pointer-events: none;
  animation: bildirim 3.2s forwards; max-width: 90%; text-align: center;
}
.sahne-bildirim.iyi { background: #dcfce7; }
@keyframes bildirim { 0% { opacity: 0; transform: translate(-50%, -10px); } 8% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }
.model-baslik { position: absolute; left: 1rem; top: .8rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .5); }

/* ---------- Harita ---------- */
.harita { flex: 1 1 auto; overflow-y: auto; padding: 1.2rem 2rem 3rem; }
.harita-ust { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.harita h1 { font-size: 2.5rem; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
.harita .alt-baslik { color: var(--soluk); font-size: 1.12rem; margin-top: .25rem; }
.harita-dugmeler { display: flex; gap: .5rem; flex-wrap: wrap; }
.yontem-seridi { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0 .2rem; align-items: center; color: var(--soluk); font-size: .9rem; }
.yontem-seridi span.adim { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 999px; padding: .15rem .7rem; font-weight: 700; color: var(--murekkep); }
.bolum { margin-top: 1.3rem; }
.bolum-baslik { display: flex; align-items: baseline; gap: .8rem; border-bottom: 3px solid var(--renk); padding-bottom: .3rem; flex-wrap: wrap; }
.bolum-no { font-weight: 900; color: var(--renk); font-size: 1.1rem; }
.bolum-ad { font-weight: 800; font-size: 1.35rem; }
.bolum-alt { color: var(--soluk); }
.durak-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: .75rem; margin-top: .8rem; }
.durak-karti {
  background: var(--yuzey); border-radius: var(--r); border: 2px solid transparent;
  padding: .8rem .95rem; text-align: left; cursor: pointer; box-shadow: var(--golge);
  position: relative; min-height: 8.2rem; touch-action: manipulation;
}
.durak-karti:hover { border-color: var(--renk); }
.durak-karti .yil { color: var(--renk); font-weight: 900; font-size: 1.2rem; }
.durak-karti .kisi { font-weight: 750; font-size: 1.08rem; line-height: 1.2; }
.durak-karti .soru { color: var(--soluk); font-size: .9rem; margin-top: .3rem; line-height: 1.3; }
.durak-karti .kazanim { position: absolute; bottom: .5rem; right: .7rem; font-size: .68rem; font-weight: 800; color: #8a8270; }
.durak-karti.tamam::after {
  content: '✓'; position: absolute; top: .6rem; right: .7rem;
  background: var(--dogru); color: #fff; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  display: grid; place-items: center; font-weight: 900;
}
.final-karti { background: linear-gradient(135deg, #172031, #2456c4); color: #fff; }
.final-karti .yil, .final-karti .soru { color: #dbe6ff; }

/* ---------- Çekmece (öğretmen notu) ---------- */
.cekmece {
  position: fixed; top: 0; right: 0; bottom: 0; width: 34rem; max-width: 94vw;
  background: #fffdf8; box-shadow: -8px 0 30px rgba(0, 0, 0, .22);
  transform: translateX(105%); transition: transform .25s; z-index: 50;
  display: flex; flex-direction: column;
}
.cekmece.acik { transform: none; }
.cekmece-ust { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; border-bottom: 1px solid var(--cizgi); }
.cekmece-ic { overflow-y: auto; padding: .6rem 1.1rem 2rem; font-size: .95rem; }
.cekmece-ic h3 { margin: 1rem 0 .3rem; font-size: 1.02rem; color: var(--renk); }
.cekmece-ic ul { padding-left: 1.2rem; margin: .3rem 0; }
.kazanim-kod { font-weight: 800; }

/* ---------- Modal ---------- */
.ortu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 15, 25, .55); display: grid; place-items: center; z-index: 60; }
.modal { background: #fff; border-radius: 20px; padding: 1.4rem 1.8rem; max-width: 42rem; width: 92vw; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.modal h2 { margin: .2rem 0 .6rem; }
.modal .model-tuval { height: 14rem; border-radius: 12px; overflow: hidden; background: var(--sim); position: relative; margin: .6rem 0; }
.modal-dugmeler { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1rem; }

/* ---------- Sayfa ekranları (müze, öğretmen, hakkında, final) ---------- */
.sayfa { flex: 1 1 auto; overflow-y: auto; padding: 1.2rem 2rem 3rem; }
.sayfa h1 { margin: .2rem 0 .4rem; font-size: 2rem; }
.sayfa h2 { margin: 1.4rem 0 .4rem; font-size: 1.3rem; }
.sayfa p, .sayfa li { max-width: 60rem; }
.muze-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .9rem; margin-top: 1rem; }
.muze-kart { background: var(--yuzey); border-radius: var(--r); overflow: hidden; box-shadow: var(--golge); }
.muze-kart .model-tuval { height: 12rem; background: var(--sim); position: relative; }
.muze-kart .govde { padding: .6rem .8rem .8rem; }
.muze-kart .yil { font-weight: 900; color: var(--renk); }
.muze-kart .ad { font-weight: 800; font-size: 1.05rem; }
.muze-kart .ozet { font-size: .9rem; color: var(--soluk); }
.muze-kart.kilitli .model-tuval { filter: grayscale(1) brightness(.5); }
.muze-kart.kilitli .ozet { font-style: italic; }
.genis-tablo { border-collapse: collapse; width: 100%; margin: .5rem 0; font-size: .92rem; background: var(--yuzey); }
.genis-tablo th, .genis-tablo td { border: 1px solid var(--cizgi); padding: .4rem .55rem; text-align: left; vertical-align: top; }
.genis-tablo th { background: #f1ece1; }

/* Final: zaman şeridi */
.serit-havuz { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }
.serit-kart {
  border: 2px solid var(--cizgi); background: var(--yuzey); border-radius: 12px; padding: .5rem .8rem;
  cursor: pointer; text-align: left; max-width: 17rem; touch-action: manipulation; box-shadow: var(--golge);
}
.serit-kart b { display: block; }
.serit-cizgi { display: flex; flex-wrap: wrap; gap: .5rem; align-items: stretch; margin: .8rem 0; padding: .7rem; background: #ece6d9; border-radius: 14px; min-height: 5rem; }
.serit-yer { background: var(--dogru-a); border: 2px solid var(--dogru); border-radius: 12px; padding: .4rem .7rem; max-width: 15rem; }
.serit-yer .yil { font-weight: 900; color: var(--dogru); }

/* ---------- Dar ekranlar ---------- */
@media (max-width: 900px), (orientation: portrait) {
  #uygulama { height: auto; min-height: 100vh; overflow: visible; }
  .durak-govde { grid-template-columns: 1fr; grid-template-rows: auto auto; }

<script>/* js/temel.js */
/* Tepkimenin İzinde — temel yardımcılar (DOM, tuval, döngü, arayüz parçaları, sayı biçimi) */
'use strict';
var GG = window.GG = window.GG || {};

(function () {
  // ---------- Kayıt defterleri ----------
  GG.duraklar = [];
  GG.durakEkle = function (d) { GG.duraklar.push(d); };
  GG.durakBul = function (id) {
    for (var i = 0; i < GG.duraklar.length; i++) if (GG.duraklar[i].id === id) return GG.duraklar[i];
    return null;
  };
  GG.simler = {};
  GG.simKaydet = function (id, kur) { GG.simler[id] = kur; };
  GG.modeller = {};
  GG.modelKaydet = function (id, tanim) { GG.modeller[id] = tanim; };
  GG.adimTurleri = {};

  // ---------- DOM ----------
  function ekle(d, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { ekle(d, x); }); return; }
    if (typeof c === 'string' || typeof c === 'number') { d.appendChild(document.createTextNode(String(c))); return; }
    d.appendChild(c);
  }
  GG.el = function (etiket, oz, cocuklar) {
    var d = document.createElement(etiket);
    if (oz) {
      Object.keys(oz).forEach(function (k) {
        var v = oz[k];
        if (v == null || v === false) return;
        if (k === 'sinif') d.className = v;
        else if (k === 'html') d.innerHTML = v;
        else if (k === 'metin') d.textContent = v;
        else if (k === 'stil') d.setAttribute('style', v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') d.addEventListener(k.slice(2), v);
        else d.setAttribute(k, v === true ? '' : v);
      });
    }
    ekle(d, cocuklar);
    return d;
  };
  GG.bosalt = function (d) { while (d.firstChild) d.removeChild(d.firstChild); };

  // ---------- Kalıcı kayıt (tarayıcı belleği; yoksa sessizce geçer) ----------
  GG.depo = {
    oku: function (k, v) {
      try { var s = window.localStorage.getItem(k); return s ? JSON.parse(s) : v; } catch (e) { return v; }
    },
    yaz: function (k, v) {
      try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* bellek kapalı olabilir */ }
    }
  };

  // ---------- Sayılar ----------
  GG.sayi = function (x, basamak) {
    if (basamak == null) basamak = 0;
    var s = Math.abs(x).toFixed(basamak);
    var parca = s.split('.');
    var tam = parca[0];
    if (tam.length > 4) tam = tam.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (x < 0 && Number(s) !== 0 ? '−' : '') + tam + (parca[1] ? ',' + parca[1] : '');
  };
  var UST = { '-': '⁻', '+': '⁺', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  GG.ust = function (n) { return String(n).split('').map(function (c) { return UST[c] || c; }).join(''); };
  GG.bilimsel = function (x, basamak) {
    if (basamak == null) basamak = 2;
    if (x === 0) return '0';
    var us = Math.floor(Math.log10(Math.abs(x)));
    var m = x / Math.pow(10, us);
    if (Number(Math.abs(m).toFixed(basamak)) >= 10) { m /= 10; us += 1; }
    return GG.sayi(m, basamak) + ' × 10' + GG.ust(us);
  };

  // ---------- Rastgelelik ----------
  GG.karistir = function (dizi) {
    var a = dizi.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  GG.gauss = function () {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  // ---------- Tuval (canvas) ----------
  GG.tuval = function (kap) {
    var cv = document.createElement('canvas');
    cv.className = 'tuval';
    kap.appendChild(cv);
    var ctx = cv.getContext('2d');
    var t = { cv: cv, ctx: ctx, w: 1, h: 1, dpr: 1, _cb: [] };
    function boyutla() {
      var r = kap.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      if (w === t.w && h === t.h && dpr === t.dpr) return;
      t.w = w; t.h = h; t.dpr = dpr;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      t._cb.forEach(function (f) { f(w, h); });
    }
    var ro = ('ResizeObserver' in window) ? new ResizeObserver(boyutla) : null;
    if (ro) ro.observe(kap); else window.addEventListener('resize', boyutla);
    boyutla();
    t.boyutla = boyutla;
    t.boyutDegisti = function (f) { t._cb.push(f); };
    t.konum = function (e) {
      var r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    t.temizle = function (renk) {
      ctx.setTransform(t.dpr, 0, 0, t.dpr, 0, 0);
      if (renk) { ctx.fillStyle = renk; ctx.fillRect(0, 0, t.w, t.h); } else ctx.clearRect(0, 0, t.w, t.h);
    };
    t.yoket = function () {
      if (ro) ro.disconnect(); else window.removeEventListener('resize', boyutla);
      if (cv.parentNode) cv.parentNode.removeChild(cv);
    };
    return t;
  };

  // Tuval yazı tipi: boyut px cinsinden
  GG.font = function (px, kalin) {
    return (kalin ? '700 ' : '') + Math.round(px) + 'px "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif';
  };
  // Sahnedeki tuvaller için okunaklı temel yazı boyu
  GG.yaziBoyu = function (t) { return Math.max(13, Math.min(26, Math.min(t.h / 30, t.w / 48))); };

  // ---------- Animasyon döngüsü ----------
  GG.dongu = function (fn) {
    var id = 0, son = 0, calisiyor = true;
    function f(zaman) {
      if (!calisiyor) return;
      var dt = son ? Math.min(0.05, (zaman - son) / 1000) : 0.016;
      son = zaman;
      fn(dt, zaman);
      if (calisiyor) id = requestAnimationFrame(f);
    }
    id = requestAnimationFrame(f);
    return function () { calisiyor = false; cancelAnimationFrame(id); };
  };

  // ---------- Çizim yardımcıları ----------
  GG.ciz = {
    yd: function (ctx, x, y, w, h, r) { // yuvarlak köşeli dikdörtgen yolu
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    },
    ok: function (ctx, x1, y1, x2, y2, boy) {
      boy = boy || 10;
      var a = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - boy * Math.cos(a - 0.45), y2 - boy * Math.sin(a - 0.45));
      ctx.lineTo(x2 - boy * Math.cos(a + 0.45), y2 - boy * Math.sin(a + 0.45));
      ctx.closePath(); ctx.fill();
    },
    yazi: function (ctx, s, x, y, o) {
      o = o || {};
      ctx.font = GG.font(o.boyut || 16, o.kalin);
      // Tuvalin kenarından taşan yazıyı küçült (dar ekranlar için)
      var m = ctx.getTransform(), sx = m.a || 1, W = ctx.canvas.width / sx, gx = x + m.e / sx, hz = o.hiza || 'left';
      var bos = hz === 'center' ? 2 * Math.min(gx, W - gx) : (hz === 'right' ? gx : W - gx);
      var gen = ctx.measureText(s).width;
      if (bos > 24 && gen > bos - 6) ctx.font = GG.font(Math.max(8, (o.boyut || 16) * (bos - 6) / gen), o.kalin);
      ctx.fillStyle = o.renk || '#e6edf7';
      ctx.textAlign = o.hiza || 'left';
      ctx.textBaseline = o.taban || 'middle';
      ctx.fillText(s, x, y);
    },
    daire: function (ctx, x, y, r, dolgu, cizgi, kalinlik) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (dolgu) { ctx.fillStyle = dolgu; ctx.fill(); }
      if (cizgi) { ctx.strokeStyle = cizgi; ctx.lineWidth = kalinlik || 1; ctx.stroke(); }
    },
    // Parlak küre (elektron, proton vb.)
    kure: function (ctx, x, y, r, renk, isik) {
      var g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      g.addColorStop(0, isik || '#ffffff');
      g.addColorStop(0.35, renk);
      g.addColorStop(1, GG.ciz.koyulas(renk, 0.45));
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    },
    koyulas: function (hex, k) {
      var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
      if (!m) return hex;
      var r = Math.round(parseInt(m[1], 16) * (1 - k)), g = Math.round(parseInt(m[2], 16) * (1 - k)), b = Math.round(parseInt(m[3], 16) * (1 - k));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
  };

  // Dalga boyundan (nm) yaklaşık görünür renk (Bruton yaklaşımı)
  GG.dalgaRenk = function (nm, parlaklik) {
    var r = 0, g = 0, b = 0;
    if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else if (nm <= 780) { r = 1; }
    var f = 1;
    if (nm < 380 || nm > 780) f = 0;
    else if (nm < 420) f = 0.3 + 0.7 * (nm - 380) / 40;
    else if (nm > 700) f = 0.3 + 0.7 * (780 - nm) / 80;
    f *= (parlaklik == null ? 1 : parlaklik);
    function k(c) { return Math.round(255 * Math.pow(c * f, 0.8)); }
    return 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')';
  };

  // ---------- Arayüz parçaları (deney kontrol çubukları için) ----------
  var el = GG.el;
  GG.ui = {
    dugme: function (metin, tik, sinif) {
      return el('button', { sinif: 'dugme' + (sinif ? ' ' + sinif : ''), type: 'button', html: metin, onclick: tik });
    },
    // {etiket, min, max, adim, deger, bicim(v)->metin, degisti(v)}
    kaydirici: function (o) {
      var deger = o.deger;
      var oku = el('span', { sinif: 'kaydirici-deger' });
      var giris = el('input', { type: 'range', min: o.min, max: o.max, step: o.adim || 1, value: o.deger, 'aria-label': o.etiket });
      function yaz() { oku.textContent = o.bicim ? o.bicim(deger) : String(deger); }
      giris.addEventListener('input', function () { deger = Number(giris.value); yaz(); if (o.degisti) o.degisti(deger); });
      yaz();
      var kok = el('label', { sinif: 'kaydirici' + (o.genis ? ' genis' : '') }, [el('span', { sinif: 'kaydirici-etiket', html: o.etiket }), giris, oku]);
      return {
        kok: kok,
        deger: function () { return deger; },
        ayarla: function (v, sessiz) { deger = v; giris.value = v; yaz(); if (!sessiz && o.degisti) o.degisti(deger); }
      };
    },
    // {etiket, secenekler:[{id, ad}], deger, degisti(id)}
    secici: function (o) {
      var deger = o.deger;
      var dugmeler = {};
      var grup = el('div', { sinif: 'secici', role: 'group', 'aria-label': o.etiket || '' });
      o.secenekler.forEach(function (s) {
        var d = el('button', { type: 'button', html: s.ad, onclick: function () { sec(s.id); } });
        dugmeler[s.id] = d;
        grup.appendChild(d);
      });
      function boya() { Object.keys(dugmeler).forEach(function (k) { dugmeler[k].className = (k === String(deger)) ? 'secili' : ''; }); }
      function sec(id, sessiz) { deger = id; boya(); if (!sessiz && o.degisti) o.degisti(id); }
      boya();
      var kok = o.etiket ? el('div', { sinif: 'secici-kap' }, [el('span', { sinif: 'kaydirici-etiket', html: o.etiket }), grup]) : grup;
      return { kok: kok, deger: function () { return deger; }, ayarla: sec };
    },
    // Aç/kapa düğmesi
    anahtar: function (o) {
      var acik = !!o.deger;
      var d = el('button', { type: 'button', sinif: 'dugme anahtar', onclick: function () { ayarla(!acik); } });
      function boya() { d.innerHTML = (acik ? '● ' : '○ ') + o.etiket; d.classList.toggle('acik', acik); }
      function ayarla(v, sessiz) { acik = v; boya(); if (!sessiz && o.degisti) o.degisti(acik); }
      boya();
      return { kok: d, deger: function () { return acik; }, ayarla: ayarla };
    }
  };
})();

</script>
