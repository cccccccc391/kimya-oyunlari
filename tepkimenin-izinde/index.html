    { baslik: 'Nasıl hazırlandı?', metin: 'Oyunun fikri, konusu ve pedagojik yönü bir BİLSEM kimya öğretmenine aittir. Oyunun kodu, deney benzetimleri ve metinleri öğretmenin isteği üzerine <b>Claude (Anthropic) yapay zekâ modeli</b> tarafından yazılmıştır. Bilgiler kaynaklarla karşılaştırılmıştır. Yine de derste kullanmadan önce öğretmen tarafından gözden geçirilmesi önerilir.' },
    { baslik: 'Benzetimler hakkında', metin: 'Ekrandaki deneyler gerçek deneylerin <b>sadeleştirilmiş benzetimleridir</b>. Tanecik çizimleri birer modeldir; ölçek ve hızlar gösterim içindir.' },
    { baslik: '⚠ Güvenlik', metin: 'Asit, baz, gümüş nitrat ve baryum klorür gibi maddeler tahriş edici ya da zehirlidir; deneyler gözlük, önlük ve eldivenle, öğretmen gözetiminde yapılmalıdır. Kurşun bileşikleri ve yanma deneyleri yalnızca ekranda incelenir ya da öğretmen tarafından gösterilir.' }
  ]
};

</script>
<script>/* js/motor.js */
/* Sınıf içi keşif oyunu motoru — ekranlar, yönlendirme ve adım motoru (oyuna özgü ayarlar js/oyun.js içindeki GG.OYUN'da) */
'use strict';
(function () {
  var el = GG.el;
  var O = GG.OYUN;
  var ANAHTAR = O.anahtar;

  GG.durum = GG.depo.oku(ANAHTAR, null) || {};
  ['tamam', 'tahmin', 'ilk'].forEach(function (k) { if (!GG.durum[k]) GG.durum[k] = {}; });
  GG.kaydet = function () { GG.depo.yaz(ANAHTAR, GG.durum); };

  GG.bolumler = O.bolumler;
  GG.kazanimlar = O.kazanimlar;

  var ETIKET = {
    anlati: 'SORU', tahmin: 'TAHMİN', deney: 'DENEY', cikarim: 'ÇIKARIM', coklu: 'ÇIKARIM',
    siniflandir: 'ÇIKARIM', sirala: 'ÇIKARIM', veri: 'VERİ', model: 'BULGU', ama: 'SIRADAKİ', sayisal: 'HESAPLA'
  };

  var kok = null;       // #uygulama
  var aktif = null;     // açık durağın durumu

  GG.sirali = function () { return GG.duraklar.slice().sort(function (a, b) { return a.sira - b.sira; }); };
  GG.bolumRengi = function (no) { return (GG.bolumler[no - 1] || GG.bolumler[0]).renk; };
  function renkAyarla(r) { kok.style.setProperty('--renk', r); document.documentElement.style.setProperty('--renk', r); }

  // ================= Yönlendirme =================
  function rota() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/');
    if (p[0] === 'durak' && GG.durakBul(p[1])) { durakEkrani(GG.durakBul(p[1]), Number(p[2]) || 0); return; }
    if (p[0] === 'muze') { sayfaKur(muzeSayfasi()); return; }
    if (p[0] === 'ogretmen') { sayfaKur(ogretmenSayfasi()); return; }
    if (p[0] === 'hakkinda') { sayfaKur(hakkindaSayfasi()); return; }
    if (p[0] === 'final' && GG.finalSayfasi) { sayfaKur(GG.finalSayfasi()); return; }
    sayfaKur(haritaSayfasi());
  }
  GG.git = function (yol) {
    var hedef = '#/' + yol;
    if (location.hash === hedef) rota(); else location.hash = hedef;
  };

  function sayfaKur(dugum) {
    durakKapat();
    GG.bosalt(kok);
    renkAyarla('#2456c4');
    kok.appendChild(dugum);
    window.scrollTo(0, 0);
  }

  function ustCubukSayfa(baslik) {
    return el('div', { sinif: 'ust-cubuk' }, [
      GG.ui.dugme('◀ Harita', function () { GG.git(''); }),
      el('div', { sinif: 'ust-baslik' }, [el('span', { sinif: 'ust-kisi', metin: baslik })]),
      tamEkranDugmesi()
    ]);
  }
  function tamEkranDugmesi() {
    return GG.ui.dugme('⛶ Tam ekran', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      } catch (e) { /* tarayıcı izin vermeyebilir */ }
    }, 'kucuk');
  }

  // ================= Harita =================
  function haritaSayfasi() {
    var duraklar = GG.sirali();
    var tamamSayisi = duraklar.filter(function (d) { return GG.durum.tamam[d.id]; }).length;
    var s = el('div', { sinif: 'harita' });
    s.appendChild(el('div', { sinif: 'harita-ust' }, [
      el('div', null, [
        el('h1', { metin: O.baslik }),
        el('div', { sinif: 'alt-baslik', html: O.altBaslik + ' <b>' + tamamSayisi + ' / ' + duraklar.length + '</b> durak tamamlandı.' })
      ]),
      el('div', { sinif: 'harita-dugmeler' }, [
        GG.ui.dugme(O.muze.dugme, function () { GG.git('muze'); }),
        GG.ui.dugme('👩‍🏫 Öğretmen', function () { GG.git('ogretmen'); }),
        GG.ui.dugme('ℹ Hakkında', function () { GG.git('hakkinda'); }),
        tamEkranDugmesi()
      ])
    ]));
    var serit = el('div', { sinif: 'yontem-seridi' }, ['Her durakta:']);
    O.yontem.adimlar.forEach(function (a, k) {
      if (k) serit.appendChild(document.createTextNode('→'));
      serit.appendChild(el('span', { sinif: 'adim', metin: (k + 1) + ' ' + a }));
    });
    if (O.yontem.not) serit.appendChild(el('span', { metin: '  ' + O.yontem.not }));
    s.appendChild(serit);
    GG.bolumler.forEach(function (b) {
      var bd = duraklar.filter(function (d) { return d.bolum === b.no; });
      if (!bd.length) return;
      var bolum = el('section', { sinif: 'bolum', stil: '--renk:' + b.renk });
      bolum.appendChild(el('div', { sinif: 'bolum-baslik' }, [
        el('span', { sinif: 'bolum-no', metin: b.no + '. BÖLÜM' }),
        el('span', { sinif: 'bolum-ad', metin: b.ad }),
        el('span', { sinif: 'bolum-alt', metin: b.alt })
      ]));
      var izgara = el('div', { sinif: 'durak-izgara' });
      bd.forEach(function (d) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti' + (GG.durum.tamam[d.id] ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('durak/' + d.id + '/0'); }
        }, [
          el('div', { sinif: 'yil', metin: d.yil }),
          el('div', { sinif: 'kisi', metin: d.kisi }),
          el('div', { sinif: 'soru', metin: d.soru }),
          el('div', { sinif: 'kazanim', metin: (d.kazanim || []).join(' · ').replace(/KİM\./g, '') })
        ]));
      });
      if (b.no === GG.bolumler.length && GG.finalSayfasi) {
        izgara.appendChild(el('button', {
          sinif: 'durak-karti final-karti' + (GG.durum.tamam.final ? ' tamam' : ''), type: 'button',
          onclick: function () { GG.git('final'); }
        }, [
          el('div', { sinif: 'yil', metin: 'FİNAL' }),
          el('div', { sinif: 'kisi', metin: O.final.ad }),
          el('div', { sinif: 'soru', metin: O.final.soru })
        ]));
      }
      bolum.appendChild(izgara);
      s.appendChild(bolum);
    });
    return s;
  }

  // ================= Durak ekranı =================
  function durakKapat() {
    if (!aktif) return;
    sahneTemizle();
    document.removeEventListener('keydown', aktif.tus);
    if (aktif.cekmece && aktif.cekmece.parentNode) aktif.cekmece.parentNode.removeChild(aktif.cekmece);
    aktif = null;
  }

  function durakEkrani(d, i) {
    if (!aktif || aktif.durak !== d) {
      durakKapat();
      GG.bosalt(kok);
      var renk = GG.bolumRengi(d.bolum);
      renkAyarla(renk);
      aktif = {
        durak: d, adimNo: -1, gozlemler: {}, dinleyiciler: [], cozuldu: {}, paylasim: {},
        sim: null, sahneAnahtar: null
      };
      var serit = el('div', { sinif: 'adim-seridi' });
      var notDugme = GG.ui.dugme('📝 Öğretmen notu', function () { aktif.cekmece.classList.toggle('acik'); }, 'kucuk');
      kok.appendChild(el('div', { sinif: 'ust-cubuk' }, [
        GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
        el('div', { sinif: 'ust-baslik' }, [
          el('span', { sinif: 'ust-yil', metin: d.yil }),
          el('span', { sinif: 'ust-kisi', metin: d.kisi }),
          el('span', { sinif: 'ust-soru', metin: d.soru })
        ]),
        serit, notDugme, tamEkranDugmesi()
      ]));
      var sahne = el('div', { sinif: 'sahne' });
      var panelIc = el('div', { sinif: 'panel-ic' });
      var geri = GG.ui.dugme('◀ Geri', function () { if (aktif.adimNo > 0) adimGoster(aktif.adimNo - 1); });
      var gec = GG.ui.dugme('öğretmen: geç', function () { aktif.hazirla(true); }, 'sade kucuk');
      var ileri = GG.ui.dugme('İleri ▶', ileriBas, 'ana');
      var panel = el('div', { sinif: 'panel' }, [panelIc, el('div', { sinif: 'panel-alt' }, [geri, el('span', { stil: 'flex:1' }), gec, ileri])]);
      kok.appendChild(el('div', { sinif: 'durak-govde' }, [sahne, panel]));
      aktif.serit = serit; aktif.sahneKap = sahne; aktif.panelIc = panelIc;
      aktif.geri = geri; aktif.ileri = ileri; aktif.gec = gec;
      aktif.cekmece = cekmeceKur(d);
      document.body.appendChild(aktif.cekmece);
      aktif.tus = function (e) {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.key === 'ArrowRight' && !aktif.ileri.disabled) { e.preventDefault(); ileriBas(); }
        else if (e.key === 'ArrowLeft' && aktif.adimNo > 0) { e.preventDefault(); adimGoster(aktif.adimNo - 1); }
      };
      document.addEventListener('keydown', aktif.tus);
    }
    adimGoster(Math.max(0, Math.min(d.adimlar.length - 1, i)));
  }

  function ileriBas() {
    var d = aktif.durak;
    if (aktif.adimNo < d.adimlar.length - 1) adimGoster(aktif.adimNo + 1);
    else durakBitti(d);
  }

  function sahneCoz(d, i) {
    for (var j = i; j >= 0; j--) if (d.adimlar[j].sahne !== undefined) return d.adimlar[j].sahne;
    return 'kapak';
  }

  function adimGoster(i) {
    var d = aktif.durak, adim = d.adimlar[i];
    aktif.adimNo = i;
    aktif.dinleyiciler = [];
    try { history.replaceState(null, '', '#/durak/' + d.id + '/' + i); } catch (e) { /* file:// bazı tarayıcılarda */ }

    var tanim = sahneCoz(d, i), anahtar = JSON.stringify(tanim);
    if (anahtar !== aktif.sahneAnahtar) { sahneKur(tanim); aktif.sahneAnahtar = anahtar; }

    // Adım şeridi
    GG.bosalt(aktif.serit);
    d.adimlar.forEach(function (a, k) {
      aktif.serit.appendChild(el('button', {
        type: 'button', sinif: 'adim-nokta' + (k === i ? ' aktif' : (k < i ? ' gecti' : '')),
        metin: (a.etiket || ETIKET[a.tur] || '').replace('…', ''), title: a.baslik ? a.baslik.replace(/<[^>]+>/g, '') : '',
        onclick: function () { adimGoster(k); }
      }));
    });

    var etkin = aktif.serit.children[i];
    if (etkin) aktif.serit.scrollLeft = Math.max(0, etkin.offsetLeft - aktif.serit.offsetLeft - aktif.serit.clientWidth / 2);

    // Panel
    var ic = aktif.panelIc;
    GG.bosalt(ic);
    ic.scrollTop = 0;
    var hazir = false;
    function boya() {
      aktif.ileri.disabled = !hazir;
      aktif.gec.style.visibility = hazir ? 'hidden' : 'visible';
      aktif.geri.disabled = i === 0;
      aktif.ileri.innerHTML = i === d.adimlar.length - 1 ? 'Durağı tamamla ✓' : 'İleri ▶';
    }
    aktif.hazirla = function (v) {
      hazir = v !== false;
      if (hazir) aktif.cozuldu[i] = true;
      boya();
    };
    var baglam = {
      durak: d, adimNo: i, adim: adim,
      cozuldu: !!aktif.cozuldu[i],
      hazir: function (v) { aktif.hazirla(v); },
      gozlemVar: function (id) { return !!aktif.gozlemler[id]; },
      gozlemDinle: function (f) { aktif.dinleyiciler.push(f); },
      ilkDeneme: function (dogruMu) {
        var k = d.id + ':' + i;
        if (!(k in GG.durum.ilk)) { GG.durum.ilk[k] = dogruMu; GG.kaydet(); }
      },
      tahminBul: function () {
        for (var j = i - 1; j >= 0; j--) if (d.adimlar[j].tur === 'tahmin') return { adim: d.adimlar[j], oylar: GG.durum.tahmin[d.id + ':' + j] || {} };
        return null;
      },
      sim: function () { return aktif.sim && aktif.sim.inst; },
      paylasim: aktif.paylasim
    };
    ic.appendChild(el('span', { sinif: 'etiket-cip', metin: adim.etiket || ETIKET[adim.tur] || '' }));
    if (adim.baslik) ic.appendChild(el('h2', { html: adim.baslik }));
    if (adim.metin) ic.appendChild(el('div', { sinif: 'adim-metin', html: adim.metin }));
    ortakParcalar(ic, adim, 'ust');
    var tur = GG.adimTurleri[adim.tur];
    if (tur) { var dugum = tur(adim, baglam); if (dugum) ic.appendChild(dugum); }
    ortakParcalar(ic, adim, 'alt');
    if (!tur || adim.tur === 'anlati' || adim.tur === 'model' || adim.tur === 'ama' || adim.tur === 'veri') hazir = true;
    if (hazir) aktif.cozuldu[i] = true;
    boya();

    var s = aktif.sim && aktif.sim.inst;
    if (s && typeof s.adim === 'function') s.adim(adim.simAyar || {}, adim);
  }

  function ortakParcalar(ic, adim, yer) {
    if (yer === 'ust') {
      if (adim.alinti) ic.appendChild(el('div', { sinif: 'alinti', html: adim.alinti.metin + (adim.alinti.kaynak ? '<span>' + adim.alinti.kaynak + '</span>' : '') }));
      if (adim.kartlar && adim.tur !== 'siniflandir') {
        var iz = el('div', { sinif: 'kart-izgara' });
        adim.kartlar.forEach(function (k) {
          iz.appendChild(el('div', { sinif: 'kanit-kart' }, [
            k.ikon ? el('span', { sinif: 'ikon', metin: k.ikon + ' ' }) : null,
            el('b', { html: k.baslik }), el('span', { html: k.metin })
          ]));
        });
        ic.appendChild(iz);
      }
      if (adim.tablo) ic.appendChild(GG.tabloYap(adim.tablo));
    } else {
      if (adim.bilgi) ic.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Biliyor musun?</b> ' + adim.bilgi }));
    }
  }

  GG.tabloYap = function (t) {
    var tablo = el('table', { sinif: t.sinif || 'veri-tablo' });
    if (t.baslik) tablo.appendChild(el('caption', { html: t.baslik, stil: 'caption-side:top;text-align:left;font-weight:700;padding:.2rem 0' }));
    var thead = el('thead'), tr = el('tr');
    t.sutunlar.forEach(function (s) { tr.appendChild(el('th', { html: s })); });
    thead.appendChild(tr); tablo.appendChild(thead);
    var tbody = el('tbody');
    t.satirlar.forEach(function (sat) {
      var r = el('tr');
      sat.forEach(function (h) { r.appendChild(el('td', { html: String(h) })); });
      tbody.appendChild(r);
    });
    tablo.appendChild(tbody);
    return tablo;
  };

  // ---------- Sahne ----------
  function sahneTemizle() {
    if (aktif && aktif.sim) {
      var s = aktif.sim;
      try { if (s.inst && s.inst.yoket) s.inst.yoket(); } catch (e) { console.error(e); }
      s.temizlik.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
      aktif.sim = null;
    }
    if (aktif && aktif.modelDur) { aktif.modelDur(); aktif.modelDur = null; }
  }

  function sahneKur(tanim) {
    sahneTemizle();
    var kap = aktif.sahneKap;
    GG.bosalt(kap);
    if (tanim === 'kapak' || !tanim) { kap.appendChild(kapakDugum(aktif.durak)); return; }
    if (tanim.model) { aktif.modelDur = GG.modelCiz(kap, tanim.model, true); return; }
    var kur = GG.simler[tanim.sim];
    if (!kur) { kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney bulunamadı: ' + tanim.sim })); return; }
    var temizlik = [];
    var api = {
      ayar: tanim.ayar || {},
      paylasim: aktif.paylasim,
      gozlem: function (id) { gozlemEkle(id); },
      tuval: function (k) { var t = GG.tuval(k); temizlik.push(t.yoket); return t; },
      dongu: function (f) { var dur = GG.dongu(f); temizlik.push(dur); return dur; },
      bildir: function (m, tur) { sahneBildirim(m, tur); },
      ui: GG.ui,
      yerlesim: function () {
        var ust = el('div', { sinif: 'sim-ust' });
        var tk = el('div', { sinif: 'tuval-kap' });
        var kontrol = el('div', { sinif: 'sim-kontrol' });
        var sk = el('div', { sinif: 'sim-kok' }, [ust, tk, kontrol]);
        kap.appendChild(sk);
        return { ust: ust, tuvalKap: tk, kontrol: kontrol, kok: sk };
      }
    };
    aktif.sim = { tanim: tanim, temizlik: temizlik, api: api, inst: null };
    try { aktif.sim.inst = kur(kap, api) || {}; }
    catch (e) { console.error(e); kap.appendChild(el('div', { stil: 'padding:2rem', metin: 'Deney yüklenemedi: ' + e.message })); }
  }

  function gozlemEkle(id) {
    if (!aktif || aktif.gozlemler[id]) return;
    aktif.gozlemler[id] = true;
    aktif.dinleyiciler.slice().forEach(function (f) { try { f(id); } catch (e) { console.error(e); } });
  }
  GG._gozlemEkle = gozlemEkle; // test için

  function sahneBildirim(m, tur) {
    if (!aktif) return;
    var b = el('div', { sinif: 'sahne-bildirim' + (tur ? ' ' + tur : ''), html: m });
    aktif.sahneKap.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 3300);
  }

  function kapakDugum(d) {
    var renk = GG.bolumRengi(d.bolum);
    var b = GG.bolumler[d.bolum - 1];
    return el('div', {
      sinif: 'kapak',
      stil: 'background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.16), transparent 45%), linear-gradient(135deg, ' + renk + ', #0b1220 120%)'
    }, [
      el('div', { sinif: 'kapak-bolum', metin: b.no + '. BÖLÜM · ' + b.ad.toLocaleUpperCase('tr-TR') }),
      el('div', { sinif: 'kapak-yil', metin: d.yil }),
      el('div', { sinif: 'kapak-kisi', metin: d.kisiTam || d.kisi }),
      d.yer ? el('div', { sinif: 'kapak-yer', metin: d.yer }) : null,
      el('div', { sinif: 'kapak-soru', metin: d.soru })
    ]);
  }

  // Model çizimi: kap içine tuval açar; animasyonlu ise durdurma işlevi döner
  GG.modelCiz = function (kap, id, animasyon, basliksiz) {
    var m = GG.modeller[id];
    var tk = el('div', { sinif: 'tuval-kap', stil: 'position:absolute;left:0;top:0;right:0;bottom:0' });
    kap.appendChild(tk);
    var t = GG.tuval(tk);
    if (!basliksiz && m && m.ad) kap.appendChild(el('div', { sinif: 'model-baslik', metin: m.ad }));
    function ciz(zaman) {
      t.temizle('#0b1220');
      if (m) m.ciz(t.ctx, t.w, t.h, zaman / 1000);
    }
    if (!animasyon) {
      ciz(2500);
      t.boyutDegisti(function () { ciz(2500); });
      return function () { t.yoket(); };
    }
    var dur = GG.dongu(function (dt, zaman) { ciz(zaman); });
    return function () { dur(); t.yoket(); };
  };

  function durakBitti(d) {
    GG.durum.tamam[d.id] = true;
    GG.kaydet();
    var sira = GG.sirali();
    var k = sira.indexOf(d);
    var sonraki = sira[k + 1];
    var mt = el('div', { sinif: 'model-tuval' });
    var m = d.model && GG.modeller[d.model];
    var ortu = el('div', { sinif: 'ortu' });
    var durMod = null;
    function kapat() { if (durMod) durMod(); if (ortu.parentNode) ortu.parentNode.removeChild(ortu); }
    var modal = el('div', { sinif: 'modal' }, [
      el('span', { sinif: 'etiket-cip', metin: 'DURAK TAMAMLANDI' }),
      el('h2', { html: d.kisi + ' (' + d.yil + ')' }),
      m ? mt : null,
      el('p', { html: m ? '<b>' + m.ad + '</b> ' + O.muze.eklendi + ' ' + (d.ozet || '') : (d.ozet || '') }),
      el('div', { sinif: 'modal-dugmeler' }, [
        GG.ui.dugme('Haritaya dön', function () { kapat(); GG.git(''); }),
        sonraki ? GG.ui.dugme('Sonraki durak: ' + sonraki.kisi + ' (' + sonraki.yil + ') ▶', function () { kapat(); GG.git('durak/' + sonraki.id + '/0'); }, 'ana')
          : (GG.finalSayfasi ? GG.ui.dugme('Finale geç ▶', function () { kapat(); GG.git('final'); }, 'ana') : null)
      ])
    ]);
    ortu.appendChild(modal);
    document.body.appendChild(ortu);
    if (m) durMod = GG.modelCiz(mt, d.model, true, true);
  }

  // ---------- Öğretmen notu çekmecesi ----------
  function cekmeceKur(d) {
    var o = d.ogretmen || {};
    var c = el('aside', { sinif: 'cekmece', 'aria-label': 'Öğretmen notu' });
    var ic = el('div', { sinif: 'cekmece-ic' });
    c.appendChild(el('div', { sinif: 'cekmece-ust' }, [
      el('b', { metin: 'Öğretmen notu · ' + d.kisi }),
      GG.ui.dugme('Kapat ✕', function () { c.classList.remove('acik'); }, 'kucuk')
    ]));
    c.appendChild(ic);
    if (o.sure) ic.appendChild(el('p', { html: '<b>Önerilen süre:</b> ' + o.sure }));
    if (d.kazanim && d.kazanim.length) {
      ic.appendChild(el('h3', { metin: 'Öğrenme çıktısı (Maarif Modeli, ' + (GG.OYUN.sinif || 9) + '. sınıf)' }));
      d.kazanim.forEach(function (kod) {
        var k = GG.kazanimlar[kod];
        if (!k) return;
        var ul = el('ul');
        ic.appendChild(el('p', { html: '<span class="kazanim-kod">' + kod + '</span> ' + k.metin }));
        var bilesenler = (o.bilesenler && o.bilesenler[kod]) || [];
        bilesenler.forEach(function (h) { if (k.bilesen[h]) ul.appendChild(el('li', { html: '<b>' + h + ')</b> ' + k.bilesen[h] })); });
        if (ul.childNodes.length) ic.appendChild(ul);
      });
    }
    function liste(baslik, dizi) {
      if (!dizi || !dizi.length) return;
      ic.appendChild(el('h3', { metin: baslik }));
      var ul = el('ul');
      dizi.forEach(function (x) { ul.appendChild(el('li', { html: x })); });
      ic.appendChild(ul);
    }
    if (o.amac) { ic.appendChild(el('h3', { metin: 'Bu durağın amacı' })); ic.appendChild(el('p', { html: o.amac })); }
    liste('Sınıfta sorulabilecek sorular', o.tartisma);
    liste('Dikkat: sık görülen kavram yanılgıları', o.yanilgilar);
    liste('Bilimsel doğruluk notları', o.notlar);
    liste('Kaynaklar', o.kaynaklar);
    return c;
  }

  // ================= Model Müzesi =================
  var muzeHepsi = false;
  function muzeSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    var kapsayici = el('div');
    var dugme = GG.ui.dugme(muzeHepsi ? 'Yalnızca keşfedilenleri göster' : 'Öğretmen: tümünü göster', function () { muzeHepsi = !muzeHepsi; rota(); }, 'kucuk');
    s.appendChild(ustCubukSayfa(O.muze.ad));
    var ic = el('div', { stil: 'padding: 0 0 2rem' });
    ic.appendChild(el('h1', { metin: O.muze.dugme }));
    ic.appendChild(el('p', { html: O.muze.aciklama }));
    ic.appendChild(dugme);
    var iz = el('div', { sinif: 'muze-izgara' });
    var durdurucular = [];
    GG.sirali().forEach(function (d) {
      if (!d.model) return;
      var acik = muzeHepsi || GG.durum.tamam[d.id];
      var mt = el('div', { sinif: 'model-tuval' });
      var m = GG.modeller[d.model];
      var kart = el('div', { sinif: 'muze-kart' + (acik ? '' : ' kilitli'), stil: '--renk:' + GG.bolumRengi(d.bolum) }, [
        mt,
        el('div', { sinif: 'govde' }, [
          el('div', { sinif: 'yil', metin: d.yil + ' · ' + d.kisi }),
          el('div', { sinif: 'ad', metin: acik && m ? m.ad : '???' }),
          el('div', { sinif: 'ozet', html: acik ? (d.muzeOzet || d.ozet || '') : O.muze.kilitli })
        ])
      ]);
      iz.appendChild(kart);
      if (acik) durdurucular.push(function () { return GG.modelCiz(mt, d.model, false, true); });
    });
    ic.appendChild(iz);
    kapsayici.appendChild(ic);
    s.appendChild(kapsayici);
    // Tuvaller yerleştikten sonra çiz
    setTimeout(function () { durdurucular.forEach(function (f) { f(); }); }, 0);
    return s;
  }

  // ================= Öğretmen sayfası =================
  function ogretmenSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Öğretmen'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: '👩‍🏫 Öğretmen sayfası' }));
    ic.appendChild(el('h2', { metin: 'Derste nasıl kullanılır?' }));
    ic.appendChild(el('ul', null, O.ogretmenKullanim.map(function (h) { return el('li', { html: h }); })));
    ic.appendChild(el('h2', { metin: 'Öğrenme çıktılarıyla eşleşme' }));
    var satirlar = GG.sirali().map(function (d) {
      var o = d.ogretmen || {};
      var bil = [];
      (d.kazanim || []).forEach(function (kod) {
        var b = (o.bilesenler && o.bilesenler[kod]) || [];
        bil.push('<b>' + kod + '</b>' + (b.length ? ' (' + b.join(', ') + ')' : ''));
      });
      return [d.yil, d.kisi, d.soru, bil.join('<br>'), o.sure || ''];
    });
    ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: [O.yilSutunu || 'Yıl', 'Durak', 'Durağın sorusu', 'Öğrenme çıktısı (süreç bileşeni)', 'Süre'], satirlar: satirlar }));
    ic.appendChild(el('p', { sinif: 'ipucu-metin', html: O.programKaynagi }));

    ic.appendChild(el('h2', { metin: 'Sınıfın tahminleri' }));
    var tahminSatir = [];
    GG.sirali().forEach(function (d) {
      d.adimlar.forEach(function (a, k) {
        if (a.tur !== 'tahmin') return;
        var oylar = GG.durum.tahmin[d.id + ':' + k];
        if (!oylar) return;
        var toplam = 0; Object.keys(oylar).forEach(function (x) { toplam += oylar[x]; });
        if (!toplam) return;
        var dagilim = a.secenekler.map(function (sec) {
          var n = oylar[sec.id] || 0;
          return (sec.id === a.dogru ? '✔ ' : '') + sec.metin.replace(/<[^>]+>/g, '') + ': <b>' + n + '</b>';
        }).join('<br>');
        tahminSatir.push([d.kisi, (a.soru || '').replace(/<[^>]+>/g, ''), dagilim]);
      });
    });
    if (tahminSatir.length) ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: ['Durak', 'Soru', 'Oylar (✔ deneyin sonucu)'], satirlar: tahminSatir }));
    else ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Henüz oylama kaydedilmedi.' }));

    ic.appendChild(el('h2', { metin: 'Yeni sınıf' }));
    ic.appendChild(el('p', { metin: 'Başka bir sınıfla başlamadan önce ilerlemeyi ve oylamaları sıfırlayabilirsiniz.' }));
    ic.appendChild(GG.ui.dugme('İlerlemeyi ve oyları sıfırla', function () {
      if (window.confirm('Tüm ilerleme ve sınıf oyları silinsin mi?')) {
        GG.durum.tamam = {}; GG.durum.tahmin = {}; GG.durum.ilk = {}; GG.kaydet(); GG.git('');
      }
    }));

    // Yedek: tarayıcı belleği silinirse ilerleme ve oylar dosyadan geri yüklenebilir
    ic.appendChild(el('h2', { metin: 'İlerlemeyi yedekle' }));
    ic.appendChild(el('p', { metin: 'İlerleme ve oylar bu tahtanın tarayıcısında saklanır. Tarayıcı belleği silinirse kaybolur. Ders sonunda bir yedek dosyası indirip daha sonra (başka bir tahtada da) geri yükleyebilirsiniz.' }));
    var yedekGiris = el('input', { type: 'file', accept: '.json,application/json', stil: 'display:none' });
    yedekGiris.addEventListener('change', function () {
      var dosya = yedekGiris.files && yedekGiris.files[0];
      if (!dosya) return;
      var okuyucu = new FileReader();
      okuyucu.onload = function () {
        try {
          var veri = JSON.parse(okuyucu.result);
          if (!veri || veri.anahtar !== ANAHTAR || typeof veri.durum !== 'object') { window.alert('Bu yedek dosyası bu oyuna ait değil.'); return; }
          if (!window.confirm('Yedekteki ilerleme yüklensin mi? Bu tahtadaki şimdiki ilerlemenin yerine geçer.')) return;
          GG.durum = veri.durum; GG.kaydet(); GG.git('');
        } catch (e) { window.alert('Yedek dosyası okunamadı.'); }
      };
      okuyucu.readAsText(dosya);
      yedekGiris.value = '';
    });
    ic.appendChild(yedekGiris);
    ic.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap' }, [
      GG.ui.dugme('💾 Yedeği indir', function () {
        var t = new Date(), gun = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
        var blob = new Blob([JSON.stringify({ anahtar: ANAHTAR, oyun: document.title, tarih: t.toISOString(), durum: GG.durum })], { type: 'application/json' });
        var a = el('a', { href: URL.createObjectURL(blob), download: ANAHTAR + '-yedek-' + gun + '.json' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }),
      GG.ui.dugme('📂 Yedekten yükle', function () { yedekGiris.click(); })
    ]));

    // Kilit: kilitli sürümde tahta şifreyi hatırlıyorsa burada unutturulur
    var kilitVar = false;
    try { kilitVar = !!window.localStorage.getItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
    if (kilitVar) {
      ic.appendChild(el('h2', { metin: 'Kilit' }));
      ic.appendChild(el('p', { metin: 'Bu tahta oyunların şifresini hatırlıyor. Kilitlerseniz bu tahtadaki bütün oyunlar bir sonraki açılışta yeniden şifre ister. İlerleme silinmez.' }));
      ic.appendChild(GG.ui.dugme('🔒 Bu tahtada kilitle', function () {
        try { window.localStorage.removeItem('gg-kilit-v1'); } catch (e) { /* bellek kapalı */ }
        window.location.reload();
      }));
    }
    s.appendChild(ic);
    return s;
  }

  // ================= Hakkında =================
  function hakkindaSayfasi() {
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(ustCubukSayfa('Hakkında'));
    var ic = el('div');
    ic.appendChild(el('h1', { metin: O.baslik }));
    O.hakkinda.forEach(function (b) {
      if (b.baslik) ic.appendChild(el('h2', { metin: b.baslik }));
      ic.appendChild(el('p', { html: b.metin }));
    });
    ic.appendChild(el('h2', { metin: 'Kaynaklar' }));
    var ul = el('ul');
    var gorulen = {};
    GG.sirali().forEach(function (d) {
      ((d.ogretmen && d.ogretmen.kaynaklar) || []).forEach(function (k) { if (!gorulen[k]) { gorulen[k] = 1; ul.appendChild(el('li', { html: k })); } });
    });
    ic.appendChild(ul);
    ic.appendChild(el('p', { sinif: 'ipucu-metin', metin: O.surum }));
    s.appendChild(ic);
    return s;
  }

  // ================= Başlat =================
  GG.baslat = function () {
    kok = document.getElementById('uygulama');
    window.addEventListener('hashchange', rota);
    rota();
  };
  GG._aktif = function () { return aktif; }; // test için
  GG._adimGoster = function (i) { adimGoster(i); };
})();

</script>
<script>/* js/adimlar.js */
/* Tepkimenin İzinde — adım türleri (panelde görünen etkinlikler) */
'use strict';
(function () {
  var el = GG.el;
  var T = GG.adimTurleri;

  function toplamOy(oylar) { var t = 0; Object.keys(oylar).forEach(function (k) { t += oylar[k] || 0; }); return t; }
  function salla(d) { d.classList.remove('sallan'); void d.offsetWidth; d.classList.add('sallan'); }

  // ---------- Anlatı: metin motor tarafından yazılır ----------
  T.anlati = function () { return null; };
  T.veri = function () { return null; };

  // ---------- Tahmin (sınıf oylaması) ----------
  T.tahmin = function (a, b) {
    var k = b.durak.id + ':' + b.adimNo;
    var oylar = GG.durum.tahmin[k] || {};
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Sınıfa sorun: Her seçenek için el kaldıranları sayıp + ile ekleyin. İsterseniz oylamadan da devam edebilirsiniz.' }));
    var kartlar = [];
    a.secenekler.forEach(function (s) {
      var sayi = el('span', { sinif: 'oy-sayi' });
      var kart = el('div', { sinif: 'oy-kart' }, [
        el('button', { sinif: 'oy-dugme', type: 'button', 'aria-label': 'Bir oy azalt', metin: '−', onclick: function () { degis(s.id, -1); } }),
        sayi,
        el('button', { sinif: 'oy-dugme arti', type: 'button', 'aria-label': 'Bir oy ekle', metin: '+', onclick: function () { degis(s.id, 1); } }),
        el('div', { sinif: 'oy-metin', html: s.metin })
      ]);
      kartlar.push({ s: s, kart: kart, sayi: sayi });
      kok.appendChild(kart);
    });
    function degis(id, d) {
      oylar[id] = Math.max(0, (oylar[id] || 0) + d);
      GG.durum.tahmin[k] = oylar; GG.kaydet(); boya();
    }
    function boya() {
      var enCok = 0;
      kartlar.forEach(function (x) { enCok = Math.max(enCok, oylar[x.s.id] || 0); });
      kartlar.forEach(function (x) {
        var n = oylar[x.s.id] || 0;
        x.sayi.textContent = String(n);
        x.kart.classList.toggle('cogunluk', enCok > 0 && n === enCok);
      });
    }
    boya();
    kok.appendChild(el('p', { sinif: 'ipucu-metin', html: 'Tahminler kaydedildi. Doğru cevap deneyden sonra açıklanacak: <b>İleri ▶</b>' }));
    b.hazir(true);
    return kok;
  };

  function karsilastirma(t) {
    var a = t.adim, oylar = t.oylar, toplam = toplamOy(oylar);
    var dogru = null;
    a.secenekler.forEach(function (s) { if (s.id === a.dogru) dogru = s; });
    var kutu = el('div', { sinif: 'karsilastir' });
    kutu.appendChild(el('b', { metin: 'Sınıfın tahmini ve sonuç' }));
    if (!toplam) {
      kutu.appendChild(el('p', { html: 'Oylama yapılmadı. Sonuç: <b>' + (dogru ? dogru.metin : '') + '</b>' }));
      return kutu;
    }
    a.secenekler.forEach(function (s) {
      var n = oylar[s.id] || 0, yuzde = Math.round(100 * n / toplam);
      kutu.appendChild(el('div', { html: (s.id === a.dogru ? '✔ ' : '') + s.metin + ': <b>' + n + ' oy (%' + yuzde + ')</b>' }));
      kutu.appendChild(el('div', { sinif: 'cubuk' + (s.id === a.dogru ? ' dogru' : '') }, el('span', { stil: 'width:' + yuzde + '%' })));
    });
    var oran = (oylar[a.dogru] || 0) / toplam;
    kutu.appendChild(el('p', {
      html: oran >= 0.5 ? 'Sınıfın çoğunluğunun tahmini doğru çıktı.'
        : 'Sınıfın çoğunluğunun tahmini tutmadı. Bilim insanları da sık sık yanılır. Yeni bir model çoğu zaman tam da böyle bir şaşkınlıkla başlar.'
    }));
    return kutu;
  }

  // ---------- Deney: sahnedeki benzetimden gözlem toplanır ----------
  T.deney = function (a, b) {
    var kok = el('div');
    if (a.gorev) kok.appendChild(el('p', { html: a.gorev }));
    var ul = el('ul', { sinif: 'gorev-listesi' });
    var satirlar = (a.gozlemler || []).map(function (g) {
      var li = el('li', { html: g.metin });
      ul.appendChild(li);
      return { g: g, li: li };
    });
    kok.appendChild(ul);
    var gerekli = a.gerekli || satirlar.length;
    var sonuc = el('div');
    kok.appendChild(sonuc);
    var gosterildi = false;
    function kontrol() {
      var n = 0;
      satirlar.forEach(function (x) {
        var t = b.gozlemVar(x.g.id);
        x.li.classList.toggle('tamam', t);
        if (t) n++;
      });
      if (n >= gerekli && !gosterildi) {
        gosterildi = true;
        if (a.sonuc) sonuc.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.sonuc }));
        if (a.tahminKarsilastir) { var t = b.tahminBul(); if (t) sonuc.appendChild(karsilastirma(t)); }
        b.hazir(true);
      }
    }
    b.gozlemDinle(kontrol);
    kontrol();
    return kok;
  };

  // ---------- Tek doğru cevaplı çıkarım ----------
  T.cikarim = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    var geri = el('div');
    var ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: s.metin });
      d.addEventListener('click', function () { sec(s, d); });
      dugmeler.push({ s: s, d: d });
      kok.appendChild(d);
    });
    kok.appendChild(geri);
    function sec(s, d) {
      if (bitti) return;
      GG.bosalt(geri);
      if (s.dogru) {
        bitti = true;
        d.classList.remove('yanlis');
        d.classList.add('dogru');
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (x.d !== d) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: [s.geri, a.aciklama].filter(Boolean).join(' ') || 'Doğru.' }));
        b.hazir(true);
      } else {
        ilk = false;
        d.classList.add('yanlis');
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.geri || 'Bir daha düşün: Deneyde ne gözlemledin?' }));
      }
    }
    if (b.cozuldu) dugmeler.forEach(function (x) { if (x.s.dogru) sec(x.s, x.d); });
    return kok;
  };

  // ---------- Çok seçimli çıkarım ----------
  T.coklu = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Birden fazla seçenek doğru olabilir. Seçip “Kontrol et”e dokunun.' }));
    var secili = {}, ilk = true, bitti = false, dugmeler = [];
    var secenekler = a.karistirma === false ? a.secenekler : GG.karistir(a.secenekler);
    secenekler.forEach(function (s, i) {
      var d = el('button', { sinif: 'secenek', type: 'button', html: '☐ ' + s.metin });
      d.addEventListener('click', function () {
        if (bitti) return;
        secili[i] = !secili[i];
        d.innerHTML = (secili[i] ? '☑ ' : '☐ ') + s.metin;
        dugmeler.forEach(function (x) { x.d.classList.remove('dogru', 'yanlis'); });
        d.classList.toggle('secili', !!secili[i]);
      });
      dugmeler.push({ s: s, d: d, i: i });
      kok.appendChild(d);
    });
    var geri = el('div');
    var kontrolD = GG.ui.dugme('Kontrol et', kontrol, 'ana');
    kok.appendChild(el('div', { stil: 'margin:.5rem 0' }, kontrolD));
    kok.appendChild(geri);
    function kontrol() {
      if (bitti) return;
      GG.bosalt(geri);
      var tam = true, notlar = [];
      dugmeler.forEach(function (x) {
        var sec = !!secili[x.i];
        x.d.classList.remove('secili');
        if (sec && x.s.dogru) x.d.classList.add('dogru');
        else if (sec && !x.s.dogru) { x.d.classList.add('yanlis'); tam = false; if (x.s.geri) notlar.push(x.s.geri); }
        else if (!sec && x.s.dogru) { tam = false; }
      });
      if (tam) {
        bitti = true;
        b.ilkDeneme(ilk);
        dugmeler.forEach(function (x) { if (!x.s.dogru) x.d.classList.add('soluk'); });
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Doğru.' }));
        kontrolD.disabled = true;
        b.hazir(true);
      } else {
        ilk = false;
        var eksik = dugmeler.some(function (x) { return !secili[x.i] && x.s.dogru; });
        geri.appendChild(el('div', {
          sinif: 'geri-bildirim dusun',
          html: (notlar.length ? notlar.join('<br>') : '') + (eksik ? (notlar.length ? '<br>' : '') + 'Kanıtın desteklediği bir seçeneği daha atladınız.' : '')
        }));
      }
    }
    if (b.cozuldu) {
      dugmeler.forEach(function (x) { secili[x.i] = !!x.s.dogru; x.d.innerHTML = (x.s.dogru ? '☑ ' : '☐ ') + x.s.metin; });
      kontrol();
    }
    return kok;
  };

  // ---------- Sınıflandırma: kartı seç, kutuya bırak ----------
  T.siniflandir = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: 'Önce bir karta, sonra ait olduğu kutuya dokunun.' }));
    var kartAlan = el('div', { sinif: 'siniflandir-kartlar' });
    var kutuAlan = el('div', { sinif: 's-kutular' });
    var geri = el('div');
    var secili = null, kalan = a.kartlar.length, ilk = true;
    var kutular = {};
    a.kutular.forEach(function (k) {
      var d = el('button', { sinif: 's-kutu', type: 'button' }, [el('span', { sinif: 's-kutu-ad', html: k.ad })]);
      d.addEventListener('click', function () { birak(k.id); });
      kutular[k.id] = d;
      kutuAlan.appendChild(d);
    });
    var kartDugmeleri = [];
    GG.karistir(a.kartlar).forEach(function (kt) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: kt.metin });
      d.addEventListener('click', function () { sec(kt, d); });
      kartDugmeleri.push({ kt: kt, d: d });
      kartAlan.appendChild(d);
    });
    kok.appendChild(kartAlan);
    kok.appendChild(kutuAlan);
    kok.appendChild(geri);
    function sec(kt, d) {
      secili = { kt: kt, d: d };
      kartDugmeleri.forEach(function (x) { x.d.classList.toggle('secili', x.d === d); });
      Object.keys(kutular).forEach(function (k) { kutular[k].classList.add('hedef'); });
    }
    function yerlestir(kt, d, sessiz) {
      kutular[kt.kutu].appendChild(el('div', { sinif: 's-yerlesti', html: kt.metin }));
      if (d.parentNode) d.parentNode.removeChild(d);
      kalan--;
      if (!sessiz && kt.dogruGeri) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: kt.dogruGeri })); }
    }
    function birak(kutuId) {
      if (!secili) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Önce bir kart seçin.' })); return; }
      var s = secili;
      if (s.kt.kutu === kutuId) {
        GG.bosalt(geri);
        yerlestir(s.kt, s.d);
        secili = null;
        Object.keys(kutular).forEach(function (k) { kutular[k].classList.remove('hedef'); });
        if (kalan === 0) bitir();
      } else {
        ilk = false;
        salla(s.d);
        GG.bosalt(geri);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: s.kt.geri || 'Bu kart bu kutuya uymuyor. Kanıta tekrar bakın.' }));
      }
    }
    function bitir() {
      b.ilkDeneme(ilk);
      GG.bosalt(geri);
      geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Hepsi doğru yerde.' }));
      b.hazir(true);
    }
    if (b.cozuldu) { kartDugmeleri.forEach(function (x) { yerlestir(x.kt, x.d, true); }); bitir(); }
    return kok;
  };

  // ---------- Sıralama: doğru sırayla dokun ----------
  T.sirala = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    kok.appendChild(el('p', { sinif: 'ipucu-metin', metin: a.yonerge || 'Öğeleri doğru sırayla tek tek dokunarak dizin.' }));
    var hedef = el('div', { sinif: 'sira-hedef' });
    var havuz = el('div', { sinif: 'siniflandir-kartlar' });
    var geri = el('div');
    var sira = 0, ilk = true;
    var dugmeler = [];
    a.ogeler.forEach(function (o, i) {
      var d = el('button', { sinif: 's-kart', type: 'button', html: o.metin });
      d.addEventListener('click', function () { dokun(o, i, d); });
      dugmeler.push({ o: o, i: i, d: d });
    });
    GG.karistir(dugmeler).forEach(function (x) { havuz.appendChild(x.d); });
    kok.appendChild(hedef);
    kok.appendChild(havuz);
    kok.appendChild(geri);
    function koy(o, d) {
      hedef.appendChild(el('div', { sinif: 'sira-oge', html: '<b>' + (sira + 1) + '.</b>' + o.metin + (o.ek ? ' <span class="ipucu-metin">' + o.ek + '</span>' : '') }));
      if (d.parentNode) d.parentNode.removeChild(d);
      sira++;
    }
    function dokun(o, i, d) {
      GG.bosalt(geri);
      if (i === sira) {
        koy(o, d);
        if (sira === a.ogeler.length) {
          b.ilkDeneme(ilk);
          geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' }));
          b.hazir(true);
        }
      } else {
        ilk = false;
        salla(d);
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: o.geri || a.ipucu || 'Bu henüz sırası gelen öğe değil.' }));
      }
    }
    if (b.cozuldu) { dugmeler.forEach(function (x) { koy(x.o, x.d); }); geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: a.aciklama || 'Sıralama doğru.' })); b.hazir(true); }
    return kok;
  };

  // ---------- Sayısal cevap: hesapla ve yaz (tuş takımıyla) ----------
  // "1,2·10^24", "1,2x10^24", "1.2e24", "18" gibi yazımları okur
  GG.sayiOku = function (m) {
    var s = String(m).replace(/\s+/g, '').replace(/−/g, '-');
    var r = s.match(/^([-+]?\d+(?:[.,]\d+)?)(?:(?:[x×·*]10\^?|e|E)([-+]?\d+))?$/);
    if (!r) return NaN;
    return parseFloat(r[1].replace(',', '.')) * Math.pow(10, r[2] ? parseInt(r[2], 10) : 0);
  };
  T.sayisal = function (a, b) {
    var kok = el('div');
    kok.appendChild(el('p', { html: '<b>' + a.soru + '</b>' }));
    var giris = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': 'Cevap', stil: 'font-size:1.4rem;padding:.35rem .6rem;width:12rem;border-radius:10px;border:2px solid var(--cizgi);font-family:inherit' });
    var satir = el('div', { stil: 'display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.4rem 0' }, [giris, el('span', { stil: 'font-size:1.2rem;font-weight:700', html: a.birim || '' })]);
    kok.appendChild(satir);
    var tus = el('div', { stil: 'display:grid;grid-template-columns:repeat(4,3.6rem);gap:.3rem;margin:.4rem 0' });
    ['7', '8', '9', '⌫', '4', '5', '6', '×10^', '1', '2', '3', '−', '0', ','].forEach(function (k) {
      tus.appendChild(el('button', { type: 'button', sinif: 'dugme kucuk', stil: 'min-width:0;font-size:1.15rem;padding:.35rem 0', html: k, onclick: function () {
        if (k === '⌫') giris.value = giris.value.slice(0, -1); else giris.value += (k === '−' ? '-' : k);
      } }));
    });
    kok.appendChild(tus);
    var kontrolD = GG.ui.dugme('Kontrol et', kontrol, 'ana');
    var cozumD = GG.ui.dugme('Çözümü göster', function () { cozumGoster(); }, 'sade');
    cozumD.style.display = 'none';
    kok.appendChild(el('div', { stil: 'margin:.5rem 0;display:flex;gap:.5rem;flex-wrap:wrap' }, [kontrolD, cozumD]));
    var geri = el('div'), cozumKutu = el('div');
    kok.appendChild(geri); kok.appendChild(cozumKutu);
    var ilk = true, bitti = false, yanlis = 0;
    giris.addEventListener('keydown', function (e) { if (e.key === 'Enter') kontrol(); });
    function cozumGoster() {
      GG.bosalt(cozumKutu);
      if (!a.cozum) return;
      var ol = el('ol', { stil: 'margin:.3rem 0 .3rem 1.2rem' });
      a.cozum.forEach(function (c) { ol.appendChild(el('li', { html: c })); });
      cozumKutu.appendChild(el('div', { sinif: 'bilgi-kutusu' }, [el('b', { metin: 'Çözüm' }), ol]));
    }
    function kontrol() {
      if (bitti) return;
      GG.bosalt(geri);
      var v = GG.sayiOku(giris.value), hedef = a.cevap, tol = a.tol == null ? 0.02 : a.tol;
      if (isNaN(v)) { geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Bir sayı yaz. Örnek: 18 ya da 1,2×10^24' })); return; }
      var dogru = Math.abs(v - hedef) <= Math.abs(hedef) * tol + 1e-12;
      if (dogru) {
        bitti = true; b.ilkDeneme(ilk);
        giris.style.borderColor = 'var(--dogru)'; kontrolD.disabled = true; cozumD.style.display = 'none';
        geri.appendChild(el('div', { sinif: 'geri-bildirim iyi', html: 'Doğru! ' + (a.aciklama || '') }));
        cozumGoster(); b.hazir(true);
      } else {
        ilk = false; yanlis++;
        giris.style.borderColor = 'var(--yanlis)';
        var ipucu = (a.ipuclari && a.ipuclari[Math.min(yanlis, a.ipuclari.length) - 1]) || a.ipucu || 'Bir daha hesapla. Birimlere dikkat et.';
        geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', html: ipucu }));
        if (yanlis >= 2 && a.cozum) cozumD.style.display = '';
      }
    }
    if (b.cozuldu) { giris.value = String(a.cevapYaz || a.cevap).replace('.', ','); kontrol(); }
    return kok;
  };

  // ---------- Model kartı ----------
  T.model = function (a) {
    var kok = el('div');
    if (a.maddeler) {
      kok.appendChild(el('p', { html: '<b>' + (a.maddeBaslik || 'Modelin varsayımları') + '</b>' }));
      var ul = el('ul');
      a.maddeler.forEach(function (m) { ul.appendChild(el('li', { html: m })); });
      kok.appendChild(ul);
    }
    return kok;
  };

  // ---------- Ama…: modelin açıklayamadığı gözlem ----------
  T.ama = function (a) {
    var kok = el('div');
    if (a.sonraki) {
      var d = GG.durakBul(a.sonraki);
      if (d) kok.appendChild(el('div', { sinif: 'bilgi-kutusu', html: '<b>Sıradaki durak:</b> ' + d.kisi + ' (' + d.yil + ') · ' + d.soru }));
    }
    return kok;
  };
})();

</script>
<script>/* js/sinav.js */
/* Ders sonu sınavı: soru bankasından seçilen sorular, kazanıma göre sonuç, yazdırılabilir soru kâğıdı ve cevap anahtarı */
'use strict';
(function () {
  var el = GG.el;
  var HARF = ['A', 'B', 'C', 'D', 'E'];
  function kacis(m) { return String(m).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function duz(h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent; }
  function sayiYaz(x) {
    if (x === 0) return '0';
    var e = Math.floor(Math.log10(Math.abs(x)));
    if (e >= 6 || e <= -4) { var m = x / Math.pow(10, e); return GG.sayi(m, 2).replace(/,?0+$/, '') + '·10' + GG.ust(e); }
    return GG.sayi(x, Math.abs(x) < 10 && x % 1 ? 2 : (x % 1 ? 1 : 0));
  }
  GG.sinavSayiYaz = sayiYaz;

  // ayar: { baslik, giris, banka: [{k, s, o?, d?, n?, b?, t?, a}], kazanimAd: {kod: ad}, sonMetin }
  GG.sinavSayfasi = function (ayar) {
    var banka = ayar.banka;
    // her soru için seçenek sırası bir kez karıştırılır; ekran, soru kâğıdı ve cevap anahtarı aynı sırayı kullanır
    var sira = banka.map(function (q) { return q.o ? GG.karistir(q.o.map(function (x, i) { return i; })) : null; });
    var s = el('div', { sinif: 'sayfa' });
    s.appendChild(el('div', { sinif: 'ust-cubuk' }, [
      GG.ui.dugme('◀ Harita', function () { GG.git(''); }, 'kucuk'),
      el('div', { sinif: 'ust-baslik' }, [el('span', { sinif: 'ust-yil', metin: 'FİNAL' }), el('span', { sinif: 'ust-kisi', metin: ayar.baslik })])
    ]));
    var ic = el('div', { stil: 'max-width:62rem' });
    s.appendChild(ic);
    var kodlar = Object.keys(ayar.kazanimAd);

    function giris() {
      GG.bosalt(ic);
      ic.appendChild(el('h1', { metin: '📝 ' + ayar.baslik }));
      ic.appendChild(el('p', { html: ayar.giris }));
      var kart = el('section', { stil: 'background:var(--yuzey);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:var(--golge)' });
      var adet = 20, filtre = 'hepsi';
      kart.appendChild(GG.ui.secici({ etiket: 'Soru sayısı', deger: '20', secenekler: [{ id: '10', ad: '10 soru' }, { id: '20', ad: '20 soru' }, { id: 'hepsi', ad: 'Bütün sorular' }], degisti: function (v) { adet = v === 'hepsi' ? 999 : Number(v); } }).kok);
      kart.appendChild(el('div', { stil: 'height:.5rem' }));
      kart.appendChild(GG.ui.secici({ etiket: 'Kazanım', deger: 'hepsi', secenekler: [{ id: 'hepsi', ad: 'Hepsi' }].concat(kodlar.map(function (k) { return { id: k, ad: k.replace('KİM.', '') }; })), degisti: function (v) { filtre = v; } }).kok);
      kart.appendChild(el('p', { sinif: 'ipucu-metin', html: 'Bankada <b>' + banka.length + '</b> soru var. Sorular her kazanımdan dengeli seçilir ve her sınavda karışık sırayla gelir.' }));
      kart.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem' }, [
        GG.ui.dugme('▶ Sınavı başlat', function () { basla(sec(adet, filtre)); }, 'ana'),
        GG.ui.dugme('🖨 Soru kâğıdı', function () { yazdir(false, filtre); }),
        GG.ui.dugme('🖨 Cevap anahtarı', function () { yazdir(true, filtre); })
      ]));
      kart.classList.add('acik-zemin');
      ic.appendChild(kart);
    }
    function sec(adet, filtre) {
      var havuz = banka.map(function (q, i) { return i; }).filter(function (i) { return filtre === 'hepsi' || banka[i].k === filtre; });
      if (adet >= havuz.length) return GG.karistir(havuz);
      // kazanımlara dengeli dağıt
      var gruplar = {};
      havuz.forEach(function (i) { (gruplar[banka[i].k] = gruplar[banka[i].k] || []).push(i); });
      Object.keys(gruplar).forEach(function (k) { gruplar[k] = GG.karistir(gruplar[k]); });
      var secilen = [], anahtarlar = Object.keys(gruplar), j = 0;
      while (secilen.length < adet) { var g = gruplar[anahtarlar[j % anahtarlar.length]]; if (g.length) secilen.push(g.shift()); j++; if (j > adet * anahtarlar.length + 50) break; }
      return GG.karistir(secilen);
    }
    function basla(liste, onceki) {
      var no = 0, sonuc = [];
      function goster() {
        GG.bosalt(ic);
        if (no >= liste.length) return bitir();
        var qi = liste[no], q = banka[qi];
        ic.appendChild(el('div', { stil: 'display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:.6rem 0' }, [
          el('b', { stil: 'font-size:1.1rem', metin: 'Soru ' + (no + 1) + ' / ' + liste.length }),
          el('span', { sinif: 'etiket-cip', metin: q.k + ' · ' + ayar.kazanimAd[q.k] })
        ]));
        var cubuk = el('div', { stil: 'height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden' }, el('div', { stil: 'height:100%;width:' + Math.round(100 * no / liste.length) + '%;background:var(--renk)' }));
        ic.appendChild(cubuk);
        var kart = el('section', { stil: 'background:var(--yuzey);border-radius:14px;padding:1.1rem 1.3rem;margin:1rem 0;box-shadow:var(--golge);font-size:1.15rem' });
        kart.appendChild(el('div', { stil: 'font-weight:700;margin-bottom:.7rem;line-height:1.45', html: q.s }));
        var geri = el('div'), sonraki = GG.ui.dugme(no + 1 < liste.length ? 'Sonraki soru ▶' : 'Sonucu gör ▶', function () { no++; goster(); }, 'ana');
        sonraki.style.display = 'none';
        function cevapla(dogru, verilen) {
          sonuc.push({ qi: qi, dogru: dogru, verilen: verilen });
          geri.appendChild(el('div', { sinif: 'geri-bildirim ' + (dogru ? 'iyi' : 'dusun'), html: (dogru ? '<b>Doğru!</b> ' : '<b>Yanlış.</b> ' + (q.o ? 'Doğru cevap: <b>' + q.o[q.d] + '</b>. ' : 'Doğru cevap: <b>' + sayiYaz(q.n) + (q.b ? ' ' + q.b : '') + '</b>. ')) + (q.a || '') }));
          sonraki.style.display = '';
        }
        if (q.o) {
          var dugmeler = [];
          sira[qi].forEach(function (oi, j) {
            var d = el('button', { sinif: 'secenek', type: 'button', html: '<b>' + HARF[j] + ')</b> ' + q.o[oi] });
            d.addEventListener('click', function () {
              if (sonraki.style.display === '') return;
              dugmeler.forEach(function (x) { x.d.disabled = true; if (x.oi === q.d) x.d.classList.add('dogru'); });
              if (oi !== q.d) d.classList.add('yanlis');
              cevapla(oi === q.d, q.o[oi]);
            });
            dugmeler.push({ d: d, oi: oi });
            kart.appendChild(d);
          });
        } else {
          var gir = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': 'Cevap', stil: 'font-size:1.4rem;padding:.35rem .6rem;width:12rem;border-radius:10px;border:2px solid var(--cizgi);font-family:inherit' });
          kart.appendChild(el('div', { stil: 'display:flex;align-items:center;gap:.6rem;flex-wrap:wrap' }, [gir, el('b', { html: q.b || '' })]));
          var tus = el('div', { stil: 'display:grid;grid-template-columns:repeat(4,3.6rem);gap:.3rem;margin:.4rem 0' });
          ['7', '8', '9', '⌫', '4', '5', '6', '×10^', '1', '2', '3', '−', '0', ','].forEach(function (k) { tus.appendChild(el('button', { type: 'button', sinif: 'dugme kucuk', stil: 'min-width:0;font-size:1.15rem;padding:.35rem 0', html: k, onclick: function () { if (k === '⌫') gir.value = gir.value.slice(0, -1); else gir.value += (k === '−' ? '-' : k); } })); });
          kart.appendChild(tus);
          var kd = GG.ui.dugme('Kontrol et', function () {
            var v = GG.sayiOku(gir.value);
            if (isNaN(v)) { GG.bosalt(geri); geri.appendChild(el('div', { sinif: 'geri-bildirim dusun', metin: 'Bir sayı yaz. Örnek: 18 ya da 1,2×10^24' })); return; }
            GG.bosalt(geri); kd.disabled = true; gir.disabled = true;
            var t = q.t == null ? 0.02 : q.t, dg = Math.abs(v - q.n) <= Math.abs(q.n) * t + 1e-12;
            gir.style.borderColor = dg ? 'var(--dogru)' : 'var(--yanlis)';
            cevapla(dg, gir.value);
          }, 'ana');
          gir.addEventListener('keydown', function (e) { if (e.key === 'Enter') kd.click(); });
          kart.appendChild(kd);
        }
        kart.appendChild(geri);
        kart.appendChild(el('div', { stil: 'margin-top:.7rem' }, sonraki));
        ic.appendChild(kart);
        kart.scrollIntoView({ block: 'nearest' });
      }
      function bitir() {
        GG.durum.tamam.final = true; GG.kaydet();
        var dogru = sonuc.filter(function (r) { return r.dogru; }).length;
        ic.appendChild(el('h1', { metin: '🏁 Sınav bitti' }));
        var yuzde = Math.round(100 * dogru / sonuc.length);
        ic.appendChild(el('section', { stil: 'background:linear-gradient(135deg,#172031,var(--renk));color:#fff;border-radius:14px;padding:1.2rem 1.4rem;margin:1rem 0' }, [
          el('div', { stil: 'font-size:2.6rem;font-weight:800', metin: dogru + ' / ' + sonuc.length }),
          el('div', { stil: 'font-size:1.1rem', metin: 'Doğru oranı: %' + yuzde + (yuzde >= 85 ? ' · Konuyu çok iyi kavramışsın!' : (yuzde >= 60 ? ' · İyi gidiyorsun; yanlışlarını gözden geçir.' : ' · İlgili durakları tekrar gezmeni öneririz.')) })
        ]));
        var satirlar = kodlar.map(function (k) {
          var r = sonuc.filter(function (x) { return banka[x.qi].k === k; });
          if (!r.length) return null;
          var d = r.filter(function (x) { return x.dogru; }).length;
          return [k + ' ' + ayar.kazanimAd[k], d + ' / ' + r.length, (d / r.length >= 0.75 ? '✔ öğrenilmiş' : (d / r.length >= 0.5 ? '◐ tekrar etmeli' : '✖ yeniden çalışmalı'))];
        }).filter(Boolean);
        ic.appendChild(el('h2', { metin: 'Kazanımlara göre sonuç' }));
        ic.appendChild(GG.tabloYap({ sinif: 'genis-tablo', sutunlar: ['Öğrenme çıktısı', 'Doğru', 'Durum'], satirlar: satirlar }));
        var yanlis = sonuc.filter(function (r) { return !r.dogru; });
        if (yanlis.length) {
          ic.appendChild(el('h2', { metin: 'Yanlış cevaplanan sorular' }));
          yanlis.forEach(function (r) {
            var q = banka[r.qi];
            ic.appendChild(el('div', { sinif: 'kanit-kart', stil: 'margin:.5rem 0' }, [
              el('div', { html: '<b>' + q.s + '</b>' }),
              el('div', { html: 'Senin cevabın: ' + kacis(r.verilen) + ' · Doğru cevap: <b>' + (q.o ? q.o[q.d] : sayiYaz(q.n) + (q.b ? ' ' + q.b : '')) + '</b>' }),
              q.a ? el('div', { sinif: 'ipucu-metin', html: q.a }) : null
            ]));
          });
        }
        ic.appendChild(el('div', { stil: 'display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0' }, [
          yanlis.length ? GG.ui.dugme('↻ Yanlışları yeniden çöz', function () { basla(GG.karistir(yanlis.map(function (r) { return r.qi; }))); }, 'ana') : null,
          GG.ui.dugme('Yeni sınav', giris),
          GG.ui.dugme(GG.OYUN.muze.dugme, function () { GG.git('muze'); }),
          GG.ui.dugme('Haritaya dön', function () { GG.git(''); })
        ]));

<script>/* js/cizimler.js */
/* Tepkimenin İzinde — Bulgu Duvarı çizimleri */
'use strict';
(function () {
  var C = GG.ciz;
  function yazi(ctx, s, x, y, b, renk, hiza, kalin) {
    hiza = hiza || 'center';
    var W = ctx.canvas.width / (ctx.getTransform().a || 1);
    var bos = hiza === 'center' ? 2 * Math.min(x, W - x) : (hiza === 'left' ? W - x : x);
    ctx.font = GG.font(b, kalin);
    var gen = ctx.measureText(s).width;
    if (gen > bos * 0.96) b = Math.max(8, b * bos * 0.96 / gen);
    C.yazi(ctx, s, x, y, { boyut: b, renk: renk || '#e2e8f0', hiza: hiza, kalin: kalin });
  }
  function fsz(w, h) { return Math.max(11, Math.min(24, Math.min(w / 30, h / 18))); }
  function alt(ctx, w, h, f, metin) { yazi(ctx, metin, w / 2, h - f * 1.1, f * 0.8, '#cbd5e1'); }
  function top(ctx, x, y, r, renk, ad) { C.kure(ctx, x, y, r, renk, '#ffffff'); if (ad) yazi(ctx, ad, x, y, Math.max(8, r * 0.8), '#0f172a', 'center', true); }

  GG.modelKaydet('b-kanit', {
    ad: 'Kimyasal değişimin kanıtları',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h);
      [['🔥', 'Enerji değişimi', 'ısı, ışık'], ['🫧', 'Gaz çıkışı', 'kabarcık, köpük'], ['🎨', 'Renk değişimi', 'yeni renk'], ['🧱', 'Yeni katı', 'çökelek']].forEach(function (q, i) {
        var x = w * (0.14 + i * 0.24);
        yazi(ctx, q[0], x, h * 0.26, f * 2);
        yazi(ctx, q[1], x, h * 0.45, f * 0.85, '#fde68a', 'center', true);
        yazi(ctx, q[2], x, h * 0.56, f * 0.7, '#cbd5e1');
      });
      yazi(ctx, 'Gösterge bir ipucudur; kesin kanıt yeni bir maddenin oluşmasıdır.', w / 2, h * 0.72, f * 0.8, '#86efac', 'center', true);
      alt(ctx, w, h, f, 'Kaynamada gaz, tuzun çözünmesinde enerji değişimi görülebilir; ama yeni madde oluşmaz.');
    }
  });
  GG.modelKaydet('b-tanecik', {
    ad: 'Üç düzeyde tepkime',
    ciz: function (ctx, w, h) {

        var x = w * (0.18 + i * 0.32);
        ctx.fillStyle = ['rgba(180,83,9,0.35)', 'rgba(124,58,237,0.35)', 'rgba(15,118,110,0.35)'][i]; C.yd(ctx, x - w * 0.15, h * 0.14, w * 0.3, h * 0.5, 12); ctx.fill();
        yazi(ctx, q[0], x, h * 0.24, f, '#fde68a', 'center', true);

      });
      top(ctx, w * 0.5, h * 0.37, f * 0.6, '#6b7280', 'C'); top(ctx, w * 0.5 - f * 1.1, h * 0.37, f * 0.5, '#ef4444', 'O'); top(ctx, w * 0.5 + f * 1.1, h * 0.37, f * 0.5, '#ef4444', 'O');
      alt(ctx, w, h, f, 'Gözlenen olay, taneciklerin yeniden düzenlenmesiyle açıklanır ve sembollerle yazılır.');
    }
  });
  GG.modelKaydet('b-model', {
    ad: 'Tepkime modeli',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h), r = f * 0.8, y0 = h * 0.36;
      top(ctx, w * 0.1, y0, r, '#f8fafc', 'H'); top(ctx, w * 0.1 + r * 1.5, y0, r, '#f8fafc', 'H');
      top(ctx, w * 0.1, y0 + r * 2.6, r * 1.2, '#4ade80', 'Cl'); top(ctx, w * 0.1 + r * 1.8, y0 + r * 2.6, r * 1.2, '#4ade80', 'Cl');

      yazi(ctx, 'H₂ + Cl₂ → 2HCl', w / 2, h * 0.14, f * 1.1, '#e2e8f0', 'center', true);

  GG.modelKaydet('b-cokelme', {
    ad: 'Çökelme tepkimesi',

  GG.modelKaydet('b-redoks', {
    ad: 'İndirgenme-yükseltgenme',

      top(ctx, w * 0.22, h * 0.42, f * 1.1, '#9ca3af', 'Fe'); top(ctx, w * 0.78, h * 0.42, f * 1.1, '#60a5fa', 'Cu²⁺');
      for (var i = 0; i < 2; i++) C.daire(ctx, w * (0.42 + i * 0.08), h * 0.42, f * 0.3, '#fde047');
      yazi(ctx, '2e⁻ →', w * 0.5, h * 0.3, f, '#fde047', 'center', true);
      yazi(ctx, 'yükseltgenir (e⁻ verir)', w * 0.22, h * 0.6, f * 0.75, '#fca5a5', 'center', true);
      yazi(ctx, 'indirgenir (e⁻ alır)', w * 0.78, h * 0.6, f * 0.75, '#93c5fd', 'center', true);
      alt(ctx, w, h, f, 'Elektron verme ve alma birlikte olur; verilen ve alınan elektron sayısı eşittir.');
    }
  });
  GG.modelKaydet('b-asitbaz', {
    ad: 'Asit-baz tepkimesi',
    ciz: function (ctx, w, h) {
      var f = fsz(w, h);
      yazi(ctx, 'HCl(suda) + NaOH(suda) → NaCl(suda) + H₂O(s)', w / 2, h * 0.14, f, '#e2e8f0', 'center', true);

      top(ctx, w * 0.43, h * 0.42, f * 0.9, '#93c5fd', 'OH⁻'); yazi(ctx, '→', w * 0.53, h * 0.42, f * 1.3);
      top(ctx, w * 0.64, h * 0.42, f * 0.9, '#e2e8f0', 'H₂O');
      yazi(ctx, '+ ısı', w * 0.76, h * 0.42, f, '#fca5a5', 'left', true);
      yazi(ctx, 'Belirteç renk değiştirir · sıcaklık artar · pH 7’ye yaklaşır', w / 2, h * 0.66, f * 0.78, '#86efac', 'center', true);
      alt(ctx, w, h, f, 'Na⁺ ve Cl⁻ seyirci iyonlardır. Asidin H⁺’sı ile bazın OH⁻’ı su oluşturur.');
    }
  });
})();

  function cizelge(ctx, x, y, gen, basliklar, kol, satirlar, fs, sat) {

  function rgb(a, al) { return 'rgba(' + a.join(',') + ',' + (al == null ? 1 : al) + ')'; }

    ctx.strokeStyle = 'rgba(226,232,240,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y); ctx.stroke();
  }

    { id: 'buzkesesi', ad: 'Amonyum nitratın suda çözünmesi (anlık soğuk kese)', ikon: '❄️', tip: 'soguma', z: '', s: 'EGRK', kim: false, not: 'Karışım soğudu (enerji değişimi), ama amonyum nitrat yalnızca suda dağıldı; yeni bir madde oluşmadı.' }
  ];
  var KISA = { karbonat: 'Karbonat + sirke', mg: 'Mg yanması', cuoh: 'CuSO₄ + NaOH', agcl: 'AgNO₃ + NaCl', civi: 'Çivi + CuSO₄', mum: 'Mum yanması', maya: 'H₂O₂ + maya', notr: 'Asit + baz', pas: 'Paslanma', yumurta: 'Yumurta pişmesi', kaynama: 'Su kaynaması', buz: 'Buz erimesi', tuz: 'Tuz çözünmesi', buzkesesi: 'Soğuk kese' };
  var GOS = [{ id: 'E', ad: '🔥 Enerji değişimi' }, { id: 'G', ad: '🫧 Gaz çıkışı' }, { id: 'R', ad: '🎨 Renk değişimi' }, { id: 'K', ad: '🧱 Yeni katı' }];
  GG.simKaydet('kanit', function (kap, api) {
